# Профиль установки LORE с нуля (SPRINT_LORE_PRODUCT_BACKLOG/SELF-PROVISION-STANDALONE).
#
# Самодостаточный стек для чужой/чистой машины: своя ArcadeDB, бэкенд, фронт v2,
# MinIO для вложений. Ничего не знает о нашей инфраструктуре (Keycloak,
# Infisical, Forgejo, Traefik) — в отличие от корневого docker-compose.yml.
#
# Ставится инсталлятором deploy/install/install.sh — он пишет .env из
# .env.example (пароли генерирует сам), создаёт базу и проверяет результат.
# Руками: см. deploy/install/README.md.
#
# Схема: LORE_BOOTSTRAP здесь не нужен. На пустой базе ядро поднимается само
# (decision D-2026-LORE-AUTO-BOOTSTRAP-CORE, LoreSchemaInitializer), продуктовый
# слой и справочники добирают шаги миграций (lore.migrate=true на каждом старте —
# повторный запуск инсталлятора = обновление).
#
# Вход: аутентификации нет (LORE_AUTH_ENABLED=false) — поэтому порт фронта по
# умолчанию слушает только 127.0.0.1. Наружу — через свой reverse proxy с TLS
# и авторизацией, либо LORE_BIND=0.0.0.0 осознанно.
name: ${COMPOSE_PROJECT_NAME:-lore}

services:
  arcadedb:
    image: arcadedata/arcadedb:${ARCADEDB_VERSION:-26.11.1}
    restart: unless-stopped
    environment:
      # Пароль root приходит из .env и в файлы не пишется.
      - JAVA_OPTS=-Darcadedb.server.rootPassword=${ARCADEDB_ROOT_PASSWORD:?ARCADEDB_ROOT_PASSWORD не задан}
    volumes:
      - lore-db:/home/arcadedb/databases
      - lore-db-backups:/home/arcadedb/backups
    # Порт наружу не публикуется: бэкенд ходит по сети compose, инсталлятор —
    # одноразовым curl-контейнером в той же сети.

  # Сторож входов в ArcadeDB (SPRINT_LORE_PRODUCT_BACKLOG/DBR-07, deploy/db-guard/README.md).
  # Прокси перед arcadedb:2480: из Authorization берёт только имя, пишет первый вход пары
  # «пользователь × источник» за минуту в ряд AuditDbLogin своим токеном (не root), root вне
  # GUARD_ROOT_SOURCES — тревога (канал пока не подключён — только журнал).
  # ЭТАП 6 (D-2026-SETUP-BEFORE-ENFORCE, с разрешения владелицы): пустить бэкенд через сторожа
  # (LORE_DB_ENDPOINT=lore-db-guard) и закрыть прямой :2480. До этого клиенты ходят мимо — ряд неполон.
  # Включается профилем: COMPOSE_PROFILES=guard (образ собирается из исходников; в ghcr его нет).
  lore-db-guard:
    profiles: ["guard"]
    image: ${LORE_DB_GUARD_IMAGE:-lore-install-db-guard:${LORE_VERSION:-local}}
    build:
      context: ${LORE_SRC:-../..}/deploy/db-guard
    restart: unless-stopped
    depends_on:
      - arcadedb
    environment:
      - GUARD_UPSTREAM=http://arcadedb:2480
      - GUARD_DB=${LORE_DB:-system_aida_lore}
      # Токен ArcadeDB группы db-guard (только createRecord на AuditDbLogin). Пусто — сторож видит
      # входы и тревожит, но ряд не пишет (громко в журнале). Под root сторож не стартует.
      - GUARD_DB_AUTH=${LORE_DB_GUARD_AUTH:-}
      - GUARD_ROOT_SOURCES=${LORE_DB_GUARD_ROOT_SOURCES:-lore-backend}
      - GUARD_TOKEN_NAMES=${LORE_DB_GUARD_TOKEN_NAMES:-}
      # Имя контейнера по адресу — через docker API. Сокет по умолчанию не подключён: доступ к нему —
      # это доступ ко всему docker; подключать осознанно (volumes ниже) и задать путь здесь.
      - GUARD_DOCKER_SOCKET=${LORE_DB_GUARD_DOCKER_SOCKET:-}
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock:ro

  minio:
    image: minio/minio:${MINIO_VERSION:-latest}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-lore}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:?MINIO_PASSWORD не задан}
    volumes:
      - lore-minio-data:/data

  lore-backend:
    # Образ: свой реестр (LORE_BACKEND_IMAGE) или сборка из исходников на теге.
    image: ${LORE_BACKEND_IMAGE:-lore-install-backend:${LORE_VERSION:-local}}
    build:
      context: ${LORE_SRC:-../..}/backend
      dockerfile: Dockerfile.local
      args:
        LORE_BUILD_COMMIT: ${LORE_BUILD_COMMIT:-}
        # Вход через Keycloak — по выбору (MIG-04). OIDC впекается в образ на сборке, поэтому флаг и адрес
        # области — build-args; тот же флаг нужен и в окружении (фильтр ролей читает его в рантайме).
        LORE_AUTH_ENABLED: ${LORE_AUTH_ENABLED:-false}
        LORE_OIDC_ISSUER: ${LORE_OIDC_ISSUER:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: unless-stopped
    depends_on:
      - arcadedb
      - minio
    environment:
      # DBR-07: lore-db-guard вместо arcadedb — Этап 6, с разрешения владелицы; по умолчанию напрямую.
      - MART_ARCADE_URL=http://${LORE_DB_ENDPOINT:-arcadedb}:2480
      - ARCADEDB_USER=root
      - ARCADEDB_ROOT_PASSWORD=${ARCADEDB_ROOT_PASSWORD}
      - LORE_DB=${LORE_DB:-system_aida_lore}
      - LORE_RELEASE_TAG=${LORE_VERSION:-}
      # Пусто в .env → false, как раньше (вход выключен). Пустая строка без умолчания уронила бы разбор boolean.
      - LORE_AUTH_ENABLED=${LORE_AUTH_ENABLED:-false}
      - LORE_OIDC_ISSUER=${LORE_OIDC_ISSUER:-}
      # Völva — встроенные графики (по выбору): адрес, издатель; ключи ES256 — секреты, в .env установки.
      - LORE_VOLVA_EMBED_SITE_URL=${LORE_VOLVA_EMBED_SITE_URL:-}
      - LORE_VOLVA_EMBED_ISSUER=${LORE_VOLVA_EMBED_ISSUER:-}
      - LORE_VOLVA_EMBED_ES256_PRIVATE_KEY=${LORE_VOLVA_EMBED_ES256_PRIVATE_KEY:-}
      - LORE_VOLVA_EMBED_ES256_PUBLIC_KEY=${LORE_VOLVA_EMBED_ES256_PUBLIC_KEY:-}
      - lore.secrets.provider=env
      # Схема накатывается на каждом старте под root; бэкап перед накаткой
      # пишется в том lore-db-backups (на пустой базе пропускается сам).
      - lore.migrate=true
      - lore.mart.auth=basic
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-bragi-assets}
      - S3_ACCESS_KEY=${MINIO_USER:-lore}
      - S3_SECRET_KEY=${MINIO_PASSWORD}
      - S3_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9100/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Первый старт на пустой базе катит ядро и все шаги схемы — это минуты.
      start_period: 300s

  lore-app-next:
    image: ${LORE_WEB_IMAGE:-lore-install-web:${LORE_VERSION:-local}}
    build:
      context: ${LORE_SRC:-../..}
      dockerfile: web-next/Dockerfile
      args:
        VITE_LORE_BUILD_COMMIT: ${LORE_BUILD_COMMIT:-}
        # Vite впекает вход в бандл — флипать вместе с бэкендом, тем же значением.
        VITE_LORE_AUTH_ENABLED: ${LORE_AUTH_ENABLED:-false}
        VITE_OIDC_ISSUER: ${LORE_OIDC_ISSUER:-}
        VITE_OIDC_CLIENT_ID: ${LORE_OIDC_CLIENT_ID:-lore-app}
    restart: unless-stopped
    environment:
      LORE_PUBLIC_URL: ${LORE_PUBLIC_URL:-}
      LORE_OIDC_ORIGIN: ${LORE_OIDC_ORIGIN:-}
      LORE_VOLVA_ORIGIN: ${LORE_VOLVA_ORIGIN:-}
      LORE_BACKEND_URL: ""
      LORE_BACKEND_HOST: ""
      LORE_FRONT: v2
    ports:
      - "${LORE_BIND:-127.0.0.1}:${LORE_HTTP_PORT:-4400}:80"
    depends_on:
      lore-backend:
        condition: service_healthy

volumes:
  lore-db:
  lore-db-backups:
  lore-minio-data:
