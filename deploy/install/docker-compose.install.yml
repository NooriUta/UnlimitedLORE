# Профиль установки LORE с нуля (SPRINT_LORE_PRODUCT_BACKLOG/SELF-PROVISION-STANDALONE).
#
# Самодостаточный стек для чужой/чистой машины: своя ArcadeDB, бэкенд, фронт v2,
# файлы — своё S3 владельца или без файлов. Ничего не знает о нашей инфраструктуре (Keycloak,
# Infisical, Forgejo, Traefik) — в отличие от корневого docker-compose.yml.
#
# Ставится инсталлятором deploy/install/install.sh — он пишет .env из
# .env.example (пароли генерирует сам), создаёт базу и проверяет результат.
# Руками: см. deploy/install/README.md.
#
# Схема: LORE_BOOTSTRAP здесь не нужен. На пустой базе ядро поднимается само
# (decision D-2026-LORE-AUTO-BOOTSTRAP-CORE, LoreSchemaInitializer), продуктовый
# слой и справочники добирают шаги миграций (lore.migrate=true на каждом старте —
# повторный запуск инсталлятора = обновление).
#
# Вход: аутентификации нет (LORE_AUTH_ENABLED=false) — поэтому порт фронта по
# умолчанию слушает только 127.0.0.1. Наружу — через свой reverse proxy с TLS
# и авторизацией, либо LORE_BIND=0.0.0.0 осознанно.
name: ${COMPOSE_PROJECT_NAME:-lore}

services:
  arcadedb:
    image: arcadedata/arcadedb:${ARCADEDB_VERSION:-26.11.1}
    restart: unless-stopped
    environment:
      # Пароль root приходит из .env и в файлы не пишется.
      - JAVA_OPTS=-Darcadedb.server.rootPassword=${ARCADEDB_ROOT_PASSWORD:?ARCADEDB_ROOT_PASSWORD не задан}
    volumes:
      - lore-db:/home/arcadedb/databases
      - lore-db-backups:/home/arcadedb/backups
    # Порт наружу не публикуется: бэкенд ходит по сети compose, инсталлятор —
    # одноразовым curl-контейнером в той же сети.

  # Сторож входов в ArcadeDB (SPRINT_LORE_PRODUCT_BACKLOG/DBR-07, deploy/db-guard/README.md).
  # Прокси перед arcadedb:2480: из Authorization берёт только имя, пишет первый вход пары
  # «пользователь × источник» за минуту в ряд AuditDbLogin своим токеном (не root), root вне
  # GUARD_ROOT_SOURCES — тревога (канал пока не подключён — только журнал).
  # ЭТАП 6 (D-2026-SETUP-BEFORE-ENFORCE, с разрешения владелицы): пустить бэкенд через сторожа
  # (LORE_DB_ENDPOINT=lore-db-guard) и закрыть прямой :2480. До этого клиенты ходят мимо — ряд неполон.
  # Включается профилем: COMPOSE_PROFILES=guard (образ собирается из исходников; в ghcr его нет).
  lore-db-guard:
    profiles: ["guard"]
    image: ${LORE_DB_GUARD_IMAGE:-lore-install-db-guard:${LORE_VERSION:-local}}
    build:
      context: ${LORE_SRC:-../..}/deploy/db-guard
    restart: unless-stopped
    depends_on:
      - arcadedb
    environment:
      - GUARD_UPSTREAM=http://arcadedb:2480
      - GUARD_DB=${LORE_DB:-system_aida_lore}
      # Токен ArcadeDB группы db-guard (только createRecord на AuditDbLogin). Пусто — сторож видит
      # входы и тревожит, но ряд не пишет (громко в журнале). Под root сторож не стартует.
      - GUARD_DB_AUTH=${LORE_DB_GUARD_AUTH:-}
      - GUARD_ROOT_SOURCES=${LORE_DB_GUARD_ROOT_SOURCES:-lore-backend}
      - GUARD_TOKEN_NAMES=${LORE_DB_GUARD_TOKEN_NAMES:-}
      # Имя контейнера по адресу — через docker API. Сокет по умолчанию не подключён: доступ к нему —
      # это доступ ко всему docker; подключать осознанно (volumes ниже) и задать путь здесь.
      - GUARD_DOCKER_SOCKET=${LORE_DB_GUARD_DOCKER_SOCKET:-}
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock:ro

  # Файлы (вложения, аватары, ассеты BRAGI) — своё S3 владельца или «без файлов» (решение владелицы 21.11.2026: «пока
  # ставь указать s3 хранилище или без опции файлов»). Своего хранилища пакет не ставит: Docker Hub перестал отдавать
  # образ MinIO. Без S3 бэкенд стартует, а двери файлов отвечают 503 «хранилище файлов не подключено».

  lore-backend:
    # Образ: свой реестр (LORE_BACKEND_IMAGE) или сборка из исходников на теге.
    image: ${LORE_BACKEND_IMAGE:-lore-install-backend:${LORE_VERSION:-local}}
    build:
      context: ${LORE_SRC:-../..}/backend
      dockerfile: Dockerfile.local
      args:
        LORE_BUILD_COMMIT: ${LORE_BUILD_COMMIT:-}
        # Вход через Keycloak — по выбору (MIG-04). OIDC впекается в образ на сборке, поэтому флаг и адрес
        # области — build-args; тот же флаг нужен и в окружении (фильтр ролей читает его в рантайме).
        LORE_AUTH_ENABLED: ${LORE_AUTH_ENABLED:-false}
        LORE_OIDC_ISSUER: ${LORE_OIDC_ISSUER:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        # Зеркала Maven и Gradle (Dockerfile.local умеет их сам): закрытая сеть или деградированный прямой канал.
        # Пусто — сборка идёт в Maven Central и Gradle Plugin Portal напрямую, как раньше. Без этих переменных
        # установка «собрать самому» на такой машине падает невнятным «Plugin [id: io.quarkus] was not found»
        # (замер на машине с деградированным каналом: половина запросов к публичным репозиториям обрывалась).
        LORE_MAVEN_MIRROR: ${LORE_MAVEN_MIRROR:-}
        LORE_PLUGIN_MIRROR: ${LORE_PLUGIN_MIRROR:-}
        LORE_GRADLE_DIST_MIRROR: ${LORE_GRADLE_DIST_MIRROR:-}
    restart: unless-stopped
    depends_on:
      - arcadedb
    environment:
      # DBR-07: lore-db-guard вместо arcadedb — Этап 6, с разрешения владелицы; по умолчанию напрямую.
      - MART_ARCADE_URL=http://${LORE_DB_ENDPOINT:-arcadedb}:2480
      - ARCADEDB_USER=root
      - ARCADEDB_ROOT_PASSWORD=${ARCADEDB_ROOT_PASSWORD}
      - LORE_DB=${LORE_DB:-system_aida_lore}
      - LORE_RELEASE_TAG=${LORE_VERSION:-}
      # Пусто в .env → false, как раньше (вход выключен). Пустая строка без умолчания уронила бы разбор boolean.
      - LORE_AUTH_ENABLED=${LORE_AUTH_ENABLED:-false}
      - LORE_OIDC_ISSUER=${LORE_OIDC_ISSUER:-}
      # Völva — встроенные графики (по выбору): адрес, издатель; ключи ES256 — секреты, в .env установки.
      - LORE_VOLVA_EMBED_SITE_URL=${LORE_VOLVA_EMBED_SITE_URL:-}
      - LORE_VOLVA_EMBED_ISSUER=${LORE_VOLVA_EMBED_ISSUER:-}
      - LORE_VOLVA_EMBED_ES256_PRIVATE_KEY=${LORE_VOLVA_EMBED_ES256_PRIVATE_KEY:-}
      - LORE_VOLVA_EMBED_ES256_PUBLIC_KEY=${LORE_VOLVA_EMBED_ES256_PUBLIC_KEY:-}
      - lore.secrets.provider=env
      # Схема накатывается на каждом старте под root; бэкап перед накаткой
      # пишется в том lore-db-backups (на пустой базе пропускается сам).
      - lore.migrate=${LORE_MIGRATE:-true}
      - lore.mart.auth=basic
      # Своё S3 — из шага «Хранилище файлов» install.sh (--files s3); пусто — «без файлов».
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      # Мост Forgejo (ADR-LORE-024) — по выбору (MIG-04): токен вписывает владелец в .env, пусто — /lore/forgejo/*
      # отвечает 503, как без Forgejo. Адрес репозитория — из регистрации проекта (KnowGitProject.hosts[]); для
      # localhost-адреса бэкенд ходит на base-override (своя установка — http://forgejo:3000).
      - FORGEJO_API_TOKEN=${FORGEJO_API_TOKEN:-}
      - lore.forgejo.base-override=${FORGEJO_BASE_OVERRIDE:-}
      # Локальная LLM для гейтов качества (QG-15) — по выбору (MIG-04, README «Локальная LLM»). Пустая модель —
      # провайдер честно отвечает «не настроен». Адрес без /v1: клиент дописывает /v1/chat/completions сам; умолчание
      # то же, что в application.properties. Ключ нужен, только если раннер его требует.
      - LORE_LLM_LOCAL_URL=${LORE_LLM_LOCAL_URL:-http://localhost:11434}
      - LORE_LLM_LOCAL_MODEL=${LORE_LLM_LOCAL_MODEL:-}
      - LORE_LLM_LOCAL_API_KEY=${LORE_LLM_LOCAL_API_KEY:-}
    # Сервер модели на той же машине, что и LORE: из контейнера он виден как host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9100/q/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Первый старт на пустой базе катит ядро и все шаги схемы — это минуты.
      start_period: 300s

  lore-app-next:
    image: ${LORE_WEB_IMAGE:-lore-install-web:${LORE_VERSION:-local}}
    build:
      context: ${LORE_SRC:-../..}
      dockerfile: web-next/Dockerfile
      args:
        VITE_LORE_BUILD_COMMIT: ${LORE_BUILD_COMMIT:-}
    restart: unless-stopped
    environment:
      # Вход — настройка ЗАПУСКА (SELF-PROVISION-STANDALONE): скрипт старта образа кладёт её в /config.json.
      # Смена — `docker compose up -d`, без пересборки; значения те же, что у бэкенда.
      LORE_AUTH_ENABLED: ${LORE_AUTH_ENABLED:-false}
      LORE_OIDC_ISSUER: ${LORE_OIDC_ISSUER:-}
      LORE_OIDC_CLIENT_ID: ${LORE_OIDC_CLIENT_ID:-lore-app}
      LORE_PUBLIC_URL: ${LORE_PUBLIC_URL:-}
      LORE_OIDC_ORIGIN: ${LORE_OIDC_ORIGIN:-}
      LORE_VOLVA_ORIGIN: ${LORE_VOLVA_ORIGIN:-}
      LORE_BACKEND_URL: ""
      LORE_BACKEND_HOST: ""
      LORE_FRONT: v2
    ports:
      - "${LORE_BIND:-127.0.0.1}:${LORE_HTTP_PORT:-4400}:80"
    depends_on:
      lore-backend:
        condition: service_healthy

  # MCP-сервер LORE для агентов (1.18.2, SELF-PROVISION-STANDALONE) — как на нашем проде: Streamable HTTP на 9200 в сети
  # compose, наружу только через nginx веба v2 — https://<хост>/mcp и /mcp/health. Своего порта нет.
  # Образ: свой реестр (LORE_MCP_IMAGE; мажор без --build — ghcr рядом с бэкендом и вебом) или сборка из mcp-server того
  # же тега. Секретов у сервиса нет: токен (Authorization: Bearer) или пару X-Lore-Client-Id/Secret присылает клиент;
  # для пары нужен адрес области LORE_OIDC_ISSUER (не секрет), без него вход парой отвечает 503, Bearer работает.
  lore-mcp:
    image: ${LORE_MCP_IMAGE:-lore-install-mcp:${LORE_VERSION:-local}}
    build:
      context: ${LORE_SRC:-../..}/mcp-server
      args:
        LORE_BUILD_COMMIT: ${LORE_BUILD_COMMIT:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: unless-stopped
    environment:
      - LORE_MCP_TRANSPORT=http
      - LORE_MCP_PORT=9200
      # Бэкенд — по имени в сети compose, мимо nginx.
      - LORE_BACKEND_URL=http://lore-backend:9100
      - LORE_OIDC_ISSUER=${LORE_OIDC_ISSUER:-}
      # Инструменты forgejo_* — только когда мост Forgejo настроен (FORGEJO_API_TOKEN у бэкенда): LORE_MCP_FORGEJO=true.
      - LORE_FORGEJO=${LORE_MCP_FORGEJO:-false}
    depends_on:
      lore-backend:
        condition: service_healthy

  # Forgejo — по выбору (MIG-04, владелица 20.11.2026: «установка Forgejo если нет нашей версии»). Профиль forgejo:
  # без него сервис не стартует. Версия — та же, что на нашем стенде. База — sqlite в томе forgejo-data; SSH выключен
  # (клон по http). Администратора владелец заводит в первом окне Forgejo — установщик паролей Forgejo не знает.
  forgejo:
    profiles: ["forgejo"]
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-17.0.2}
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__ROOT_URL=${FORGEJO_ROOT_URL:-http://127.0.0.1:3000/}
      - FORGEJO__server__DISABLE_SSH=true
    volumes:
      - forgejo-data:/data
    ports:
      - "${LORE_BIND:-127.0.0.1}:${FORGEJO_HTTP_PORT:-3000}:3000"

  # forgejo-mcp — MCP-сервер Forgejo для агентов (форк @ric_/forgejo-mcp 0.1.7 с инструментами Actions/CI, лицензия MIT).
  # Профиль forgejo-mcp: и при своей установке Forgejo, и при своём Forgejo владельца.
  # Образ: свой реестр (FORGEJO_MCP_IMAGE), архив образа из пакета или сборка. Сборка по умолчанию — из исходника,
  # который едет в пакете (src/forgejo-mcp-<коммит>.tar.gz) и распаковывается install.sh в ./forgejo-mcp-src;
  # FORGEJO_MCP_SRC — своя замена (каталог или git-адрес#коммит). Сетевого умолчания нет.
  # FORGEJO_TOKEN обязателен — без него сервер не стартует; install.sh тогда его не поднимает и говорит, что вписать.
  forgejo-mcp:
    profiles: ["forgejo-mcp"]
    image: ${FORGEJO_MCP_IMAGE:-lore-install-forgejo-mcp:bbe9f59c}
    build:
      context: ${FORGEJO_MCP_SRC:-./forgejo-mcp-src}
    restart: unless-stopped
    environment:
      - FORGEJO_URL=${FORGEJO_URL:-http://forgejo:3000}
      - FORGEJO_TOKEN=${FORGEJO_MCP_TOKEN:-}
      # Ключ входа агентов (Authorization: Bearer); install.sh генерирует его при включённом профиле.
      - FORGEJO_MCP_API_KEY=${FORGEJO_MCP_API_KEY:-}
      - PORT=3000
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      # get_job_log читает логи Actions прямо с тома Forgejo (REST для них нет). При своём Forgejo владельца том пуст —
      # инструмент отвечает «лог не найден», остальные работают.
      - forgejo-data:/forgejo-data:ro
    ports:
      - "${LORE_BIND:-127.0.0.1}:${FORGEJO_MCP_PORT:-4430}:3000"

  # miniLORE — сервер мобильного монитора сессий (AIDA/miniLore_serverside). Профиль minilore: ставится по выбору,
  # решение D-2026-INSTALL-MINILORE-IN-PACKAGE («включаем miniLORE в пакет», владелица 22.11.2026).
  #
  # Состав, который везём в этой версии: ТОЛЬКО сервер. Установщик шлюза (Windows/Linux) и приложение APK выйдут
  # следующей версией: у Mobilepoc труба сборки APK сейчас красная, а адрес обновлений трея снят с гвоздя лишь в
  # невлитой ветке. Раздавать файл, который не собрала труба, нельзя — друг не сможет его воспроизвести.
  #
  # База — та же ArcadeDB, что у LORE (так же, как на нашем проде): сервер заводит и использует свои базы
  # minilore и minilore_archive, чужих не трогает. Порт наружу не публикуется: miniLORE доступен только изнутри
  # установки, снаружи — через прокси владельца, если он его заводит.
  minilore-srv:
    profiles: ["minilore"]
    image: ${MINILORE_IMAGE:-git.seidrstudio.pro/minilore-ci/minilore_serverside:0.4.19}
    restart: unless-stopped
    # Просто «после ArcadeDB», без ожидания здоровья: у службы arcadedb в этом пакете healthcheck не объявлен,
    # и `condition: service_healthy` роняет весь запуск словами «container … has no healthcheck configured»
    # (поймано прогоном на чужой машине 22.11.2026). Готовность базы сервер miniLORE переживает сам: не достучался —
    # повторит. Так же сделаны lore-db-guard и lore-backend выше.
    depends_on:
      - arcadedb
    environment:
      # Вход — тот же Keycloak, что у LORE: отдельной области для miniLORE не заводим.
      - KC_ISSUER=${LORE_OIDC_ISSUER:-}
      - KC_AUDIENCE=${MINILORE_KC_AUDIENCE:-minilore-srv}
      # Клиент мобильного приложения В KEYCLOAK ВЛАДЕЛЬЦА. Умолчание Mobilepoc — mobilepoc-app — это НАШ клиент,
      # поэтому здесь его нет: без своего значения телефон владельца не войдёт, и лучше узнать это при установке.
      - MINILORE_APP_CLIENT_ID=${MINILORE_APP_CLIENT_ID:-}
      # Схема возврата вшита в APK манифестом (appAuthRedirectScheme) — менять её нельзя, её нужно ЗАВЕСТИ
      # в Keycloak владельца как redirect pro.seidrstudio.minilore://auth/callback (шаг мастера).
      - MINILORE_APP_AUTH_SCHEME=${MINILORE_APP_AUTH_SCHEME:-pro.seidrstudio.minilore}
      - MINILORE_ARCADE_URL=${MINILORE_ARCADE_URL:-http://arcadedb:2480}
      - MINILORE_ARCADE_USER=${MINILORE_ARCADE_USER:-root}
      # Двоеточия в тексте отказа тут нельзя: строка списка с «: » разбирается YAML как пара ключ-значение,
      # и compose падает «environment.[6]: unexpected type map» (поймано прогоном на чужой машине 22.11.2026).
      - "MINILORE_ARCADE_PASSWORD=${ARCADEDB_ROOT_PASSWORD:?нужен пароль ArcadeDB — miniLORE заводит свои базы}"
      - MINILORE_ARCADE_DATABASE=${MINILORE_ARCADE_DATABASE:-minilore}
      - MINILORE_ARCHIVE_DATABASE=${MINILORE_ARCHIVE_DATABASE:-minilore_archive}
      # Чтение LORE сервером miniLORE — по желанию владельца: пусто, и двери чтения отвечают 503 с причиной.
      - MINILORE_LORE_BASE_URL=${MINILORE_LORE_BASE_URL:-}
      - MINILORE_LORE_CLIENT_ID=${MINILORE_LORE_CLIENT_ID:-}
      - MINILORE_LORE_CLIENT_SECRET=${MINILORE_LORE_CLIENT_SECRET:-}
      # Владелец установки. Умолчание Mobilepoc — omiloreadmin — НАШЕ имя, поэтому здесь его нет.
      - MINILORE_OWNER=${MINILORE_OWNER:-}
      - MINILORE_HTTP_PORT=8080
      - MINILORE_LOG_LEVEL=${MINILORE_LOG_LEVEL:-INFO}

volumes:
  lore-db:
  lore-db-backups:
  forgejo-data:
