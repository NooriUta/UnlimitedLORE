<!doctype html>
<!-- Витрина выдачи Seiðr-kit 0.1.0 (SPRINT_UXR_S10_SEIDR_KIT/K-08): single-file
     HTML без сборщика. Два тега — CSS и ESM-модуль из kit/dist — и один вызов
     SeidrKit.mount(el, config, data). Конфиг и данные — по контракту ядра
     (kit/src/core/contract.ts); форма — как у пилота «Дата-странники»
     (method.tpl: window.KIT_CONFIG + window.X_DATA).
     Открывать через http (npx vite preview / любой статический сервер):
     браузер не грузит type="module" с file://. Если модуль не загрузился —
     страница говорит об этом явно, а не остаётся пустой. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seiðr-kit — выдача 0.1.0 (single-file HTML)</title>
<link rel="stylesheet" href="../dist/seidr-kit.css">
</head>
<body style="margin: 0; background: var(--bg0);">
<div id="app">
  <p class="sk-state sk-state--error" data-state="error" role="alert" id="boot-msg" hidden>
    Модуль kit/dist/seidr-kit.js не загрузился — откройте страницу через http, а не file://.
  </p>
</div>
<script>
// Конфиг приложения (у пилота — window.KIT_CONFIG). Функции overview/tabs —
// обычный JS: исключение в одной из них ломает только её блок.
window.KIT_CONFIG = {
  modules: [
    { id: 'method', title: 'Методология', icon: 'scroll-unfurled', status: 'active' },
    { id: 'test', title: 'Тестирование', icon: 'test-tubes', status: 'planned' }
  ],
  menu: { groups: [
    { id: 'mech', title: 'Механика', tone: '--acc', items: [{ id: 'Quiz', title: 'Квизы' }, { id: 'Scroll', title: 'Свитки' }] },
    { id: 'know', title: 'Знание', tone: '--suc', items: [{ id: 'Topic', title: 'Темы' }] }
  ] },
  kinds: {
    Quiz: {
      title: 'Квизы', icon: 'rune-stone',
      overview: function (r) { return 'Вопрос: ' + r.fields.question + '\nВерный ответ: ' + r.fields.answer; },
      tabs: [
        { key: 'play', title: 'Играть', render: function (r) { return 'Варианты: ' + r.fields.options.join(' · '); } },
        { key: 'broken', title: 'Сломанная вкладка', render: function () { throw new Error('демо: вкладка бросила исключение'); } }
      ],
      fields: [{ key: 'question', title: 'Вопрос', type: 'text' }, { key: 'answer', title: 'Ответ', type: 'text' }]
    },
    Scroll: { title: 'Свитки', icon: 'scroll-quill', fields: [{ key: 'tell', title: 'О чём', type: 'md' }] },
    Topic: { title: 'Темы', icon: 'book-cover' }
  },
  edges: { QUIZ_OF: { label: 'квиз руны', color: '--wrn' } },
  statuses: { items: [
    { code: 'none', title: 'не смотрели', category: 'todo', icon: 'circle', color: '--t3' },
    { code: 'fix', title: 'нужна правка', category: 'active', icon: 'cancel', color: '--dng' },
    { code: 'ok', title: 'согласовано', category: 'done', icon: 'check-mark', color: '--suc' }
  ], undo: true, bulk: true }
};
// Данные (у пилота — window.X_DATA): форма ответа сервера.
window.X_DATA = {
  records: [
    { id: 'quiz-fehu', kind: 'Quiz', title: 'Квиз: руна ᚠ', status: 'ok', fields: { question: 'Что означает ᚠ (феху)?', answer: 'Б', options: ['А: лёд', 'Б: богатство', 'В: путь'] } },
    { id: 'scroll-dreams', kind: 'Scroll', title: 'Свиток о снах', status: 'fix', fields: { tell: 'Сны — **мосты** между мирами.' },
      body_md: '# Свиток о снах\n\nСтранник видит сон и запоминает **руну**.\n\n| сон | руна |\n|---|---|\n| лес | ᚠ |\n| река | ᛚ |\n\n```mermaid\nflowchart LR\n  Сон --> Руна --> Квиз\n```' },
    { id: 'topic-runes', kind: 'Topic', title: 'Тема: руны старшего футарка', status: 'none', fields: {} }
  ],
  edges: [{ from: 'quiz-fehu', to: 'topic-runes', type: 'QUIZ_OF' }],
  journal: [],
  meta: { generated_at: '2026-11-07T12:00:00Z', scope: 'method', total: 3, returned: 3,
          errors: [{ block: 'quality', reason: 'демо: проверка качества не ответила' }] }
};
</script>
<script type="module">
import { SeidrKit } from '../dist/seidr-kit.js';
SeidrKit.mount(document.getElementById('app'), window.KIT_CONFIG, window.X_DATA, { lang: 'ru' });
</script>
<script>
// Модуль не исполнился за 3 с (file://, 404) — сказать прямо, а не оставить белый лист.
setTimeout(function () {
  if (!document.querySelector('[data-kit-mount]')) document.getElementById('boot-msg').hidden = false;
}, 3000);
</script>
</body>
</html>
