<!doctype html><html lang="ru" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LORE · прототип редизайна v3 · реальные данные</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Manrope:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
/*V1CSS*/
/* ================= v3 ================= */
:root{--fs-prose:15px;--fs-prose-l:17px;--fs-prose-s:14px;--fs-code:12.5px;--ctxh:37px}
/* контраст: текстовые токены темнее в светлой теме (axe) */
[data-theme=light]{--acc:#8a560a;--t2:#4f4636;--t3:#6a5d45;--wrn:#84500a;--suc:#2f6a2b;--inf:#2a5c4e;--dng:#ad2828;--vio:#64468f;--onacc:#ffffff;--accbg:#f5e7cb}
[data-theme=dark]{--t2:#c7b996;--t3:#a89a7b;--vio:#c4aeee;--onacc:#17140e;--dng:#f07c6c;--acc:#e6a93c}
html,body{overflow-x:hidden}
.app{grid-template-columns:minmax(0,1fr)}.top{min-width:0;overflow:hidden}.top>*{flex-shrink:0}.top .sp{flex-shrink:1;min-width:0}
.pane{overflow:auto}
.list tr.grp{width:100%}
.pane>.rd,.pane>.ctxbar{flex-shrink:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.list tr.row:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.skip{position:fixed;left:8px;top:-80px;z-index:100;background:var(--bg2);color:var(--t1);border:2px solid var(--acc);border-radius:8px;padding:8px 12px;font-weight:700}
.skip:focus{top:8px}
.btn.pri{color:var(--onacc)}.cb.on{color:var(--onacc)}
.apps button{color:var(--t2)}
.apps button.on{background:transparent;color:var(--t1);border-bottom-color:var(--acc)}
.apps button.on iconify-icon{color:var(--acc)}
.seg button.on{background:var(--accbg);color:var(--t1);box-shadow:inset 0 -2px 0 var(--acc)}
.ann{background:var(--t1);color:var(--bg0)}
.s-backlog{color:var(--t3)}.s-planned{color:var(--t2)}.s-todo{color:var(--t2)}.s-design{color:var(--vio)}.s-active{color:var(--inf)}.s-blocked{color:var(--dng)}.s-partial{color:var(--wrn)}.s-ready_for_deploy{color:var(--acc)}.s-done{color:var(--suc)}.s-cancelled{color:var(--t3);text-decoration:line-through}.s-unknown{color:var(--dng);border-style:dashed}
.s-draft{color:var(--t2)}.s-proposed{color:var(--wrn)}.s-deferred{color:var(--t2)}.s-accepted{color:var(--suc)}.s-superseded{color:var(--t3);text-decoration:line-through}.s-deprecated{color:var(--t3);text-decoration:line-through}.s-none{color:var(--t3);border-style:dotted}
.c-todo{color:var(--t2)}.c-wip{color:var(--inf)}.c-done{color:var(--suc)}.c-drop{color:var(--t3)}
button.st{background:transparent;cursor:pointer}button.st:hover{box-shadow:0 0 0 2px var(--accbg)}
.st .ic{line-height:1}
.st.big{font-size:var(--fs-xs);padding:3px 10px}
.saving{font:600 var(--fs-2xs)/1 var(--font);color:var(--t2);margin-left:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
/* popover */
.pop{position:fixed;z-index:60;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);padding:6px;min-width:240px;max-width:min(380px,94vw);max-height:72vh;overflow:auto;display:none}
.pop.on{display:block}
.pop .pi{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:6px;font-size:var(--fs-sm);text-align:left;min-height:32px}
.pop .pi:hover,.pop .pi.on{background:var(--accbg)}
.pop .pi .n{margin-left:auto;font:600 var(--fs-2xs)/1 var(--mono);color:var(--t2)}
.pop .pi kbd{margin-left:6px}
.pop .ph2{font:700 var(--fs-2xs)/1 var(--font);text-transform:uppercase;letter-spacing:.07em;color:var(--t2);padding:9px 8px 4px;display:flex;gap:6px;align-items:center}
.pop input.ps,.pop input.pin{width:100%;border:1px solid var(--bd);border-radius:6px;padding:6px 8px;background:var(--bg1);color:var(--t1);font:var(--fs-sm) var(--font);margin:2px 0 4px}
.pop .tabsx{display:flex;gap:4px;flex-wrap:wrap;padding:2px 2px 6px;border-bottom:1px solid var(--bd);margin-bottom:4px}
.pop .tabsx button{padding:4px 9px;border-radius:999px;font-size:var(--fs-xs);border:1px solid var(--bd);color:var(--t2)}
.pop .tabsx button.on{background:var(--accbg);border-color:var(--acc);color:var(--t1);font-weight:700}
.pop .seg{margin:2px 4px 6px;flex-wrap:wrap;border-radius:8px}
.pop .note{color:var(--t2);font-size:var(--fs-2xs);padding:6px 8px}
.cb{width:14px;height:14px;border:1.5px solid var(--t2);border-radius:3px;display:inline-grid;place-items:center;font-size:var(--fs-2xs);flex:none}
.cb.on{background:var(--acc);border-color:var(--acc)}
.cbb{display:inline-grid;place-items:center;min-width:22px;min-height:22px;border-radius:4px}
/* list */
.grp td{cursor:pointer;color:var(--t2)}
.grp .link{text-transform:none;letter-spacing:0;margin-left:8px;font-weight:600}
.gtog{display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.07em;font:inherit;color:inherit}
.dist{display:inline-flex;height:6px;width:90px;border-radius:999px;overflow:hidden;vertical-align:middle;margin:0 6px;background:var(--bg3)}
.dist i{display:block;height:100%}
.list tr.row{scroll-margin-bottom:84px;scroll-margin-top:40px}
.list tr.row.closed td.t{color:var(--t2)}
.list td.c-id{white-space:normal;word-break:break-all;min-width:110px;max-width:260px}
.list td.c-p4,.list td.c-p3{white-space:normal}
.list tr.grp td{white-space:normal}
.peekon .list .c-p2,.peekon .list .c-p3,.peekon .list .c-p4{display:none}
@media (max-width:1100px){.peek.on{position:fixed;top:44px;right:0;bottom:0;width:min(520px,92vw);z-index:36;box-shadow:var(--sh)}}
.fresh2{font-size:var(--fs-2xs);color:var(--t2);display:inline-flex;gap:4px;align-items:center}
.fresh2 button{color:var(--acc);font-weight:700;padding:2px 6px;border-radius:999px}
.fac{cursor:pointer}.fac.on{border-color:var(--acc);background:var(--accbg)}
.vmod{display:inline-flex;gap:6px;align-items:center;padding:2px 4px 2px 8px;border:1px dashed var(--wrn);border-radius:999px;font-size:var(--fs-xs);color:var(--t1)}
.vmod b{color:var(--wrn)}
.real{display:inline-flex;gap:4px;align-items:center;font:700 var(--fs-2xs)/1 var(--font);padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--suc) 14%,transparent);color:var(--suc)}
.scrim{display:none}.closeside{display:none}
.side .sfoot{margin-top:14px;border-top:1px solid var(--bd);padding-top:6px}
.side .tag{margin-left:auto;font:600 var(--fs-2xs)/1 var(--font);color:var(--t2);border:1px solid var(--bd);border-radius:999px;padding:2px 5px}
.side .srvnote{padding:2px 8px 4px;font-size:var(--fs-2xs);color:var(--t2)}
/* rail (left) */
.body.rail{--sbw:52px}
.body.collapsed{grid-template-columns:minmax(0,1fr)}
.rail .sitem{justify-content:center;padding:7px 0}.rail .appname{justify-content:center;padding:4px 0 8px}
.ear{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:700 var(--fs-2xs)/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--t2);background:var(--bg1);border:1px solid var(--bd);border-radius:8px 0 0 8px;padding:12px 0;width:28px}
.ear:hover{color:var(--acc);border-color:var(--acc)}
.side .ear{margin:10px auto 0;border-radius:8px;min-height:110px}
.sidecol .mb{display:inline-flex}
/* reading */
.ctxbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--bg1);border-bottom:1px solid var(--bd);font-size:var(--fs-xs);color:var(--t2);flex-wrap:wrap}
.ctxbar a{color:var(--t2);cursor:pointer}.ctxbar a:hover{color:var(--acc)}
.ctxbar .pos{margin-left:auto;display:flex;align-items:center;gap:4px;font-family:var(--mono);flex-wrap:wrap}
.ctxbar .pos button{border:1px solid var(--bd);border-radius:6px;min-width:28px;min-height:26px;background:var(--bg2);padding:0 6px}
.ctxbar .pos button[aria-pressed=true]{border-color:var(--acc);color:var(--t1)}
.ctxbar .cur{font-family:var(--mono);color:var(--t1);max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:0}
.rd.norail{grid-template-columns:minmax(0,1fr) 30px}
.rd .col{min-width:0;padding:16px 28px 80px}
.rd .measure{max-width:1100px;margin:0 auto}
.fs-l{--measure:760px}.fs-s{--measure:620px}
.rd .measure>.kind,.rd .measure>.ttl,.rd .measure>.verdict,.rd .measure>.banner,.rd .measure>.mprops,.rd .measure>.tbar,.rd .measure>.empty,.rd .measure>.blk,.rd .measure>.savebar{max-width:var(--measure,680px);margin-left:auto;margin-right:auto}
.rd .ttl{font:800 var(--fs-xl)/1.25 var(--head);margin:4px 0 6px}
.verdict{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:var(--fs-xs);color:var(--t2);margin-bottom:10px}
.verdict .sep{color:var(--t3)}
.verdict .bad{color:var(--dng);font-weight:700}.verdict .ok{color:var(--suc);font-weight:700}
.rtabs{position:sticky;top:var(--ctxh);z-index:3;background:var(--bg0);padding:0;margin:4px auto 14px}
.rtabs button{min-height:34px}
.rd .rrail{border-left:1px solid var(--bd);background:var(--bg1);padding:10px 12px;position:sticky;top:var(--ctxh);align-self:start;max-height:calc(100vh - 90px);overflow:auto}
.rd.norail .rrail{display:none}
.rd .earw{position:sticky;top:var(--ctxh);align-self:start;height:calc(100vh - 100px);display:flex}
.rd .earw .ear{height:100%;width:30px}
.rd:not(.norail) .earw{display:none}
.rrail h5{margin:12px 0 6px;font:700 var(--fs-2xs)/1 var(--font);text-transform:uppercase;letter-spacing:.07em;color:var(--t2);display:flex;align-items:center;gap:6px}
.rrail h5 .sp{flex:1}
.rrail .kv{grid-template-columns:86px 1fr;font-size:var(--fs-xs)}
.mprops{border:1px solid var(--bd);border-radius:8px;background:var(--bg1);margin-bottom:8px;font-size:var(--fs-xs)}
.mprops summary{cursor:pointer;padding:8px 10px;color:var(--t2);font-weight:700;min-height:32px}
.mprops .kv{padding:0 10px 10px;font-size:var(--fs-xs)}
.toc a{display:block;padding:3px 0 3px 8px;border-left:2px solid var(--bd);color:var(--t2);font-size:var(--fs-xs);cursor:pointer;text-decoration:none}
.toc a.l3{padding-left:18px}.toc a:hover{color:var(--acc);border-color:var(--acc)}
.tbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px;font-size:var(--fs-2xs);color:var(--t2)}
.savebar{position:sticky;top:calc(var(--ctxh) + 40px);z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 10px;border:1px solid var(--acc);border-radius:8px;background:var(--accbg);margin-bottom:10px;font-size:var(--fs-xs)}
.conflict{border-color:var(--dng);background:color-mix(in srgb,var(--dng) 10%,var(--bg2))}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.cmp pre{margin:0;max-height:240px;overflow:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:8px;font:var(--fs-2xs)/1.5 var(--mono);white-space:pre-wrap}
.edgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:60vh}
.edgrid textarea{width:100%;min-height:60vh;font:var(--fs-sm)/1.55 var(--mono);padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg2);color:var(--t1);resize:vertical}
.edgrid .prose{border:1px dashed var(--bd);border-radius:8px;padding:6px 14px;overflow:auto;max-height:75vh}
@media (max-width:900px){.edgrid{grid-template-columns:1fr}}
/* prose + блоки */
.prose{font:var(--fs-prose)/1.7 var(--font);color:var(--t1)}
.fs-l .prose{font-size:var(--fs-prose-l)}.fs-s .prose{font-size:var(--fs-prose-s)}
.prose h2{font:800 var(--fs-lg)/1.3 var(--head);margin:1.4em 0 .4em}.prose h3{font:800 var(--fs-md)/1.3 var(--head);margin:1.2em 0 .4em}.prose h4{font:700 var(--fs-md)/1.3 var(--font);margin:1em 0 .3em}
.prose p{margin:.5em 0}.prose ul,.prose ol{padding-left:1.4em;margin:.4em 0}.prose li{margin:.2em 0}
.prose code{font:var(--fs-code) var(--mono);background:var(--bg3);padding:1px 4px;border-radius:4px}
.prose pre{background:var(--bg3);padding:10px 12px;border-radius:8px;overflow:auto;font:var(--fs-code)/1.5 var(--mono);margin:.6em 0}
.prose pre code{background:none;padding:0}
.prose table{border-collapse:collapse;font-size:var(--fs-sm);max-width:100%}
.prose th,.prose td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}
.prose th{background:var(--bg3);font-weight:700}
.prose blockquote{margin:.6em 0;padding:4px 12px;border-left:3px solid var(--acc);color:var(--t2);background:var(--bg1)}
.prose a{color:var(--acc)}.prose .wl{font-family:var(--mono);font-size:.9em;cursor:pointer;border-bottom:1px dashed var(--acc);text-decoration:none}
.prose .wl.miss{color:var(--t2);border-color:var(--t3);cursor:default}
.prose .mermaid{background:var(--bg2);padding:8px;overflow:auto}
.mdb{position:relative;border-radius:6px;max-width:var(--measure,680px);margin:0 auto;padding:0 6px}
.mdb.ed{cursor:text}
.mdb.ed:hover{box-shadow:0 0 0 1px var(--bd);background:var(--bg1)}
.mdb.editing{padding:4px 0}
.mdb.rich{max-width:100%;width:fit-content;min-width:min(100%,var(--measure,680px));margin:.9em auto;border:1px solid var(--bd);background:var(--bg2);padding:0;overflow:hidden}
.mdb .bh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 6px 4px 10px;border-bottom:1px solid var(--bd);font:600 var(--fs-2xs)/1 var(--mono);color:var(--t2);background:var(--bg1)}
.mdb .bh .sp{flex:1}
.mdb .bh .berr{color:var(--dng);font-weight:700}
.seg.sm button{padding:3px 8px;font-size:var(--fs-2xs)}
.bb{padding:8px 10px;overflow:auto;max-width:100%}
.bb.side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:720px){.bb.side{grid-template-columns:1fr}}
textarea.bedit{width:100%;font:var(--fs-sm)/1.55 var(--mono);padding:8px;border:1px solid var(--acc);border-radius:6px;background:var(--bg2);color:var(--t1);resize:vertical;min-height:4.6em}
.bhint{font-size:var(--fs-2xs);color:var(--t2);padding:2px 2px 0}
.wideb{position:relative;width:fit-content;max-width:100%;margin:1em auto}.wideb>button.xp{position:absolute;right:6px;top:6px;z-index:2}
.ov .full{width:96vw;height:90vh;background:var(--bg2);border-radius:12px;overflow:auto;padding:16px;box-shadow:var(--sh)}
/* Völva */
.volva{border:1px solid var(--bd);border-radius:10px;background:var(--bg2);margin:12px 14px 24px;overflow:hidden}
.rd .volva{margin:0 0 16px}
.vh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--bd);font-size:var(--fs-xs);color:var(--t2)}
.vh .sp{flex:1}
.vlogo{font:800 var(--fs-sm)/1 var(--head);color:var(--acc);display:inline-flex;gap:6px;align-items:center}
.vlock{font:600 var(--fs-2xs)/1.3 var(--mono);color:var(--t1);background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:2px 6px}
.vbody{display:grid;grid-template-columns:230px minmax(0,1fr)}
.vcol{border-right:1px solid var(--bd);padding:8px;background:var(--bg1);font-size:var(--fs-xs);min-width:0}
.vcol h6{margin:10px 4px 4px;font:700 var(--fs-2xs)/1 var(--font);text-transform:uppercase;letter-spacing:.07em;color:var(--t2)}
.vcol .vi{display:block;width:100%;text-align:left;padding:5px 6px;border-radius:6px;color:var(--t1);font-size:var(--fs-xs)}
.vcol .vi:hover,.vcol .vi.on{background:var(--accbg)}
.vcol .vi small{display:block;color:var(--t2);font:var(--fs-2xs)/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmain{padding:10px 12px;min-width:0}
.vrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0;font-size:var(--fs-xs)}
.vrow .lb{color:var(--t2);font-weight:700;font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:.06em;min-width:84px}
.vmain textarea{width:100%;font:var(--fs-sm)/1.5 var(--mono);padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg1);color:var(--t1);min-height:70px;resize:vertical}
select,.vmain input[type=text],.vmain input[type=number]{font:var(--fs-xs) var(--font);border:1px solid var(--bd);border-radius:6px;background:var(--bg2);color:var(--t1);padding:3px 6px;min-height:28px;max-width:100%}
.vpar{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:999px;padding:2px 8px;background:var(--bg1);font-size:var(--fs-xs)}
.vpar code{font:600 var(--fs-2xs) var(--mono);color:var(--acc)}
.vres{margin-top:8px;overflow:auto;max-width:100%}
.vres table{border-collapse:collapse;font-size:var(--fs-xs);width:auto;min-width:50%}
.vres th{font:700 var(--fs-2xs)/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--t2);text-align:left;padding:6px 8px;background:var(--bg3);border-bottom:1px solid var(--bd)}
.vres td{padding:5px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.vres td.qc{cursor:pointer}.vres td.qc:hover{outline:2px solid var(--acc);outline-offset:-2px}
.vres .qrow{cursor:pointer}.vres .qrow:hover td{background:var(--bg1)}
.qerr{padding:10px;border:1px solid color-mix(in srgb,var(--dng) 50%,transparent);border-radius:8px;background:color-mix(in srgb,var(--dng) 8%,transparent);color:var(--t1);font-size:var(--fs-xs)}
.qerr b{color:var(--dng)}
.vbar{display:grid;grid-template-columns:minmax(80px,170px) 1fr 40px;gap:6px;align-items:center;font-size:var(--fs-xs);margin:3px 0;cursor:pointer;border-radius:4px}
.vbar:hover{background:var(--bg1)}
.vbar .tr{height:10px;border-radius:999px;background:var(--bg3);overflow:hidden;display:flex}
.vbar .tr i{display:block;height:100%}
.vbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vdash{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.vcard{border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--bg1)}
.vcard h6{margin:0 0 6px;font:700 var(--fs-xs)/1.2 var(--font)}
.vq{font-size:var(--fs-xs)}
.vq .vqf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--t2);font-size:var(--fs-2xs);padding:6px 0 0}
.bcap{font-size:var(--fs-xs);color:var(--t2);border-left:3px solid var(--inf);padding:4px 10px;margin:.6em 0;background:var(--bg1)}
@media (max-width:900px){.vbody{grid-template-columns:1fr}.vcol{border-right:0;border-bottom:1px solid var(--bd)}}
/* graph */
.lg{width:100%;height:auto;display:block;background:var(--bg2);border:1px solid var(--bd);border-radius:8px}
.lg text{font-family:var(--mono);font-size:var(--fs-2xs);fill:var(--t1)}
.lg text.el{fill:var(--t2);font-size:var(--fs-2xs)}
.lg line.e{stroke:var(--t3);stroke-width:1.1}
.lg line.est{stroke-dasharray:3 3;stroke:var(--bd)}
.lg g.rec{cursor:pointer}
.lg g.rec:hover circle{stroke:var(--acc);stroke-width:3}
.gctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:var(--fs-xs);margin:0 0 8px}
.gctl input[type=range]{accent-color:var(--acc);width:120px}
