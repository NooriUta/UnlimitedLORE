<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка LORE · v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Manrope:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<style>
/* Прототип админки v4 — схема «три вопроса» (владелица 09.11: «ок»).
   Данные: снимок LORE 09.11 через MCP (люди, проекты, роли — живые);
   подключения MCP, журнал и отказы — помечены «демо». */
:root{
  --bg:#14120e;--bg2:#1c1913;--bg3:#25211a;--bd:#3a3326;
  --t1:#efe6d2;--t2:#b8ab90;--t3:#7f735c;
  --acc:#d9a441;--suc:#8fb85f;--wrn:#d9a441;--dng:#d0644f;--inf:#6fa3c4;
  --fs-2xs:10px;--fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-lg:15px;--fs-xl:18px;--fs-2xl:22px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--r:6px;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f7f2e7;--bg2:#efe7d6;--bg3:#e6dcc6;--bd:#cfc2a6;--t1:#2a241a;--t2:#5d523f;--t3:#8a7d64;
  --acc:#a8741a;--suc:#4f7a2a;--wrn:#a8741a;--dng:#b0412d;--inf:#2f6d93;}}
:root[data-theme="light"]{--bg:#f7f2e7;--bg2:#efe7d6;--bg3:#e6dcc6;--bd:#cfc2a6;--t1:#2a241a;--t2:#5d523f;--t3:#8a7d64;
  --acc:#a8741a;--suc:#4f7a2a;--wrn:#a8741a;--dng:#b0412d;--inf:#2f6d93;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font:400 var(--fs-sm)/1.45 Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2{font-family:Unbounded,sans-serif;font-weight:800;margin:0}
h1{font-size:var(--fs-lg);letter-spacing:.02em}
h2{font-size:var(--fs-md);text-transform:uppercase;letter-spacing:.06em;color:var(--t2)}
.mono{font-family:var(--mono)}
.muted{color:var(--t3)}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--bd);background:var(--bg2);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;border:1px solid var(--bd);font-size:var(--fs-xs);white-space:nowrap}
.chip.ok{color:var(--suc);border-color:color-mix(in srgb,var(--suc) 50%,var(--bd))}
.chip.w{color:var(--wrn);border-color:color-mix(in srgb,var(--wrn) 50%,var(--bd))}
.chip.d{color:var(--dng);border-color:color-mix(in srgb,var(--dng) 50%,var(--bd))}
.chip.i{color:var(--inf);border-color:color-mix(in srgb,var(--inf) 50%,var(--bd))}
.demo{font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:.08em;color:var(--wrn);border:1px dashed var(--wrn);border-radius:999px;padding:0 6px}
.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 45px)}
nav.side{border-right:1px solid var(--bd);padding:12px 8px;background:var(--bg2)}
.q{margin-bottom:14px}
.q .qh{display:flex;gap:8px;align-items:center;padding:6px 8px;font-weight:700;font-size:var(--fs-md)}
.q .qh small{display:block;font-weight:400;color:var(--t3);font-size:var(--fs-xs)}
.q .risk{margin-left:auto}
.q a{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 28px;border-radius:var(--r);color:var(--t2);text-decoration:none;font-size:var(--fs-sm)}
.q a:hover{background:var(--bg3)}
.q a.on{background:var(--bg3);color:var(--t1);box-shadow:inset 2px 0 0 var(--acc)}
.q a .n{margin-left:auto;font-family:var(--mono);font-size:var(--fs-xs);color:var(--t3)}
main{padding:16px;min-width:0}
.where{display:none}
.lead{color:var(--t2);margin:4px 0 14px;max-width:760px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.bar input{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);color:var(--t1);padding:5px 8px;font:inherit;min-width:180px}
.seg button{padding:3px 10px;border:1px solid var(--bd);border-radius:999px;font-size:var(--fs-xs);color:var(--t2)}
.seg button.on{color:var(--t1);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.shown{font-size:var(--fs-xs);color:var(--t3)}
.tblw{overflow:auto;border:1px solid var(--bd);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
th{text-align:left;font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:.08em;color:var(--t3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--bd);background:var(--bg2);position:sticky;top:0;white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid color-mix(in srgb,var(--bd) 60%,transparent);vertical-align:middle}
tr:hover td{background:color-mix(in srgb,var(--bg3) 60%,transparent)}
.mx th.p{position:sticky;left:0;z-index:2}
.mx td.p{position:sticky;left:0;background:var(--bg);font-family:var(--mono);font-size:var(--fs-xs);white-space:nowrap}
.mx td.c{text-align:center;cursor:pointer}
.mx td.c:hover{outline:1px solid var(--acc);outline-offset:-1px}
.role{display:inline-block;min-width:54px;padding:1px 8px;border-radius:999px;font-size:var(--fs-xs)}
.role.owner{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.role.reader{background:color-mix(in srgb,var(--inf) 20%,transparent);color:var(--inf)}
.role.none{color:var(--t3)}
.verdict{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg2);margin:10px 0}
.verdict b{font-size:var(--fs-md)}
.card{display:grid;grid-template-columns:1fr 280px;gap:16px}
.box{border:1px solid var(--bd);border-radius:var(--r);padding:10px;background:var(--bg2)}
.box h2{margin-bottom:8px}
.chain{list-style:none;padding:0;margin:0;font-size:var(--fs-sm)}
.chain li{padding:4px 0;border-bottom:1px dashed var(--bd);display:flex;gap:8px}
.chain li:last-child{border:0}
.jr{display:grid;grid-template-columns:62px 22px 1fr;gap:6px;padding:4px 0;border-bottom:1px dashed var(--bd);font-size:var(--fs-xs)}
.jr:last-child{border:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:12px 0}
.tabs button{padding:6px 10px;color:var(--t2);font-size:var(--fs-sm)}
.tabs button.on{color:var(--t1);box-shadow:inset 0 -2px 0 var(--acc)}
.layer{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.layer.on{display:flex}
.dlg{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;max-width:520px;width:100%;padding:16px}
.diff{font-family:var(--mono);font-size:var(--fs-xs);border:1px solid var(--bd);border-radius:var(--r);padding:8px;margin:8px 0;background:var(--bg)}
.diff .m{color:var(--dng)}.diff .p{color:var(--suc)}
.dlg input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);color:var(--t1);padding:6px 8px;font:inherit;margin:6px 0}
.btn{padding:5px 12px;border:1px solid var(--bd);border-radius:999px;font-size:var(--fs-sm)}
.btn.pri{border-color:var(--acc);color:var(--acc)}
.btn.dng{border-color:var(--dng);color:var(--dng)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;display:none;gap:10px;align-items:center;z-index:30}
.toast.on{display:flex}
.state{border:1px dashed var(--bd);border-radius:var(--r);padding:12px;color:var(--t2)}
.state.err{border-color:var(--dng);color:var(--dng)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.kpi .box b{display:block;font-size:var(--fs-xl);font-family:var(--mono)}
.legend{font-size:var(--fs-xs);color:var(--t3);margin-top:6px}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  nav.side{display:none}
  .where{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .where select{flex:1;background:var(--bg2);color:var(--t1);border:1px solid var(--bd);border-radius:var(--r);padding:6px;font:inherit}
  .card{grid-template-columns:1fr}
  .top .hide-s{display:none}
}
</style>
</head>
<body>
<div class="top">
  <iconify-icon icon="game-icons:cog" width="18"></iconify-icon>
  <h1>Админка LORE</h1>
  <span class="chip mono hide-s">v4 · прототип</span>
  <span class="sp"></span>
  <span class="chip ok hide-s" title="auth">● вход: Keycloak</span>
  <span class="chip ok hide-s">● права агентов: сервер</span>
  <span class="chip i mono hide-s">1.17.4</span>
  <button class="chip" id="themeBtn" title="тема">◐</button>
</div>
<div class="wrap">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div class="layer" id="layer"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"><span id="toastText"></span><button class="btn" id="undoBtn">Отменить</button></div>

<script>
// ── Данные: снимок LORE 09.11.2026 через MCP (user_project_roles / project_users) ──
const SNAP = 'снимок LORE 09.11.2026';
const PEOPLE = [
  {id:'omiloreadmin', realm:['admin','super-admin'], proj:['AIDA/freyja','AIDA/studio','AIDA/BOKVIT','AIDA/Datawanderers-ServerandLore','AIDA/Datawanderers-Unity','AIDA/TEIKN','AIDA/udwe-rollout','AIDA/udwe-mig-gen','AIDA/udwe-engine','AIDA/miniLore_serverside','AIDA/miniLORE','AIDA/MIDGARD','AIDA/GLADSHEIM','ivanovalex32/UDWE','NooriUta/aida-documentation','NooriUta/seidr-site','NooriUta/volva','NooriUta/ODIN','NooriUta/BRAGI','NooriUta/AIDA','NooriUta/UnlimitedLORE','NooriUta/AIDA-TestPlayGround','AIDA/forgejo-mcp'].map(p=>[p,'owner'])},
  {id:'vasilisk', realm:['admin'], proj:['AIDA/miniLore_serverside','AIDA/miniLORE','AIDA/BOKVIT','AIDA/Datawanderers-ServerandLore','AIDA/Datawanderers-Unity','AIDA/GLADSHEIM','AIDA/TEIKN','AIDA/MIDGARD','NooriUta/UnlimitedLORE','NooriUta/volva','NooriUta/seidr-site','NooriUta/aida-documentation','NooriUta/ODIN','NooriUta/BRAGI','NooriUta/AIDA-TestPlayGround','NooriUta/AIDA','AIDA/forgejo-mcp'].map(p=>[p,'owner'])},
  {id:'arharaga', realm:['admin'], realmDemo:true, proj:['AIDA/forgejo-mcp','AIDA/freyja','AIDA/miniLORE','AIDA/miniLore_serverside','NooriUta/AIDA','NooriUta/BRAGI','NooriUta/ODIN','NooriUta/volva','NooriUta/seidr-site','NooriUta/UnlimitedLORE'].map(p=>[p,'owner'])},
  {id:'ivanovalex32', realm:['editor'], realmDemo:true, proj:['AIDA/udwe-rollout','AIDA/udwe-mig-gen','AIDA/udwe-engine','ciadmin/udwe-mig-gen','ciadmin/udwe-rollout','ivanovalex32/UDWE'].map(p=>[p,'owner'])},
  {id:'frolova', realm:['viewer'], realmDemo:true, proj:['AIDA/miniLORE','AIDA/MIDGARD','AIDA/GLADSHEIM'].map(p=>[p,'reader'])},
];
const PROJECTS = [...new Set(PEOPLE.flatMap(u=>u.proj.map(x=>x[0])))].sort();
const AGENTS = ['full','architect','developer','pm','tester','analyst','marketer'].map((p,i)=>({
  id:'lore-mcp-'+p, profile:p, owner:'omiloreadmin',
  writes:{full:'всё, кроме доступа',architect:'ADR, решения, спеки, компоненты',developer:'ADR, спеки, релизы',pm:'спринты, вехи, фичи',tester:'задачи, QG',analyst:'вопросы, инсайты',marketer:'BRAGI, спеки, доки'}[p],
  // демо: подключения MCP (срез mcp_connections на стенде, на проде ещё нет)
  calls:[1840,312,96,140,58,0,22][i], last:[2,38,12,55,1440,null,190][i], fails:[3,0,1,0,0,0,4][i]
}));
const RULES = [['claude_rules_global','Правила машины','~/.claude/CLAUDE.md',0],['claude_rules_unlimitedlore','UnlimitedLORE','D:/Unlimitedlore/CLAUDE.md',0],['claude_rules_volva','Volva','volva/CLAUDE.md',7],['claude_rules_seidr_site','seidr-site','seidr-site/CLAUDE.md',null],['claude_rules_datawanderers_lore','Дата-странники','Datawanderers-ServerandLore/CLAUDE.md',2]];
const STATUSES = [['todo','К выполнению','--t3','checkbox-tree'],['backlog','Бэклог','--t3','tied-scroll'],['planned','Запланировано','--wrn','calendar'],['design','Проектирование','--wrn','magic-swirl'],['active','В работе','--inf','progression'],['partial','Частично','--wrn','battery-50'],['ready_for_deploy','Готово к деплою','--inf','wave-crest'],['done','Готово','--suc','divided-spiral'],['blocked','Заблокировано','--dng','handcuffed'],['cancelled','Отменено','--t3','cross-mark']];
let JOURNAL = [ // демо: тот же ряд AO-01, что срез admin_actions
  [3,'h','vasilisk','user','frolova','выдала роль reader в AIDA/GLADSHEIM'],
  [26,'a','lore-mcp-pm','doc','claude_rules_unlimitedlore','обновил снимок правил (claude_rules_push)'],
  [95,'h','omiloreadmin','kc','lore-mcp-tester','ротировал секрет'],
  [300,'a','lore-mcp-architect','project','AIDA/TEIKN','завёл проект'],
  [610,'a','lore-mcp-marketer','dict','task_type','403 — словари только людям'],
];
const DENIALS = [[7,'POST','/lore/dict/entry',403,'lore-mcp-marketer','FORBIDDEN_HUMAN_ONLY'],[42,'GET','/lore/kc/users',403,'editor','ADMIN_ONLY']];

// ── Навигация: три вопроса, а не таблицы БД ──
const NAV = [
  {q:'who', t:'Кто и что может', s:'люди, агенты, проекты, доступ', risk:'d', items:[['matrix','Матрица доступа','grid'],['people','Люди','person'],['agents','Агенты','robot-golem'],['projects','Проекты','folder']]},
  {q:'how', t:'Как устроен LORE', s:'справочники, правила, флаги', risk:'w', items:[['dicts','Справочники','book-cover'],['rules','Правила CLAUDE','scroll-unfurled'],['flags','Флаги','flag-objective'],['model','Модель','cube']]},
  {q:'alive', t:'Жив ли LORE', s:'смотрим и чиним', risk:'ok', items:[['mcp','Подключения MCP','plug'],['denials','Отказы доступа','padlock'],['system','Система и версия','cog']]},
];
const SEC = {}; NAV.forEach(g=>g.items.forEach(([k,l,ic])=>SEC[k]={k,l,ic,q:g.q}));
const S = Object.fromEntries(new URLSearchParams(location.search));
if(!SEC[S.s]) S.s='matrix';
function go(p){Object.assign(S,p);for(const k in S) if(S[k]===''||S[k]==null) delete S[k];
  history.replaceState(null,'','?'+new URLSearchParams(S));render();}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico=(n,w=14)=>`<iconify-icon icon="game-icons:${n}" width="${w}"></iconify-icon>`;
const ago=m=>m==null?'—':m<60?m+' мин':m<1440?Math.round(m/60)+' ч':Math.round(m/1440)+' д';
const roleOf=(u,p)=>{const r=PEOPLE.find(x=>x.id===u).proj.find(x=>x[0]===p);return r?r[1]:null};

function side(){
  const n={matrix:PEOPLE.reduce((a,u)=>a+u.proj.length,0),people:PEOPLE.length,agents:AGENTS.length,projects:PROJECTS.length,dicts:STATUSES.length,rules:RULES.length,mcp:AGENTS.length,denials:DENIALS.length};
  $('#side').innerHTML = NAV.map(g=>`<div class="q"><div class="qh">${g.t}<span class="chip ${g.risk} risk">${{d:'риск',w:'контент',ok:'смотреть'}[g.risk]}</span></div>
    <div class="muted" style="padding:0 8px 4px;font-size:var(--fs-xs)">${g.s}</div>
    ${g.items.map(([k,l,ic])=>`<a href="?s=${k}" data-s="${k}" class="${S.s===k?'on':''}">${ico(ic)} ${l}<span class="n">${n[k]??''}</span></a>`).join('')}</div>`).join('')
    + `<div class="q"><a href="?s=journal" data-s="journal" class="${S.s==='journal'?'on':''}" style="padding-left:8px">${ico('quill')} Журнал (всё)</a></div>`;
}
function where(){
  return `<div class="where"><select id="whereSel">${NAV.map(g=>`<optgroup label="${g.t}">${g.items.map(([k,l])=>`<option value="${k}" ${S.s===k?'selected':''}>${l}</option>`).join('')}</optgroup>`).join('')}<option value="journal" ${S.s==='journal'?'selected':''}>Журнал (всё)</option></select></div>`;
}
function journalRows(filter){
  const rows = JOURNAL.filter(filter||(()=>true));
  if(!rows.length) return `<div class="state">Пусто (проверено): записей журнала по этой записи нет.</div>`;
  return rows.map(([m,k,who,fam,obj,what])=>`<div class="jr"><span class="muted mono">${ago(m)}</span><span title="${k==='a'?'агент':'человек'}">${k==='a'?ico('robot-golem',13):ico('person',13)}</span><span><b>${esc(who)}</b> · ${esc(what)} <span class="muted mono">${esc(obj)}</span></span></div>`).join('');
}

// ── «Кто и что может» ──
function matrix(){
  const q=(S.q||'').toLowerCase();
  const rows=PROJECTS.filter(p=>!q||p.toLowerCase().includes(q));
  const head=PEOPLE.map(u=>`<th><a href="?s=people&id=${u.id}" data-go="people:${u.id}" style="color:inherit">${u.id}</a><div class="muted" style="text-transform:none;letter-spacing:0">${u.proj.length} · ${u.realm[0]}${u.realmDemo?'*':''}</div></th>`).join('');
  return `<h2>Матрица доступа</h2>
  <p class="lead">Проект × человек: роль в ячейке, правка кликом (с диффом и «Отменить»). Агенты не стоят в матрице отдельно — они наследуют проекты владельца, это видно в строке ниже. Источник: срез <span class="mono">role_matrix</span>, ${SNAP}.</p>
  <div class="bar"><input placeholder="Проект…" value="${esc(S.q||'')}" id="q"><span class="shown">Показано ${rows.length} из ${PROJECTS.length} · назначений ${PEOPLE.reduce((a,u)=>a+u.proj.length,0)}</span></div>
  <div class="tblw"><table class="mx"><thead><tr><th class="p">Проект</th>${head}<th>Агенты (наследуют)</th></tr></thead><tbody>
  ${rows.map(p=>`<tr><td class="p">${p}</td>${PEOPLE.map(u=>{const r=roleOf(u.id,p);return `<td class="c" data-cell="${u.id}|${p}"><span class="role ${r||'none'}">${r||'—'}</span></td>`}).join('')}
    <td class="muted" style="font-size:var(--fs-xs)">${roleOf('omiloreadmin',p)?'7 агентов omiloreadmin':'—'}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="legend">* realm-роль знает Keycloak, в снимке её не было — в прототипе демо. <span class="role owner">owner</span> читает и пишет · <span class="role reader">reader</span> только читает · — нет роли, проект не виден</div>`;
}
function people(){
  if(S.id) return personCard(S.id);
  return `<h2>Люди</h2><p class="lead">Карточка человека — одна и та же форма, что у агента и проекта: вердикт, «почему видит», журнал.</p>
  <div class="tblw"><table><thead><tr><th>Логин</th><th>Realm</th><th>Проектов</th><th>Роли</th></tr></thead><tbody>
  ${PEOPLE.map(u=>`<tr data-go="people:${u.id}" style="cursor:pointer"><td><b>${u.id}</b></td><td>${u.realm.map(r=>`<span class="chip ${r.includes('admin')?'d':''}">${r}</span>`).join(' ')}</td><td class="mono">${u.proj.length}</td><td>${[...new Set(u.proj.map(x=>x[1]))].map(r=>`<span class="role ${r}">${r} · ${u.proj.filter(x=>x[1]===r).length}</span>`).join(' ')}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function personCard(id){
  const u=PEOPLE.find(x=>x.id===id); if(!u) return `<div class="state err">Человек «${esc(id)}» не найден в снимке.</div>`;
  const tab=S.t||'access';
  const agents=AGENTS.filter(a=>a.owner===u.id);
  const groups={}; u.proj.forEach(([p,r])=>(groups[r]=groups[r]||[]).push(p));
  return `<div class="bar"><button class="btn" data-go="people:">‹ Люди</button></div>
  <h2 style="font-size:var(--fs-lg);color:var(--t1);text-transform:none">${u.id}</h2>
  <div class="verdict"><b>человек</b> · realm ${u.realm.map(r=>`<span class="chip ${r.includes('admin')?'d':''}">${r}</span>`).join(' ')}${u.realmDemo?' <span class="demo">realm — демо</span>':''} · проектов <b class="mono">${u.proj.length}</b> · ${agents.length?`агентов <b class="mono">${agents.length}</b> (видят те же ${u.proj.length} проектов)`:'агентов нет'} · последнее действие ${ago(JOURNAL.find(j=>j[2]===u.id)?.[0])}</div>
  <div class="tabs">${[['access','Доступ'],['why','Почему видит'],['agents','Агенты'],['journal','Журнал']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>
  ${tab==='access'?`<p class="muted">Роли сгруппированы по роли и свёрнуты — 23 строки «Снять…» подряд не будет. Массовая смена — одно подтверждение с диффом на N.</p>
     ${Object.entries(groups).map(([r,ps])=>`<details class="box" style="margin-bottom:8px"><summary><span class="role ${r}">${r}</span> · ${ps.length} проектов</summary><div style="margin-top:6px;font-family:var(--mono);font-size:var(--fs-xs)">${ps.join(' · ')}</div>
     <div class="bar"><button class="btn" data-bulk="${u.id}|${r}">Сменить роль во всех ${ps.length}…</button></div></details>`).join('')}`:''}
  ${tab==='why'?whyBlock(u):''}
  ${tab==='agents'?(agents.length?`<div class="tblw"><table><thead><tr><th>Агент</th><th>Профиль</th><th>Пишет</th><th>Видит</th></tr></thead><tbody>${agents.map(a=>`<tr data-go="agents:${a.id}" style="cursor:pointer"><td class="mono">${a.id}</td><td>${a.profile}</td><td>${a.writes}</td><td class="muted">${u.proj.length} проектов · наследует</td></tr>`).join('')}</tbody></table></div>`:`<div class="state">Пусто (проверено): у ${u.id} нет агентов.</div>`):''}
  ${tab==='journal'?`<div class="box">${journalRows(j=>j[2]===u.id||j[4]===u.id)}</div><span class="demo">демо</span>`:''}`;
}
function whyBlock(u){
  const p=S.p||PROJECTS[0]; const r=roleOf(u.id,p);
  const sees = !!r || u.realm.includes('admin') || u.realm.includes('super-admin');
  return `<div class="bar"><label class="muted">Проект</label><select id="whyP" style="background:var(--bg2);color:var(--t1);border:1px solid var(--bd);border-radius:var(--r);padding:4px">${PROJECTS.map(x=>`<option ${x===p?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="verdict"><b>${sees?'видит':'не видит'}</b> ${esc(p)} · ${r==='owner'||u.realm.includes('admin')?'читает и пишет':r==='reader'?'только читает':'—'}</div>
  <div class="box"><h2>Цепочка (как решает сервер, /lore/admin/access)</h2><ul class="chain">
   <li><span class="chip ok">1</span> lore.scope.enforce = вкл — проекты режутся</li>
   <li><span class="chip ${u.realm.some(x=>x.includes('admin'))?'ok':''}">2</span> realm: ${u.realm.join(', ')} ${u.realm.some(x=>x.includes('admin'))?'→ обход скоупа (admin)':'→ обхода нет'}</li>
   <li><span class="chip ${r?'ok':'d'}">3</span> роль в проекте: ${r||'нет'} ${r==='reader'?'→ только чтение':''}</li>
   <li><span class="chip i">=</span> итог: ${sees?'видит':'не видит'} · ${r==='reader'?'чтение':sees?'чтение и запись':'—'}</li></ul></div>`;
}
function agents(){
  if(S.id){const a=AGENTS.find(x=>x.id===S.id); if(!a) return `<div class="state err">Агент не найден.</div>`;
    const owner=PEOPLE.find(u=>u.id===a.owner);
    return `<div class="bar"><button class="btn" data-go="agents:">‹ Агенты</button></div>
    <h2 style="font-size:var(--fs-lg);color:var(--t1);text-transform:none" class="mono">${a.id}</h2>
    <div class="verdict"><b>агент</b> · профиль ${a.profile} · владелец <a href="?s=people&id=${a.owner}" data-go="people:${a.owner}" style="color:var(--acc)">${a.owner}</a> · видит ${owner.proj.length} проектов (наследует) · последний вызов ${ago(a.last)} ${a.fails?`· <span class="chip d">сбоев ${a.fails}</span>`:''} <span class="demo">демо</span></div>
    <div class="card"><div class="box"><h2>Пишет</h2>${a.writes}<p class="muted">Проекты для записи — там, где роль владельца делегирует профиль (D4). Чтение — во всех ${owner.proj.length} проектах владельца.</p>
    <div class="bar"><button class="btn dng" data-rotate="${a.id}">Ротировать секрет…</button></div></div>
    <div class="box"><h2>Журнал агента</h2>${journalRows(j=>j[2]===a.id)}</div></div>`;}
  return `<h2>Агенты</h2><p class="lead">Все агенты принадлежат людям и видят проекты владельца. Подключение и здоровье — в «Жив ли LORE → Подключения MCP».</p>
  <div class="tblw"><table><thead><tr><th>Агент</th><th>Профиль</th><th>Владелец</th><th>Видит</th><th>Последний вызов</th></tr></thead><tbody>
  ${AGENTS.map(a=>`<tr data-go="agents:${a.id}" style="cursor:pointer"><td class="mono">${a.id}</td><td>${a.profile}</td><td>${a.owner}</td><td class="muted">${PEOPLE.find(u=>u.id===a.owner).proj.length} · наследует</td><td class="mono">${a.last==null?'<span class="chip w">не видели</span>':ago(a.last)}</td></tr>`).join('')}
  </tbody></table></div><span class="demo">последний вызов — демо</span>`;
}
function projects(){
  return `<h2>Проекты</h2><p class="lead">Обратный вопрос «кто видит проект X» — у каждого проекта.</p>
  <div class="tblw"><table><thead><tr><th>Проект</th><th>Людей</th><th>Кто</th></tr></thead><tbody>
  ${PROJECTS.map(p=>{const who=PEOPLE.filter(u=>roleOf(u.id,p));return `<tr><td class="mono">${p}</td><td class="mono">${who.length}</td><td>${who.map(u=>`<span class="role ${roleOf(u.id,p)}">${u.id}</span>`).join(' ')}</td></tr>`}).join('')}
  </tbody></table></div>`;
}

// ── «Как устроен LORE» ──
function dicts(){
  return `<h2>Справочники · task_status</h2><p class="lead">Цвет — только токеном темы, значок — game-icons. Эти же статьи уходят в /lore/model → statuses, оттуда их рисует kit.</p>
  <div class="tblw"><table><thead><tr><th>Код</th><th>Подпись</th><th>Цвет</th><th>Значок</th></tr></thead><tbody>
  ${STATUSES.map(([c,l,t,i])=>`<tr><td class="mono">${c}</td><td><span style="color:var(${t})">${ico(i)}</span> ${l}</td><td class="mono"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(${t})"></span> var(${t})</td><td class="mono">${i}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function rules(){
  return `<h2>Правила CLAUDE</h2><p class="lead">Источник истины — файл на машине; LORE хранит снимок. Расхождение считает MCP рядом с файлом (<span class="mono">claude_rules_diff</span>) — браузер файла не видит, поэтому здесь показан последний присланный результат.</p>
  <div class="tblw"><table><thead><tr><th>Док</th><th>Файл</th><th>Расхождение</th></tr></thead><tbody>
  ${RULES.map(([id,t,f,d])=>`<tr><td><b>${t}</b><div class="mono muted">${id}</div></td><td class="mono" style="font-size:var(--fs-xs)">${f}</td><td>${d===0?'<span class="chip ok">совпадает</span>':d==null?'<span class="chip w">не сверяли</span>':`<span class="chip d">${d} строк</span>`}</td></tr>`).join('')}
  </tbody></table></div><span class="demo">расхождения — демо</span>`;
}
function flags(){return `<h2>Флаги</h2><p class="lead">Источник: GET /lore/admin/flags — 11 булевых флагов lore.*, переопределённые отмечены.</p><div class="state">В прототипе — список-заглушка; на экране будет живой ответ.</div>`;}
function model(){return `<h2>Модель</h2><p class="lead">/lore/model: типы (sprint, task, adr, spec), поля, связи с UML, статусы со словарём. Неполнота — честным missing.</p><div class="kpi"><div class="box"><b>4</b>типа</div><div class="box"><b>5</b>статусных словарей</div><div class="box"><b>surfaces</b>в missing</div></div>`;}

// ── «Жив ли LORE» ──
function mcp(){
  return `<h2>Подключения MCP</h2><p class="lead">MCP работает у агента на машине — LORE видит только его вызовы. Поэтому здоровье наблюдённое: звал / когда / сбои. Не звал ни разу — «не видели», а не «здоров».</p>
  <div class="kpi"><div class="box"><b>${AGENTS.filter(a=>a.last!=null&&a.last<60).length}</b>звали за час</div><div class="box"><b>${AGENTS.filter(a=>a.last==null).length}</b>не видели</div><div class="box"><b>${AGENTS.reduce((s,a)=>s+a.fails,0)}</b>сбоев записи</div></div>
  <div class="tblw"><table><thead><tr><th>Агент</th><th>Вызовов</th><th>Последний</th><th>Сбоев (≥400)</th><th>Состояние</th></tr></thead><tbody>
  ${AGENTS.map(a=>`<tr data-go="agents:${a.id}" style="cursor:pointer"><td class="mono">${a.id}</td><td class="mono">${a.calls}</td><td class="mono">${ago(a.last)}</td><td class="mono">${a.fails}</td><td>${a.last==null?'<span class="chip w">не видели</span>':a.fails?'<span class="chip d">есть сбои</span>':'<span class="chip ok">работает</span>'}</td></tr>`).join('')}
  </tbody></table></div><span class="demo">демо · срезы mcp_connections / mcp_failures</span>`;
}
function denials(){return `<h2>Отказы доступа</h2><div class="tblw"><table><thead><tr><th>Когда</th><th>Запрос</th><th>Код</th><th>Кто</th><th>Причина</th></tr></thead><tbody>${DENIALS.map(([m,meth,p,c,w,r])=>`<tr><td class="mono">${ago(m)}</td><td class="mono">${meth} ${p}</td><td class="mono">${c}</td><td>${w}</td><td class="mono">${r}</td></tr>`).join('')}</tbody></table></div><span class="demo">демо</span>`;}
function system(){return `<h2>Система и версия</h2><div class="kpi"><div class="box"><b>1.17.4</b>версия</div><div class="box"><b>V74</b>схема</div><div class="box"><b style="color:var(--suc)">●</b>Keycloak</div><div class="box"><b style="color:var(--suc)">●</b>ArcadeDB</div></div><div class="state err">Пример честной ошибки: «CI-статус не получен — Forgejo ответил 503, <button class="btn">Повторить</button>» (не «пусто»).</div>`;}
function journal(){return `<h2>Журнал (всё)</h2><p class="lead">Один ряд AO-01 на всю админку; у каждой карточки — свой срез этого же журнала.</p><div class="box">${journalRows()}</div><span class="demo">демо</span>`;}

const VIEWS={matrix,people,agents,projects,dicts,rules,flags,model,mcp,denials,system,journal};
function render(){ side(); $('#main').innerHTML = where() + (VIEWS[S.s]||matrix)(); }

// ── Опасные действия: дифф, ввод подтверждения, «Отменить», журнал ──
let undoFn=null;
function confirmDlg({title,diff,word,irreversible,apply}){
  $('#dlg').innerHTML=`<h2 style="color:var(--t1)">${title}</h2><div class="diff">${diff}</div>
   <p class="muted">${irreversible?'<span class="chip d">необратимо</span>':'<span class="chip ok">можно отменить 10 с</span>'} Чтобы подтвердить, введите <b class="mono">${word}</b>.</p>
   <input id="cw" autocomplete="off"><div class="bar" style="justify-content:flex-end"><button class="btn" id="cx">Отмена</button><button class="btn dng" id="cok" disabled>Применить</button></div>`;
  $('#layer').classList.add('on');
  $('#cw').oninput=e=>$('#cok').disabled=e.target.value!==word; $('#cw').focus();
  $('#cx').onclick=()=>$('#layer').classList.remove('on');
  $('#cok').onclick=()=>{ $('#layer').classList.remove('on'); undoFn=apply(); render(); toast('Готово, записано в журнал', !irreversible); };
}
function toast(t,canUndo){ $('#toastText').textContent=t; $('#undoBtn').style.display=canUndo?'':'none'; $('#toast').classList.add('on');
  clearTimeout(toast.h); toast.h=setTimeout(()=>{$('#toast').classList.remove('on');undoFn=null},10000); }
$('#undoBtn').onclick=()=>{ if(undoFn){undoFn();undoFn=null;render();} $('#toast').classList.remove('on'); };
function setRole(u,p,nr){ const pr=PEOPLE.find(x=>x.id===u).proj; const i=pr.findIndex(x=>x[0]===p);
  if(nr==='—'){ if(i>=0) pr.splice(i,1); } else if(i>=0) pr[i][1]=nr; else pr.push([p,nr]); }

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-s]'); if(a){e.preventDefault(); go({s:a.dataset.s,id:'',t:'',q:''}); return;}
  const g=e.target.closest('[data-go]'); if(g){e.preventDefault(); const [s,id]=g.dataset.go.split(':'); go({s,id:id||'',t:''}); return;}
  const t=e.target.closest('[data-tab]'); if(t){ go({t:t.dataset.tab}); return; }
  const c=e.target.closest('[data-cell]'); if(c){ const [u,p]=c.dataset.cell.split('|'); const cur=roleOf(u,p)||'—';
    const nr = cur==='owner'?'reader':cur==='reader'?'—':'reader';
    confirmDlg({title:`Роль ${u} в ${p}`, diff:`<div class="m">− ${cur}</div><div class="p">+ ${nr}</div>`, word:u,
      apply:()=>{ setRole(u,p,nr==='—'?'—':nr); JOURNAL.unshift([0,'h','вы','user',u,`${cur} → ${nr} в ${p}`]); return ()=>{setRole(u,p,cur==='—'?'—':cur); JOURNAL.shift();}; }}); return; }
  const b=e.target.closest('[data-bulk]'); if(b){ const [u,r]=b.dataset.bulk.split('|'); const ps=PEOPLE.find(x=>x.id===u).proj.filter(x=>x[1]===r).map(x=>x[0]); const nr=r==='owner'?'reader':'owner';
    confirmDlg({title:`${u}: ${r} → ${nr} в ${ps.length} проектах`, diff:ps.map(p=>`<div>${p}: <span class="m">${r}</span> → <span class="p">${nr}</span></div>`).join(''), word:u,
      apply:()=>{ ps.forEach(p=>setRole(u,p,nr)); JOURNAL.unshift([0,'h','вы','user',u,`пачка: ${r} → ${nr} · ${ps.length} назначений`]); return ()=>{ps.forEach(p=>setRole(u,p,r)); JOURNAL.shift();}; }}); return; }
  const rt=e.target.closest('[data-rotate]'); if(rt){ const id=rt.dataset.rotate;
    confirmDlg({title:`Ротировать секрет ${id}`, diff:`<div class="m">− текущий секрет перестанет работать сразу</div><div class="p">+ новый секрет — показан один раз</div>`, word:id, irreversible:true,
      apply:()=>{ JOURNAL.unshift([0,'h','вы','kc',id,'ротировал секрет']); return null; }}); }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ S.q=e.target.value; history.replaceState(null,'','?'+new URLSearchParams(S)); const pos=e.target.selectionStart; render(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos);} });
document.addEventListener('change',e=>{ if(e.target.id==='whereSel') go({s:e.target.value,id:'',t:''}); if(e.target.id==='whyP') go({p:e.target.value}); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#layer').classList.remove('on'); });
$('#themeBtn').onclick=()=>{ const r=document.documentElement; r.dataset.theme = r.dataset.theme==='light'?'dark':'light'; };
render();
</script>
</body>
</html>
