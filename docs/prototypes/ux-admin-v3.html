const LEGACY_TAB={users:'users',agents:'agents',roles:'roles',dicts:'dicts',projects:'projects',tags:'tags',claudeRules:'rules',settings:'settings',quick:'quick',mcpApi:'mcp',connections:'conn'};
function readUrl(){
  const p=new URLSearchParams(location.search);const notes=[];
  if(p.has('tab')&&!p.has('s')){const old=p.get('tab');const nw=LEGACY_TAB[old];
    if(nw){p.set('s',nw);if(p.get('user')){p.set('id',p.get('user'));}if(p.get('doc')){p.set('id',p.get('doc'));}notes.push(`Старая ссылка ?tab=${old} нормализована → раздел «${SEC[nw].l}».`);}
    else notes.push(`Раздела «${old}» нет — открыта Сводка (раньше молча открывались «Словари»).`);
    p.delete('tab');p.delete('user');p.delete('doc');}
  const s=p.get('s')||'overview';
  if(!SEC[s]){notes.push(`Раздела «${s}» нет — открыта Сводка.`);st.s='overview';}else st.s=s;
  st.id=p.get('id');st.tab=p.get('t')||'over';st.q=p.get('q')||'';st.g=p.get('g')||'';st.o=p.get('o')||'';
  st.f={};(p.get('f')||'').split(',').filter(Boolean).forEach(kv=>{const [k,v]=kv.split(':');if(k)st.f[k]=v;});
  st.dict=p.get('dict')||'area';st.roles=p.get('roles')==='by-object'?'by-object':'by-role';
  st.scen=p.get('scen')||'ok';if(p.has('rail'))st.rail=p.get('rail')==='1';
  const th=p.get('theme')||localStorage.getItem('adm.theme');if(th)document.documentElement.dataset.theme=th;
  st.notice=notes.join(' ')||null;
}
function writeUrl(push){
  const p=new URLSearchParams();p.set('s',st.s);
  if(st.id)p.set('id',st.id);if(st.id&&st.tab!=='over')p.set('t',st.tab);
  if(st.q)p.set('q',st.q);const f=Object.entries(st.f).filter(([,v])=>v&&v!=='all').map(([k,v])=>k+':'+v).join(',');if(f)p.set('f',f);
  if(st.g)p.set('g',st.g);if(st.o)p.set('o',st.o);if(st.s==='dicts'&&st.dict!=='area')p.set('dict',st.dict);
  if(st.s==='roles'&&st.roles==='by-object')p.set('roles','by-object');if(st.scen!=='ok')p.set('scen',st.scen);
  history[push?'pushState':'replaceState'](null,'','?'+p.toString());
}
function go(s,id,extra){ // одно правило сброса: смена раздела сбрасывает id, вкладку, поиск, фильтры, группировку, порядок

  st.s=s;st.id=id||null;st.tab='over';st.form=null;Object.assign(st,extra||{});st.notice=null;writeUrl(true);render();

}

/* ================= ОБОЛОЧКА ================= */
function counter(k){
  const kc=kcState();
  if(k==='users')return kc==='ok'?{n:PEOPLE.length}:{unk:kc==='403'?'не смогли проверить: 403 — нет прав':'не смогли проверить: Keycloak не ответил'};
  if(k==='agents')return {n:AGENTS.length};
  if(k==='dicts')return sliceOk()?{n:Object.keys(DICT_RAW).length}:{unk:'не смогли проверить: слайс dictionary упал (502)'};
  if(k==='projects')return sliceOk()?{n:PROJECTS.length}:{unk:'не смогли проверить: слайс git_projects упал'};
  if(k==='tags')return {n:'500+'};
  if(k==='rules')return {n:RULES.length};
  if(k==='settings')return {bad:1,why:'1 неопознанный ключ app_setting'};
  if(k==='denials')return {n:DENIALS.length};
  if(k==='health')return {unk:'MCP-сервер из браузера не проверяется'};
  return null;
}
function cntHtml(k){const c=counter(k);if(!c)return '';
  if(c.unk)return `<span class="cnt unk" title="${esc(c.unk)}" aria-label="${esc(c.unk)}">?</span>`;
  if(c.bad)return `<span class="cnt bad" title="${esc(c.why)}" aria-label="${esc(c.why)}">${c.bad}</span>`;
  return `<span class="cnt">${c.n}</span>`;}

/* ================= СПИСКИ (общий механизм) ================= */
/* cfg: {cols:[{k,l,ttl,html(row)}], rows, search(row)->str, filters:[{k,l,icon,opts:[[v,l,pred]]}], groups:[[k,l,fn]], orders:[[k,l,cmp]], open(row)->id} */
function listView(cfg){
  const q=st.q.toLowerCase();
  let rows=cfg.rows.filter(r=>!q||cfg.search(r).toLowerCase().includes(q));
  const fparts=[];
  (cfg.filters||[]).forEach(f=>{const v=st.f[f.k]||'all';const o=f.opts.find(x=>x[0]===v)||f.opts[0];if(o[0]!=='all'){rows=rows.filter(o[2]);}fparts.push(`${f.l} = ${o[1]}`);});
  const ord=(cfg.orders||[]).find(o=>o[0]===st.o)||(cfg.orders||[])[0];if(ord)rows=rows.slice().sort(ord[2]);
  const grp=st.g?(cfg.groups||[]).find(g=>g[0]===st.g&&g[2]):null;
  const fOn=Object.values(st.f).some(v=>v&&v!=='all');
  let desc=`Показано ${rows.length} из ${cfg.rows.length}${cfg.totalNote?' '+cfg.totalNote:''} · ${fparts.join(' · ')||'без фильтра'}${q?` · поиск «${esc(st.q)}»`:''} · ${grp?'группировка: '+grp[1]:'без группировки'} · порядок: ${ord?ord[1]:'—'}`;
  let body='';
  if(!rows.length)body=`<tr><td colspan="${cfg.cols.length}" class="state">${q||fOn?'Под фильтр ничего не подошло (проверено).':'Пусто (проверено): слайс ответил, строк нет.'}</td></tr>`;
  else{
    const line=r=>{const oid=cfg.open(r);return (oid?`<tr class="row" data-act="open" data-id="${esc(oid)}" tabindex="0">`:`<tr class="row ro">`)+`${cfg.cols.map(c=>`<td data-l="${esc(c.l)}" class="${c.ttl?'ttl':''}"><span>${c.html(r)}</span></td>`).join('')}</tr>`;};
    if(grp){const m=new Map();rows.forEach(r=>{const k=grp[2](r);if(!m.has(k))m.set(k,[]);m.get(k).push(r);});
      body=[...m.entries()].map(([k,rs])=>`<tr class="gh"><td colspan="${cfg.cols.length}">${esc(k)} · ${rs.length}</td></tr>`+rs.map(line).join('')).join('');}
    else body=rows.map(line).join('');
  }
  return `<div class="ctl" role="toolbar" aria-label="Управление списком">
    <input class="search" type="search" placeholder="${esc(cfg.ph||'Поиск…')}  ( / )" aria-label="Поиск по списку" value="${esc(st.q)}" data-act="q" id="q">
    <button class="ib ${fOn?'on':''}" data-act="menu-f" aria-haspopup="menu">${ic('funnel')}Фильтр${fOn?' · '+Object.values(st.f).filter(v=>v&&v!=='all').length:''}</button>
    <button class="ib ${grp?'on':''}" data-act="menu-g" aria-haspopup="menu">${ic('stack')}Группировка</button>
    <button class="ib" data-act="menu-o" aria-haspopup="menu">${ic('trade')}Порядок</button>
    ${cfg.add?`<button class="btn pri" data-act="${cfg.add[0]}">+ ${esc(cfg.add[1])}</button>`:''}
  </div>
  <div class="fdesc">${desc}${fOn||q||grp?` <button data-act="reset">Сбросить всё</button>`:''}</div>
  <table class="rt"><thead><tr>${cfg.cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
}

function toast(msg,undoFn){
  const T=document.getElementById('toasts');const el=document.createElement('div');el.className='toast';
  el.innerHTML=`<span>${esc(msg)}</span><span class="sp"></span>${undoFn?'<button class="btn">Отменить</button>':''}<button class="btn" aria-label="Закрыть">✕</button>`;
  T.appendChild(el);const btns=el.querySelectorAll('button');
  if(undoFn)btns[0].addEventListener('click',()=>{undoFn();el.remove();toast('Отменено. В журнале — запись об отмене.');});
  btns[btns.length-1].addEventListener('click',()=>el.remove());
  setTimeout(()=>el.remove(),undoFn?10000:4000);
}

  case 'nav': go(t.dataset.k);break;
  case 'goto': go(t.dataset.s,t.dataset.id||null);break;
  case 'goto-audit': go('audit',null);st.f={sec:t.dataset.sec};writeUrl(false);render();break;
  case 'open': if(t.dataset.id)go(st.s,t.dataset.id,{q:st.q,f:st.f,g:st.g,o:st.o});break;
  case 'open-s': if(t.dataset.id)go(t.dataset.s,t.dataset.id);break;

  case 'roles': st.roles=t.dataset.k;writeUrl(false);render();break;
  case 'reset': st.q='';st.f={};st.g='';st.o='';writeUrl(false);render();break;
  case 'retry': toast('Повторный запрос отправлен (прототип: сценарий не меняется).');break;
  case 'menu-f': openMenu(t,(LISTCFG.filters||[]).map(f=>`<div class="mh">${ic(f.icon||'funnel')} ${esc(f.l)}</div>`+f.opts.map(o=>`<button role="menuitemradio" aria-checked="${(st.f[f.k]||'all')===o[0]}" data-act="setf" data-k="${f.k}" data-v="${o[0]}">${(st.f[f.k]||'all')===o[0]?ic('check-mark'):'<span style="width:1em"></span>'}${esc(o[1])}</button>`).join('')).join('<div class="sep"></div>'));break;
  case 'menu-g': openMenu(t,`<div class="mh">Группировка</div>`+(LISTCFG.groups||[]).map(g=>`<button role="menuitemradio" aria-checked="${st.g===g[0]}" data-act="setg" data-v="${g[0]}">${st.g===g[0]?ic('check-mark'):'<span style="width:1em"></span>'}${esc(g[1])}</button>`).join(''));break;
  case 'menu-o': openMenu(t,`<div class="mh">Порядок</div>`+(LISTCFG.orders||[]).map(o=>`<button role="menuitemradio" aria-checked="${st.o===o[0]}" data-act="seto" data-v="${o[0]}">${st.o===o[0]?ic('check-mark'):'<span style="width:1em"></span>'}${esc(o[1])}</button>`).join(''));break;
  case 'setf': st.f[t.dataset.k]=t.dataset.v;writeUrl(false);render();break;
  case 'setg': st.g=t.dataset.v;writeUrl(false);render();break;
  case 'seto': st.o=t.dataset.v;writeUrl(false);render();break;
  case 'where': openMenu(t,NAV.map(g=>`<div class="mh"><span class="dot" style="background:var(--${g.tone})"></span> ${esc(g.g)} ${g.risk?'· '+esc(g.risk):''}</div>`+g.items.map(([k,l,i])=>`<button role="menuitemradio" aria-checked="${st.s===k}" data-act="nav" data-k="${k}">${ic(i)}${esc(l)}${cntHtml(k)}</button>`).join('')).join(''));break;
  case 'avatar': openMenu(t,`<div class="mh">vasilisk · admin</div><button data-act="personal">${ic('person')}Личные настройки</button><button data-act="theme">${ic('sun')}Тема: ${document.documentElement.dataset.theme==='dark'?'тёмная → светлая':'светлая → тёмная'}</button><div class="sep"></div><div class="mh">Только для admin</div><button data-act="nav" data-k="overview">${ic('cog')}Админка</button><div class="sep"></div><button data-act="logout">${ic('exit-door')}Выйти</button>`);break;
  case 'app': if(t.dataset.k!=='admin')toast('Переход в другое приложение — вне прототипа.');break;
  case 'personal': closeMenu();toast('Личные настройки — отдельная страница пользователя, не админка (тема, виды, флаги «для себя»).');break;
  case 'logout': closeMenu();toast('Выход — вне прототипа.');break;
  case 'theme': {const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('adm.theme',n);closeMenu();break;}
  case 'search': {const q=document.getElementById('q');if(q)q.focus();else toast('Поиск по всей админке — Ctrl+K (вне прототипа). На экранах-списках «/» ставит курсор в поиск.');break;}
  case 'syschip': {const d=t.getAttribute('title');const was=t.getAttribute('aria-expanded')==='true';document.querySelectorAll('#sys .chip').forEach(c=>c.setAttribute('aria-expanded','false'));let box=document.getElementById('sysd');if(box)box.remove();if(!was){t.setAttribute('aria-expanded','true');box=document.createElement('div');box.id='sysd';box.className='notice';box.style.cssText='margin:0;flex-basis:100%';box.textContent=d;document.getElementById('sys').appendChild(box);}break;}
  case 'proto': openMenu(t,`<div class="mh">Сценарий данных</div>`+[['ok','Всё отвечает'],['kc403','Keycloak: 403'],['kcdown','Keycloak недоступен'],['slicefail','Слайсы словарей/проектов упали']].map(([k,l])=>`<button role="menuitemradio" aria-checked="${st.scen===k}" data-act="scen" data-k="${k}">${st.scen===k?ic('check-mark'):'<span style="width:1em"></span>'}${l}</button>`).join('')+`<div class="sep"></div><div class="mh">Старые ссылки</div><button data-act="legacy" data-u="?tab=claudeRules&doc=claude_rules_global">?tab=claudeRules&amp;doc=…</button><button data-act="legacy" data-u="?tab=users&user=vasilisk">?tab=users&amp;user=vasilisk</button><button data-act="legacy" data-u="?tab=nonsense">?tab=nonsense</button>`);break;
  case 'scen': st.scen=t.dataset.k;writeUrl(false);render();break;
  case 'legacy': history.pushState(null,'',t.dataset.u);readUrl();writeUrl(false);render();break;
  case 'copy': case 'copyq': {const txt=a==='copyq'?t.dataset.c:t.closest('.bb').querySelector('.pre').textContent;
     if(!navigator.clipboard||!window.isSecureContext){toast('Не скопировано: браузер не даёт буфер вне https. Выделите текст вручную.');break;}
     navigator.clipboard.writeText(txt).then(()=>toast('Скопировано.'),()=>toast('Не скопировано: браузер отказал.'));break;}
  case 'formf': break;
  case 'form-reset': st.form=null;render();break;
  case 'form-save': {const r=curRec();const f=st.form;const kind=t.dataset.kind;const before={};Object.keys(f).forEach(k=>before[k]=r[k]);
     const apply=()=>{Object.assign(r,f);st.form=null;logAudit(SEC[st.s].gkey,SEC[st.s].l,r.id,'изменено: '+Object.keys(f).map(k=>`${k} «${before[k]??''}» → «${f[k]}»`).join(', '));render();toast('Сохранено: новая версия записи.',()=>{Object.assign(r,before);logAudit(SEC[st.s].gkey,SEC[st.s].l,r.id,'отмена правки');render();});};
     const risky=(kind==='dict'&&CANON.includes(r.type))||kind==='agent';
     if(risky)confirmRisk({title:kind==='agent'?'Изменить привязку агента':'Правка канон-словаря',diff:Object.keys(f).map(k=>`<span class="m">- ${esc(k)}: ${esc(before[k]??'')}</span>\n<span class="p">+ ${esc(k)}: ${esc(f[k])}</span>`).join('\n'),word:kind==='agent'?r.client:r.code,undo:true,onOk:apply});
     else apply();break;}
  case 'realm': {const u=curRec();const r=t.dataset.r;const on=t.dataset.on==='1';
     if(on&&r==='admin'&&PEOPLE.filter(p=>p.realm.includes('admin')).length<=1){toast('Нельзя: это последний admin (409 LAST_ADMIN).');break;}
     confirmRisk({title:`${on?'Снять':'Выдать'} realm-роль ${r}`,diff:`  человек: ${esc(u.id)}\n<span class="${on?'m':'p'}">${on?'-':'+'} realm: ${r}</span>\n  итого: ${esc((on?u.realm.filter(x=>x!==r):[...u.realm,r]).join(', ')||'нет ролей')}`,word:u.id,undo:true,
       onOk:()=>{const prev=u.realm.slice();u.realm=on?u.realm.filter(x=>x!==r):[...u.realm,r];logAudit('access','Люди',u.id,`${on?'снята':'выдана'} realm-роль ${r}`);render();toast(`${on?'Снята':'Выдана'} роль ${r} — ${u.id}.`,()=>{u.realm=prev;logAudit('access','Люди',u.id,'отмена: realm-роль '+r);render();});}});break;}
  case 'projdel': {const u=curRec();const i=+t.dataset.i;const [p,r]=u.proj[i];
     confirmRisk({title:'Снять роль в проекте',diff:`<span class="m">- ${esc(p)} · ${esc(r)}</span>\n  после: ${u.proj.length-1} проект(ов)${u.proj.length===1?'\n  ⚠ без проектов человек не увидит ничего':''}`,word:u.id,undo:true,
       onOk:()=>{const prev=u.proj.slice();u.proj.splice(i,1);logAudit('access','Люди',u.id,`снята роль ${r} в ${p}`);render();toast('Роль в проекте снята.',()=>{u.proj=prev;render();});}});break;}
  case 'projadd': toast('Выбор проекта и роли — как в текущей админке (select проект + select роль). В прототипе не воспроизводится.');break;
  case 'user-off': {const u=curRec();confirmRisk({title:'Отключить учётку',diff:`  человек: ${esc(u.id)}\n<span class="m">- enabled: true</span>\n<span class="p">+ enabled: false</span>\n  агентов владельца: ${AGENTS.filter(a=>a.owner===u.id).length} — перестанут работать`,word:u.id,undo:true,onOk:()=>{u.on=false;logAudit('access','Люди',u.id,'учётка отключена');render();toast('Учётка отключена.',()=>{u.on=true;render();});}});break;}
  case 'rotate': {const ag=curRec();confirmRisk({title:'Ротировать секрет',diff:`  учётка: ${esc(ag.client)}\n<span class="m">- секрет: ••••••• (действующий)</span>\n<span class="p">+ секрет: новый, покажется один раз</span>`,word:ag.client,undo:false,note:'Клиент со старым секретом перестанет подключаться сразу.',onOk:()=>{logAudit('access','Агенты',ag.id,'ротирован секрет '+ag.client);render();toast('Секрет ротирован. Новый показан один раз (прототип: не показывается).');}});break;}
  case 'deact': {const d=curRec();confirmRisk({title:'Деактивировать значение',diff:`  ${esc(d.type)}/${esc(d.code)}\n<span class="m">- is_active: true</span>\n<span class="p">+ is_active: false</span>\n  использований: н/д — проверьте, прежде чем снимать`,word:d.code,undo:true,onOk:()=>{d.active=false;logAudit('dicts','Словари',d.id,'деактивировано');render();toast('Значение отключено.',()=>{d.active=true;render();});}});break;}
  case 'react': {const d=curRec();d.active=true;logAudit('dicts','Словари',d.id,'включено обратно');render();toast('Значение включено.',()=>{d.active=false;render();});break;}
  case 'setting-del': {const s=curRec();confirmRisk({title:'Удалить неопознанный ключ',diff:`<span class="m">- app_setting/${esc(s.id)} = ${esc(s.val)}</span>\n  код этот ключ не читает — удаление ни на что не влияет`,word:s.id,undo:true,onOk:()=>{const i=SETTINGS.indexOf(s);SETTINGS.splice(i,1);logAudit('sys','Настройки',s.id,'удалён ключ');go('settings');toast('Ключ удалён (is_active=false).',()=>{SETTINGS.splice(i,0,s);render();});}});break;}
  case 'member-del': toast('Снятие участника — тем же подтверждением, что и в карточке человека. Последнего owner снять нельзя.');break;
  case 'flag-user': {const u=PEOPLE.find(p=>p.id===t.dataset.id);u.newNav=!u.newNav;logAudit('sys','Флаги',u.id,`новая навигация: ${u.newNav?'вкл':'выкл'}`);render();toast(`Новая навигация для ${u.id}: ${u.newNav?'включена':'выключена'}.`,()=>{u.newNav=!u.newNav;render();});break;}
  case 'flag': {const f=FLAGS.find(x=>x.id===t.dataset.id);confirmRisk({title:'Флаг на всех пользователей',diff:`<span class="${f.on?'m':'p'}">${f.on?'-':'+'} ${esc(f.name)}</span>\n  затронет всех пользователей сразу`,word:f.id,undo:true,onOk:()=>{f.on=!f.on;logAudit('sys','Флаги',f.id,f.on?'включён':'выключен');render();toast('Флаг переключён.',()=>{f.on=!f.on;render();});}});break;}
  case 'add-user': case 'add-agent': case 'add-dict': case 'add-project': case 'add-type': toast('Форма создания — как в текущей админке, открывается страницей новой записи. В прототипе не воспроизводится.');break;
  case 'm-cancel': closeLayer();break;
  case 'scrim': if(e.target===t)closeLayer();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.act==='q'){st.q=t.value;writeUrl(false);const pos=t.selectionStart;render();const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(pos,pos);}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='formf'){const rec=({users:PEOPLE,agents:AGENTS,dicts:DICTS,projects:PROJECTS,settings:SETTINGS}[st.s]||[]).find(x=>x.id===st.id);let v=t.value;if(t.type==='number')v=+v;st.form=st.form||{};if(rec&&rec[t.dataset.k]===v)delete st.form[t.dataset.k];else st.form[t.dataset.k]=v;if(!Object.keys(st.form).length)st.form=null;const id=t.id;render();const el=document.getElementById(id);el&&el.focus();}
  if(t.dataset.act==='projrole'){const u=PEOPLE.find(p=>p.id===st.id);const i=+t.dataset.i;const prev=u.proj[i][1];const nv=t.value;
    confirmRisk({title:'Сменить роль в проекте',diff:`  ${esc(u.proj[i][0])}\n<span class="m">- ${esc(prev)}</span>\n<span class="p">+ ${esc(nv)}</span>`,word:u.id,undo:true,onOk:()=>{u.proj[i][1]=nv;logAudit('access','Люди',u.id,`роль в ${u.proj[i][0]}: ${prev} → ${nv}`);render();toast('Роль изменена.',()=>{u.proj[i][1]=prev;render();});}});
    t.value=prev;}
});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==='Escape'){closeMenu();closeLayer();}
  if(e.key==='/'&&!typing){const q=document.getElementById('q');if(q){e.preventDefault();q.focus();}}
  if(e.key==='Enter'&&document.activeElement.matches('tr.row')){document.activeElement.click();}
});
readUrl();writeUrl(false);render();
</script>
</body>
</html>
