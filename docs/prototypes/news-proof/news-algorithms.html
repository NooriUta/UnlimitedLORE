<script>
const MD = "# Новости v2: алгоритмы единого сервиса сбора\n\n**Статус:** проект, **на подтверждение владелицы**.\n\n**История версий:**\n- **0.1.0** — «создайте спеку с описанием алгоритмов, я подтвержу».\n- **0.2.0** — «считаем как события, так и уникальные элементы… он может относиться к нескольким классам в разрезе».\n- **0.3.0** — «сгорание по событиям — странно… не хватает LaTeX-формул и ревалидации».\n- **0.4.0** — «burnout only for sprints tasks (ADRs, specs must have their own metrics)»: сгорание считается только для задач спринтов (§7.2), у ADR, решений и спек свои метрики (§7.3).\n- **0.5.0** — «с протухшими я не согласна: если у нас есть устойчивое решение, оно может не быть протухшим для спек, ADR и прочего; ревалидация реально нужна, но это уже не в новостях — это к quality gates». Свежесть и «протухшие» из новостей убраны. Ревалидация знаний (подтверждение, что спека или ADR ещё в силе) вынесена в quality gates, §12.\n\n**Основания:** ADR-LORE-045, D-2026-UXR-NEWS-AGGREGATOR, D-2026-UXR-NEWS-V2-RULES.\n\n**Связано:** SPEC-LORE-UXR-NEWS-PARITY, SPEC-LORE-UXR-PROTO-NEWS, SPRINT_UXR_S7A_NEWS (S7A-01…04, S7A-09).\n\n**Главное правило устройства.** Всё считается **один раз на сервере**. Веб v1, веб v2 и miniLORE только рисуют.\n\n```mermaid\nflowchart LR\n  H[История SCD2] --> X[1. События]\n  H --> Snap[Снимки состояния\u003cbr/>на t0 и t1]\n  X --> G[2. Элементы, группы]\n  G --> S[3. Скоуп] --> D[4. День/время] --> U[5. Дедуп] --> C[6. Свёртка]\n  C --> M[7. Метрики по классам]\n  Snap --> M\n  M --> V[10. Ревалидация]\n  V --> O[Ответ + meta]\n```\n\n## 1. События\n\n**Элемент** — запись LORE, ключ `тип : id` (у задачи `task_uid`). **Событие** — (элемент, вид, момент, кто). У одного элемента может быть несколько событий, в том числе за день.\n\n| Тип | События | Источник |\n|---|---|---|\n| Задача спринта | заведена · закрыта · снята · переоткрыта · сменила статус | минимальный `valid_from`; версия с переходом категории статуса |\n| Спринт | создан · закрыт | `created_date`; переход в done |\n| Релиз | выпущен | `release_date` |\n| ADR | создан · изменён · сменил статус (proposed → accepted / rejected / superseded) | создание; новая версия истории |\n| Решение | создано · изменено · сменило статус | `date_created`; `updated_at`; статус |\n| Спека | создана · новая версия · сменила статус | создание; смена `version` или тела; статус |\n| Веха, вопрос, компонент | создано · сменило статус | создание; смена статуса |\n\n- **Кто:** личность, записавшая версию (агентные — AGENT-*). Нет личности — «неизвестно».\n- **Категории статуса** — из общего словаря категорий (D-2026-UXR-STATUS-AXIS). У задач: открыто / закрыто. У ADR, решений и спек: на рассмотрении / действует / снято-заменено.\n- **[ВЫБОР-1]** Новые типы в ленте (вехи, вопросы, компоненты, статус ADR). Рекомендация: да, вехи и вопросы свёрнуты.\n\n## 2. Двойной счёт и мультипринадлежность\n\n- **Две единицы, всегда обе:** события и уникальные элементы, `12 событий · 5 задач`.\n- **Принадлежность к группе разреза — список.** Задача общего спринта входит в оба проекта, ADR — в оба компонента.\n- **Правила:**\n  - в каждой группе элемент считается полностью;\n  - итог над группами — **объединение**;\n  - пересечение видно: «×2 проекта» и «в нескольких группах: N»;\n  - подгруппировка — те же правила на каждом уровне;\n  - клик по числу группы фильтрует всё, что в неё входит;\n  - доли групп в 100% не складываются.\n- Дробного счёта нет.\n\n## 3. Скоуп\n\n- Пустой скоуп — 403 `SCOPE_EMPTY`.\n- Элемент виден, если разрешён хотя бы один его проект.\n- В группах и в «×N» участвуют только разрешённые проекты.\n- Элемент без проекта: без ограничений — в группе «без проекта», под скоупом — скрыт.\n\n## 4. День и время\n\n- `at_utc` — время машины. По поясу клиента `tz` сервер вычисляет `at_local` и `day_local`.\n- В строке рядом: `14:05 · 11:05 UTC`.\n- **[ВЫБОР-2]** Группировка по местному дню. Рекомендация: да.\n- Без времени — «время неизвестно».\n- «Будущее»: `at_utc` позже текущего момента сервера.\n\n## 5. Дедуп\n\nКлюч события: `элемент : вид : day_local`. «Изменено» — одна строка в день с кратностью (×5): событий 5, элементов 1. День создания не даёт «изменено».\n\n## 6. Свёртка серий\n\nОдин вид, один автор, один родитель, окно **[ВЫБОР-3]** (рекомендация 30 минут). Свёртка — только вид. Счёт — по событиям и элементам. Серия с элементами разных групп делится по группам.\n\n## 7. Метрики — формулы\n\n**Обозначения:**\n- период $P=[t_0,t_1)$, предыдущий $P^-=[t_0-(t_1-t_0),\\,t_0)$;\n- $E$ — события в $P$ после скоупа и дедупа; у события $e$: элемент $\\mathrm{el}(e)$, вид $\\mathrm{kind}(e)$, автор $\\mathrm{who}(e)$;\n- $G(x)$ — группы разреза элемента $x$; $E_g=\\{e\\in E: g\\in G(\\mathrm{el}(e))\\}$; $X(S)=\\{\\mathrm{el}(e):e\\in S\\}$;\n- $\\mathrm{cat}(x,t)$ — категория статуса $x$ в момент $t$ по снимку SCD2 (последняя версия с $\\mathrm{valid\\_from}\\le t$); $\\mathrm{exists}(x,t)$ — элемент уже существует.\n\n### 7.1 Счёт событий и элементов — общий для всех классов\n\n$$N_{ev}(g)=|E_g|,\\qquad N_{el}(g)=|X(E_g)|,\\qquad N^{\\Sigma}_{ev}=|E|,\\qquad N^{\\Sigma}_{el}=|X(E)|$$\n\n$$M=|\\{x\\in X(E):|G(x)|\\ge 2\\}|,\\qquad \\sum_g N_{el}(g)=N^{\\Sigma}_{el}+\\sum_{x\\in X(E)}(|G(x)|-1)$$\n\nПо видам и по типам — те же формулы на подмножествах $E^{k}$.\n\n### 7.2 Задачи спринтов — сгорание по состоянию\n\n**Только задачи спринтов.** У ADR, решений и спек сгорания нет, у них свои метрики (§7.3).\n\n**Почему по состоянию, а не по событиям.**\n- Закрыта → переоткрыта → закрыта даёт 2 события «закрыта», хотя работы стало меньше на одну задачу.\n- Заведена и закрыта внутри периода даёт 0 в разности событий, хотя работа сделана.\n\n$T_g$ — задачи спринтов группы $g$, существующие хотя бы на одной границе; $\\mathrm{open}(x,t)=[\\mathrm{cat}(x,t)=\\text{открыто}]$.\n\n$$O_g(t)=\\sum_{x\\in T_g}\\mathrm{open}(x,t),\\qquad \\mathrm{Burn}_g=O_g(t_0)-O_g(t_1)$$\n\n$$\\mathrm{Burn}_g=C_g-A_g,\\quad C_g=|\\{x:\\mathrm{open}(x,t_0)=1,\\ \\mathrm{open}(x,t_1)=0\\}|,\\quad A_g=|\\{x:(\\mathrm{open}(x,t_0)=0\\lor\\lnot\\mathrm{exists}(x,t_0)),\\ \\mathrm{open}(x,t_1)=1\\}|$$\n\nЗнак $\\mathrm{Burn}$: больше нуля — открытой работы стало меньше (зелёный), меньше нуля — стало больше (красный).\n\nИнформационно:\n- $W_g$ — «сделано внутри периода» (закрыты хотя бы раз в $P$ из открытых или новых);\n- $R_g$ — переоткрыто.\n\nРазрез «по спринтам» — естественный: для спринта $T_g$ = его задачи. Для проекта — задачи всех его спринтов, с мультипринадлежностью по §2.\n\n### 7.3 ADR, решения, спеки — свои метрики\n\nЗнания не «сгорают»: у них нет цели «закрыть всё». Важны **поток решений** (очередь на рассмотрении не копится), **устойчивость** (как часто пересматривают и заменяют) (возраст записи сам по себе ничего не говорит: устойчивое решение не протухает). Счёт везде парой «события · элементы», группы — по §2.\n\n**Очередь на рассмотрении (ADR и решения)** — по состоянию, как сгорание, но для очереди:\n\n$$Q_g(t)=|\\{x\\in K_g:\\mathrm{cat}(x,t)=\\text{на рассмотрении}\\}|,\\qquad \\mathrm{Flow}_g=Q_g(t_0)-Q_g(t_1)$$\n\n- $K_g$ — ADR (или решения) группы. $\\mathrm{Flow}>0$ — очередь рассасывается, $\u003c0$ — копится.\n- Разложение: **принято** $Acc_g$ (на рассмотрении → действует), **отклонено** $Rej_g$, **поступило** $New_g$ (новые на рассмотрении):\n\n$$\\mathrm{Flow}_g=Acc_g+Rej_g-New_g$$\n\n**Время до решения** (медиана, дни) по ADR, принятым в $P$:\n\n$$\\mathrm{TTD}_g=\\mathrm{median}\\{t_{accept}(x)-t_{create}(x): x\\in K_g,\\ t_{accept}(x)\\in P\\}$$\n\n**Устойчивость:**\n- **заменено** $Sup_g$ — переходы в superseded / deprecated за $P$;\n- **пересмотры** — правки тела уже действующих ADR, $Rev_{ev}$ событий · $Rev_{el}$ элементов;\n- **доля пересмотров** $=Rev_{el}/|\\{x\\in K_g:\\mathrm{cat}(x,t_1)=\\text{действует}\\}|$.\n\n**Спеки:**\n- **версии** — события «новая версия»: $V_{ev}$ · $V_{el}$; по уровню semver (major / minor / patch), если поле версии разобрано;\n- **принято** — на рассмотрении → действует;\n- ~~свежесть и «протухшие»~~ — сняты в 0.5.0: устойчивое решение не протухает. Ревалидация знаний ушла в quality gates (§12).\n\n**Решения (KnowDecision)** — как ADR (очередь, принято, заменено). Дополнительно — «решений на ADR», число детей по ADR, принятым в $P$: видно, разобран ли ADR на правила.\n\n### 7.4 Доли\n\n$$\\mathrm{AgentShare}_{ev}(g)=\\frac{|\\{e\\in E_g:\\mathrm{who}(e)\\in\\text{агенты}\\}|}{N_{ev}(g)},\\qquad \\mathrm{AgentShare}_{el}(g)=\\frac{|X(\\{e\\in E_g:\\mathrm{who}(e)\\in\\text{агенты}\\})|}{N_{el}(g)}$$\n\nЗнаменатель 0 — «нет данных».\n\n### 7.5 Дельта к прошлому периоду\n\n$$\\Delta f=f(P)-f(P^-),\\qquad \\Delta\\%f=\\frac{f(P)-f(P^-)}{f(P^-)}\\cdot100\\%\\ \\text{при } f(P^-)\\ge5$$\n\n$P^-$ до начала данных — «сравнить не с чем». **[ВЫБОР-4]** День сравнивается с тем же днём прошлой недели. Рекомендация: да.\n\n### 7.6 «С прошлого раза»\n\n$$N^{ev}_{new}=|\\{e:\\mathrm{at}(e)>r\\}|,\\qquad N^{el}_{new}=|X(\\{e:\\mathrm{at}(e)>r\\})|$$\n\n$r$ — черта пользователя `read_until_utc` на сервере.\n\n## 8. Черта «прочитано»\n\nНа сервере, общая для веба и телефона. Число считается при открытии и не тает. Сдвигается только действием. **[ВЫБОР-5]** Одна общая черта. Рекомендация: да.\n\n## 9. Окно, порядок, meta\n\n- По умолчанию 7 дней, архив — страницами.\n- Порядок: `at_utc` по убыванию.\n- **meta:** `generated_at`, `scope`, `period {from, to, tz}`, `total {events, elements}`, `multi_group_elements`, `truncated`, `errors[]`, `validation {ok, checks[], drift[]}`.\n\n## 10. Ревалидация\n\n### 10.1 Инварианты\n\n1. $N_{ev}\\ge N_{el}$ — в каждой группе и в итоге.\n2. $\\max_g N(g)\\le N^{\\Sigma}\\le\\sum_g N(g)$.\n3. $\\sum_g N_{el}(g)-N^{\\Sigma}_{el}=\\sum_x(|G(x)|-1)$.\n4. Задачи: $\\mathrm{Burn}=C-A=O(t_0)-O(t_1)$.\n5. ADR и решения: $\\mathrm{Flow}=Acc+Rej-New=Q(t_0)-Q(t_1)$.\n6. Разбивки по видам и по типам в сумме дают $N_{ev}$.\n7. Доли $\\in[0,1]$.\n8. Свёртка не меняет чисел.\n\n### 10.2 Сверка двух расчётов\n\n- $O(t)$ и $Q(t)$ на границах считаются **по снимку SCD2** и **по событиям** (начальное состояние плюс применение переходов). Должно совпасть.\n- Итоги по сырому и свёрнутому набору совпадают.\n\n### 10.3 При расхождении\n\n- `validation.ok=false`, в `drift[]` — проверка, разница, до 10 id.\n- UI у метрики пишет «числа не сошлись — проверка расхождения», основным остаётся расчёт по снимку.\n- Запись в журнал качества (QG) для разбора: дыры истории, легаси Hist без state_uid, правки задним числом.\n\n### 10.4 Контрактный тест (с положительным контролем)\n\nФикстура:\n- задача **A** общего спринта P1 и P2: закрыта → переоткрыта → закрыта;\n- задача **B** P1: заведена и закрыта внутри периода;\n- задача **C** P1: открыта, 3 правки;\n- серия агента: 12 закрытий;\n- **ADR-1**: proposed до периода, принят в периоде;\n- **ADR-2**: создан proposed в периоде;\n- **ADR-3**: действующий, заменён;\n- спека: две новые версии.\n\nОжидаемо:\n- Burn(A) = 1; B даёт $W=1$ и Burn 0;\n- C — 1 строка ×3;\n- $M=1$;\n- Flow = $Acc(1)+Rej(0)-New(1)=0$, совпадает с $Q(t_0)-Q(t_1)$;\n- $Sup=1$; у спеки $V_{ev}=2$, $V_{el}=1$;\n- инварианты 1–8 выполнены; снимок = события.\n\n**Положительный контроль:** удалена версия истории A или ADR-1 → `validation.ok=false`, элемент в `drift[]`.\n\nТот же снимок сверяют тесты веба и miniLORE.\n\n## 11. На подтверждение\n\n1. Правило «полный счёт в группе, объединение в итоге, ×N» (§2). Рекомендация: да.\n2. Сгорание — только задачи спринтов, по состоянию $O(t_0)-O(t_1)$ с разложением $C-A$, плюс «сделано внутри периода» и «переоткрыто» (§7.2). Рекомендация: да.\n3. **Метрики знаний** (§7.3): очередь на рассмотрении $\\mathrm{Flow}=Q(t_0)-Q(t_1)$, принято / отклонено / поступило, время до решения, заменено, пересмотры; у спек — версии и принято; у решений — «решений на ADR». Рекомендация: да.\n4. Ревалидация (§10). Рекомендация: да.\n5. [ВЫБОР-1] новые типы событий — да, вехи и вопросы свёрнуты.\n6. [ВЫБОР-2] день — местный.\n7. [ВЫБОР-3] окно свёртки — 30 минут.\n8. [ВЫБОР-4] дельта дня — к тому же дню прошлой недели.\n9. [ВЫБОР-5] черта «прочитано» — одна общая.\n\n## 12. Ревалидация знаний — не в новостях, в quality gates\n\nВладелица 07.11.2026: «ревалидация реально нужна, но это уже не в новостях, это к quality gates». Поэтому:\n- в новостях нет «свежести» и «протухших» спек и ADR: возраст не признак устаревания;\n- подтверждение, что спека, ADR или решение ещё в силе, — отдельная проверка quality gate (QG): кто и когда подтвердил, на каком основании, что изменилось в зависимых записях;\n- в ленту новостей попадает только **событие** такой проверки («ADR-X подтверждён ревалидацией», «ревалидация SPEC-Y не прошла»), как любое другое событие.\n\nВалидация самих чисел новостей (§10: инварианты и сверка «снимок ↔ события») остаётся здесь — это проверка правильности ленты, а не знаний.\n";
// 1) вынуть формулы до marked, чтобы он не портил \ и _
const store = [];
let src = MD.replace(/\$\$([\s\S]+?)\$\$/g, (m, f) => { store.push({f, d:true}); return '@@MATH' + (store.length-1) + '@@'; });
src = src.replace(/(^|[^\\$])\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)/g, (m, pre, f) => { store.push({f, d:false}); return pre + '@@MATH' + (store.length-1) + '@@'; });
// 2) mermaid-фенсы → div
src = src.replace(/```mermaid\n([\s\S]*?)```/g, (m, g) => '<div class="mermaid">' + g.replace(/</g,'&lt;') + '</div>');
let out = marked.parse(src);
// 3) вернуть формулы
out = out.replace(/@@MATH(\d+)@@/g, (m, i) => {
  const {f, d} = store[+i];
  try { return katex.renderToString(f, {displayMode: d, throwOnError: true}); }
  catch (e) { return '<span class="math-err">' + f.replace(/</g,'&lt;') + '\n⚠ ' + e.message.replace(/</g,'&lt;') + '</span>'; }
});
