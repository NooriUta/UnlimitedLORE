# Russian translations for KC's email body/subject keys. The base "keycloak"
# theme ships messages_ru.properties for LOGIN (that's why the login UI is
# already in Russian) but NOT for email — base/email only has messages_en
# upstream (checked against the keycloak/keycloak repo, 26.0.0 tag). Without
# this file, every email would render in English regardless of the realm's
# locale settings. Covers the three message types that actually matter today
# (password reset, email verification, admin-triggered account update) —
# the long tail of less common types (OTP, identity-provider link, org
# invites, security-event notifications) still falls back to English.
#
# linkExpirationFormatter.timePeriodUnit.* uses ChoiceFormat, which can't
# express true Russian plural rules (genitive plural etc.) — approximated
# with the closest 4-way split ChoiceFormat supports: 0 / 1 / 2-4 / 5+.
passwordResetSubject=Сброс пароля
passwordResetBody=Кто-то запросил смену учётных данных для вашей учётной записи {2}. Если это были вы, перейдите по ссылке ниже, чтобы сбросить пароль.\n\n{0}\n\nСсылка и код действительны в течение {3}.\n\nЕсли вы не хотите сбрасывать пароль, просто проигнорируйте это сообщение — ничего не изменится.
passwordResetBodyHtml=<p>Кто-то запросил смену учётных данных для вашей учётной записи {2}. Если это были вы, перейдите по ссылке ниже, чтобы сбросить пароль.</p><p><a href="{0}">Ссылка для сброса пароля</a></p><p>Ссылка действительна в течение {3}.</p><p>Если вы не хотите сбрасывать пароль, просто проигнорируйте это сообщение — ничего не изменится.</p>
emailVerificationSubject=Подтверждение почты
emailVerificationBody=Кто-то создал учётную запись {2} с этим адресом электронной почты. Если это были вы, перейдите по ссылке ниже, чтобы подтвердить адрес\n\n{0}\n\nСсылка действительна в течение {3}.\n\nЕсли вы не создавали эту учётную запись, просто проигнорируйте это сообщение.
emailVerificationBodyHtml=<p>Кто-то создал учётную запись {2} с этим адресом электронной почты. Если это были вы, перейдите по ссылке ниже, чтобы подтвердить адрес</p><p><a href="{0}">Ссылка для подтверждения адреса электронной почты</a></p><p>Ссылка действительна в течение {3}.</p><p>Если вы не создавали эту учётную запись, просто проигнорируйте это сообщение.</p>
executeActionsSubject=Обновление вашей учётной записи
executeActionsBody=Администратор запросил обновление вашей учётной записи {2} с выполнением следующих действий\: {3}. Перейдите по ссылке ниже, чтобы начать.\n\n{0}\n\nСсылка действительна в течение {4}.\n\nЕсли вы не в курсе этого запроса от администратора, просто проигнорируйте это сообщение — ничего не изменится.
executeActionsBodyHtml=<p>Администратор запросил обновление вашей учётной записи {2} с выполнением следующих действий: {3}. Перейдите по ссылке ниже, чтобы начать.</p><p><a href="{0}">Ссылка для обновления учётной записи</a></p><p>Ссылка действительна в течение {4}.</p><p>Если вы не в курсе этого запроса от администратора, просто проигнорируйте это сообщение — ничего не изменится.</p>
