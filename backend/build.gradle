plugins {
    id 'java'
    id 'io.quarkus' version "${quarkusPlatformVersion}"
}

group   = 'studio.seer.lore'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories { mavenCentral() }

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")

    // REST + JSON
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'

    // REST Client — ArcadeDB (mart-api :2480) for both LORE and BENCH
    implementation 'io.quarkus:quarkus-rest-client'
    implementation 'io.quarkus:quarkus-rest-client-jackson'

    // CDI
    implementation 'io.quarkus:quarkus-arc'

    // Bean Validation — @Valid on REST endpoints
    implementation 'io.quarkus:quarkus-hibernate-validator'

    // Health — /q/health
    implementation 'io.quarkus:quarkus-smallrye-health'

    // OIDC — validate Keycloak (omilore realm) JWTs (A2). Disabled by default
    // (quarkus.oidc.enabled=false) so dev runs without KC; enable in prod/staging.
    implementation 'io.quarkus:quarkus-oidc'

    // Metrics — /q/metrics (Prometheus scrape format)
    implementation 'io.quarkus:quarkus-micrometer-registry-prometheus'

    // Structured JSON logs (enabled in prod only — see application.properties)
    implementation 'io.quarkus:quarkus-logging-json'

    // S3-compatible object storage (MinIO) — BRAGI asset uploads.
    // AWS SDK v2, plain library (no dedicated Quarkus extension needed for
    // this use case) — pins its own BOM since it isn't part of the Quarkus platform.
    implementation enforcedPlatform('software.amazon.awssdk:bom:2.48.2')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'

    // AL-90: эмуляция JWT-клеймов (agent_scope/client_id) в REST-round-trip
    // тестах через @TestSecurity + @Claim — без него SecurityIdentity в
    // тестовом профиле не несёт JWT вовсе, и agent-scope-зависимые пути
    // (AgentScopeFilter, callerAgentScope/callerClientId) нельзя было
    // проверить иначе как прямым вызовом Java-метода.
    testImplementation 'io.quarkus:quarkus-test-security-jwt'

    // C5 (SPRINT_LORE_PROD_HARDENING): real ArcadeDB in a throwaway container
    // for SCD2-transition and A1-rollback tests — not part of the Quarkus
    // platform BOM, so pinned directly.
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
}

compileJava.options.encoding     = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

// Упавший в CI тест, чьё сообщение нельзя прочитать, бесполезен: по умолчанию
// Gradle печатает только тип исключения и строку — «AssertionError at
// FooTest.java:83». Всё, ради чего сообщение писалось (что ожидали, что
// пришло, какая из форм запроса сработала), остаётся в html-отчёте внутри
// раннера, куда с этой машины хода нет.
//
// Поймано на пробе форм обхода ребра: тест задавал базе семь вопросов и
// падал с таблицей ответов, а в логе оказалась одна строка без единого
// ответа — то есть прогон состоялся, а узнать было нечего.
tasks.named('test') {
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces = true
    }
}

// Описания подагентов — ВХОДНЫЕ ДАННЫЕ тестов, а не посторонние файлы.
//
// Сторож AgentDefinitionsMatchMatrixTest сверяет белые списки в
// .claude/agents с матрицей прав. Но Gradle об этих файлах не знает, и правка
// одного лишь .md оставляла задачу «актуальной»: тест не перезапускался и
// оставался зелёным из кэша — то есть спал ровно в тот момент, ради которого
// написан. Поймано положительным контролем: подмешанный в белый список
// чужой инструмент прошёл незамеченным, пока прогон не заставили повториться.
tasks.named('test') {
    inputs.dir(layout.projectDirectory.dir('../.claude/agents'))
        .withPropertyName('agentDefinitions')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .optional(true)
}
// Сводка отказов В САМОМ КОНЦЕ прогона — иначе её не найти.
//
// Сообщения упавших тестов мы печатаем с 31.08 (до того в логе был виден
// только тип исключения). Но печатаются они В МЕСТЕ отказа, а лог CI забит
// служебными строками: каждый подъём приложения в тестах добавляет свои, и
// при десятках тест-классов сообщение оказывается за тысячи строк от конца.
//
// 10.09 это стоило разбора вслепую: причину красного прогона пришлось
// выводить из кода, а не из вывода. Инструмент диагностики, результат
// которого нельзя прочитать, диагностикой не является.
def loreFailures = []
tasks.named('test') {
    afterTest { desc, result ->
        if (result.resultType == TestResult.ResultType.FAILURE) {
            def why = result.exceptions ? result.exceptions[0].toString().readLines()[0] : 'без сообщения'
            loreFailures << "${desc.className.tokenize('.').last()}.${desc.name}\n      ${why}"
        }
    }
    // afterSuite, а НЕ doLast: doLast пропускается, когда задача падает — то
    // есть сводка печаталась бы ровно тогда, когда она не нужна, и молчала бы
    // на каждом красном прогоне. Поймано положительным контролем: подмешанный
    // падающий тест не дал ни строки сводки.
    afterSuite { desc, result ->
        if (desc.parent == null && !loreFailures.isEmpty()) {
            logger.lifecycle("\n==== УПАВШИЕ ТЕСТЫ (${loreFailures.size()}) ====")
            loreFailures.each { logger.lifecycle("  • ${it}") }
            logger.lifecycle("==== конец списка ====\n")
        }
    }
}

// SE-10: отметка сборки — из какого коммита собран бэкенд.
//
// MCP-сервер сессий собирается из основного чекаута руками и живёт своей
// жизнью: 10.09.2026 он оказался на 281 коммит позади develop, и правки схем
// инструментов до агентов не доходили. Чтобы расхождение стало ВИДНЫМ, обе
// стороны обязаны знать свою сборку; эта задача — половина бэкенда.
//
// Коммит берётся из LORE_BUILD_COMMIT (CD передаёт github.sha аргументом
// сборки образа: .git в контекст образа не попадает), иначе спрашивается у
// git (локальная сборка), иначе «unknown» — честное значение, а не пустота:
// пустое поле неотличимо от «ручки нет».
//
// upToDateWhen { false }: время сборки меняется всегда, кэшировать нечего.
def buildInfoDir = layout.buildDirectory.dir('generated-resources/build-info')
def buildInfoRepoDir = projectDir
tasks.register('generateBuildInfo') {
    def outFile = buildInfoDir.map { it.file('build-info.properties') }
    outputs.file(outFile)
    outputs.upToDateWhen { false }
    doLast {
        String commit = (System.getenv('LORE_BUILD_COMMIT') ?: '').trim()
        if (commit.isEmpty()) {
            try {
                def proc = ['git', 'rev-parse', '--short=12', 'HEAD'].execute(null, buildInfoRepoDir)
                proc.waitForOrKill(5000)
                if (proc.exitValue() == 0) commit = proc.text.trim()
            } catch (Exception ignored) { }
        }
        if (commit.isEmpty()) commit = 'unknown'
        def f = outFile.get().asFile
        f.parentFile.mkdirs()
        f.text = "commit=${commit}\nbuilt_at=${java.time.Instant.now()}\n"
    }
}
sourceSets.main.resources.srcDir(buildInfoDir)
tasks.named('processResources') { dependsOn('generateBuildInfo') }
