name: LORE CD (preprod on ci-server)

# ── PL-04 (08.11.2026): это ПРЕПРОД, а не прод ──────────────────────────────
# SPRINT_LORE_PIPELINE_HOST/PL-04, ADR-LORE-046, D-2026-UXR-CD-PREPROD-PROD-SPLIT.
# Прод LORE с 07.11 живёт на lore-host (lore.odal → :4400, new.lore → :4402) и
# выкатывается ТОЛЬКО релизом по тегу (lore-release.yml, PL-05). Этот workflow
# катит на ci-server препрод:
#   • compose-проект lore-preprod, оверлей docker-compose.preprod.yml (свои порты
#     4410/4412/9110/19000/19001 через !override; :4400 на 131 — пересыльщик
#     прод-MCP, :9100/:9000 — заняты);
#   • имена preprod.lore.odal / preprod.new.lore.odal (CoreDNS 131 → .131,
#     сертификат — резолвер regru);
#   • база system_aida_lore_preprod (снимок прода, заливает preprod-db-refresh) и
#     окружение Infisical preprod — без отката на prod;
#   • образы unlimitedlore-<сервис>:<sha8> с меткой revision — их и везёт релиз;
#   • темы Keycloak здесь больше нет: KC живёт на lore-host, тема едет релизом.
# Вход — тот же KC-клиент lore-app (D-2026-LORE-PREPROD-NO-EXTRA-KC-CLIENT).
# Ниже — история стенда; упоминания «стенда :4400» относятся ко времени до PL-04.

# Continuous deployment to the docker-compose stand on ci-server (lore-backend
# :9100 / lore-app :4400). До 2026-07-18 это был стенд на ноуте разработчика —
# отсюда «local» в прежнем названии и упоминания Docker Desktop ниже. После
# переезда БД, Keycloak, Forgejo и самого стенда на ci-server workflow не
# пережил смену топологии сразу по трём причинам, и все три чинятся тут:
# windows-пути томов (валидны на ноуте, отвергаются Linux-демоном), пустые
# секреты мостов и имя compose-проекта, выведенное из каталога раннера.
# Deliberately
# NOT modeled on aida-root's cd.yml (tag-triggered, SSH-to-remote-host, backup/
# rollback, Telegram) — there is no remote staging/prod target here, just this
# machine's Docker Desktop. Borrowed from that pattern: workflow_dispatch for an
# on-demand run, a concurrency group so two deploys never race, and a real
# post-deploy health check instead of trusting `docker compose up` succeeding.
#
# Runs via the Forgejo act_runner registered on THIS host (label "lore-only",
# see the job's runs-on comment — AL-88, 2026-07-30: dedicated runner, was
# "ubuntu-latest" against the shared pool before) — a github-hosted runner has
# no access to this machine's Docker Desktop / compose stack at all, so this
# only makes sense here.

# ── Место в цепочке: develop → preprod → main ────────────────────────────────
# Деплоит ТОЛЬКО ветка `preprod`, а не `develop`. Раньше стенд обновлялся с
# каждого пуша в develop — то есть с каждой смерженной фичи, поштучно и сразу.
# Теперь develop остаётся местом сборки фич, а выкатка на стенд — отдельное
# осознанное действие: набрали несколько фич → влили develop в preprod →
# стенд обновился → тестируем связку целиком → только потом релиз в main с тегом.
#
# Зачем разделение: до него «оттестировать несколько фич вместе» было негде —
# стенд всегда показывал последний коммит develop, и проверка одной фичи могла
# уехать под другую прямо во время проверки.
on:
  push:
    branches: ["preprod"]
  workflow_dispatch:
    inputs:
      service:
        # both — всё: бэкенд и оба фронта (имя историческое, со времён одного
        # фронта; не переименовано, чтобы не ломать сохранённые запуски).
        # frontend — v1 (lore-app), frontend-next — v2 (lore-app-next, S3-06).
        # S3-10: v1 заморожен — both теперь = бэкенд + v2, без v1; v1
        # пересобирается ТОЛЬКО выбором frontend (хотфикс). Пуш в preprod
        # выкатывает по изменённым путям (ci-scope.sh cd).
        description: 'Service to redeploy'
        required: false
        default: 'both'
        type: choice
        options: [both, backend, frontend, frontend-next]
      dry_run:
        # PL-04: true — только ворота и разбор (что было бы собрано, какие
        # порты/имена/база), без сборок, выкаток, пометок образов и Telegram.
        # Безопасно запускать с любой ветки.
        description: 'true — только проверки, ничего не менять'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: lore-cd-preprod   # PL-04: одна цель — препрод; прогоны с разных веток не гонятся друг с другом
  cancel-in-progress: false   # never cancel a deploy in flight — queue instead

permissions:
  contents: read

jobs:
  deploy:
    name: Build + deploy preprod (ci-server, lore-preprod)
    # AL-88 (2026-07-30): tried a dedicated runner (label "lore-only",
    # registered on ci-server, forgejo-runner-lore container) instead of the
    # shared pool, to stop queueing behind Shuttle/Hound/aida-root jobs — but
    # every job on it fails right after "Point live-DB tests…" with exitcode 1
    # despite `set -x` tracing showing every script command succeed, including
    # the $GITHUB_ENV write. Cause not found after three attempts (identical
    # config.yml, identical image digest, identical resource limits, named
    # volume vs bind mount — neither fixed it). Reverted to "ubuntu-latest"
    # (matches the shared pool — its three runners carry no labels of their
    # own) until this is root-caused; forgejo-runner-lore/volva_only stay
    # registered on ci-server but unwired. NOT "self-hosted" — that label
    # doesn't exist here and the job would queue forever. github-hosted runners
    # can't reach this host's Docker Desktop at all, so this workflow only
    # makes sense running here regardless of the label name.
    runs-on: ubuntu-latest
    # This job's checkout has no .env (gitignored — it holds the ArcadeDB root
    # password). docker-compose.yml reads ARCADEDB_ROOT_PASSWORD from the shell
    # environment (which wins over any .env), so pass it here from a repo
    # secret. Found the hard way on 2026-07-13: without this, compose silently
    # falls back to the literal placeholder "unset", the backend authenticates
    # to ArcadeDB (:2480) as root/unset, and every query 403s — while the
    # container itself stays "healthy" the whole time, so this workflow's own
    # health check didn't catch it.
    env:
      ARCADEDB_ROOT_PASSWORD: ${{ secrets.ARCADEDB_ROOT_PASSWORD }}
      # Секреты мостов НЕ передаются сюда по одному — вместо них учётка
      # Infisical, а KC_ADMIN_CLIENT_SECRET/FORGEJO_API_TOKEN бэкенд забирает
      # оттуда сам (SecretProvider, D15). Так в Forgejo лежит бутстрап, а не
      # живые секреты, и ротация делается в одном месте.
      #
      # Почему это вообще понадобилось: у job'а нет .env (gitignored), поэтому
      # без явной передачи деплой поднимал бы бэкенд с ПУСТЫМИ секретами — оба
      # моста молча уходили бы в 503 «not configured» при зелёном деплое.
      LORE_SECRETS_PROVIDER: infisical
      # SPRINT_VIZ_EMBED/VE-2: адрес Völva для подписи встройки (ключ — из Infisical, LORE_VOLVA_EMBED_SECRET).
      LORE_VOLVA_EMBED_SITE_URL: https://volva.odal.seidrstudio.pro
      LORE_SECRETS_URL: http://infisical:18080
      LORE_SECRETS_CLIENT_ID: ${{ secrets.LORE_SECRETS_CLIENT_ID }}
      LORE_SECRETS_CLIENT_SECRET: ${{ secrets.LORE_SECRETS_CLIENT_SECRET }}
      LORE_SECRETS_PROJECT_ID: ${{ secrets.LORE_SECRETS_PROJECT_ID }}
      # PL-04: своё окружение препрода. Пустое/несуществующее — шаг ворот
      # (preprod-gates.sh) красный, отката на prod НЕТ.
      LORE_SECRETS_ENVIRONMENT: preprod
      LORE_SECRETS_SCOPE: /
      # PL-04: база препрода — снимок прода на LORE-ygg 131 (preprod-db-refresh).
      # В compose приходит свойством lore.db (оверлей docker-compose.preprod.yml).
      LORE_DB: system_aida_lore_preprod
      # Пароль служебной учётки MinIO для соседей (ADR-INFRA-SHARED-COMPONENTS).
      # Передаётся по той же причине, что и ARCADEDB_ROOT_PASSWORD: .env здесь
      # нет, а compose читает окружение. Без этой строки секрет в Forgejo будет
      # ЛЕЖАТЬ, но до minio-init не доедет — тот создаст корзину и политику,
      # учётку не создаст и честно скажет об этом в логе. Деплой при этом
      # зелёный, а сосед отвечает 503: расхождение видно только у соседа.
      # Пустое значение — законное состояние, а не поломка.
      MINILORE_S3_PASSWORD: ${{ secrets.MINILORE_S3_PASSWORD }}
      # Стенд переехал на ci-server: ArcadeDB, Keycloak, Forgejo и Infisical
      # живут на ТОМ ЖЕ хосте, поэтому host-gateway (дефолт compose) верен для
      # всех четырёх и переопределять их здесь не нужно.
      #
      # Имя compose-проекта прибито ЯВНО. Иначе оно выводится из каталога
      # checkout'а раннера, и деплой создал бы ВТОРОЙ параллельный стенд: он
      # либо упёрся бы в занятый порт 4400, либо развёл два набора контейнеров
      # и named-volume minio.
      # PL-04: препрод — ОТДЕЛЬНЫЙ проект `lore-preprod`. Прежний `unlimitedlore`
      # на 131 — остатки старого стенда (MinIO, v2 на :4402), их CD не трогает.
      COMPOSE_PROJECT_NAME: lore-preprod
      # PL-04: свой тег заморозки v1 у препрода (v1-freeze.sh) — общий
      # lore-app:v1-frozen принадлежал старому стенду (проект unlimitedlore).
      FROZEN_TAG: unlimitedlore-lore-app:v1-frozen-preprod
      # ── Аутентификация (RUNBOOK-AUTH-OMILORE) ────────────────────────────
      # ВСЕ пять флипаются вместе. Включённый фронт при выключенном бэкенде шлёт
      # токен, который никто не проверяет; обратное — бэкенд требует токен,
      # которого фронт не присылает.
      #
      # Обе стороны BUILD-TIME, и по разным причинам: Vite впекает import.meta.env
      # в бандл, а quarkus.oidc.enabled фиксируется на сборке. Поэтому значения
      # уходят в build-args (см. compose), а не только в окружение контейнера —
      # иначе флаг «не срабатывает» без единой ошибки в логах.
      #
      # Issuer — ПУБЛИЧНЫЙ адрес KC: на него редиректит браузер, и по нему же
      # бэкенд забирает JWKS (проверено из контейнера: 200).
      LORE_AUTH_ENABLED: "true"
      LORE_OIDC_ISSUER: https://odal.seidrstudio.pro/kc/realms/omilore
      # SE-10: коммит выкатки — бэкенд отдаёт его в /lore/version, MCP сверяет со своим.
      LORE_BUILD_COMMIT: ${{ github.sha }}
      VITE_LORE_AUTH_ENABLED: "true"
      VITE_OIDC_ISSUER: https://odal.seidrstudio.pro/kc/realms/omilore
      VITE_OIDC_CLIENT_ID: lore-app
      # ── Адреса ЭТОЙ установки ────────────────────────────────────────────
      # Оба значения раньше были вшиты литералами в nginx.conf и потому ехали
      # в образе: посторонняя установка, открытая по IP, получала 301 на ЧУЖОЙ
      # стенд, а её собственный Keycloak был вне CSP. Теперь адрес установки
      # задаётся здесь — то есть в конфигурации КОНКРЕТНОГО стенда, где ему и
      # место, а образ остаётся нейтральным.
      # CORS: СЕРВИРУЮЩИЕ адреса именно этого стенда. Раньше они были дефолтом в
      # application.properties и ехали внутри образа — чужая установка получала
      # список чужих доменов и своего в нём не находила. Отказ при этом
      # невнятный: запись 403 на CORS-слое, чтение работает (браузер не шлёт
      # Origin на GET), и выглядит это как «UI открывается, кнопки не работают».
      #
      # Список ПОЛНЫЙ, а не дополняющий: переменная перекрывает дефолт целиком,
      # поэтому localhost-адреса перечислены здесь заново — иначе отвалилась бы
      # запись при обращении к стенду с самого хоста. Порт обязателен: Quarkus
      # сравнивает Origin буквально.
      # PL-04: адреса ПРЕПРОДА — имена preprod.* и опубликованные порты 4410/4412.
      CORS_ORIGINS: http://localhost:4410,http://127.0.0.1:4410,http://192.168.3.131:4410,http://localhost:4412,http://127.0.0.1:4412,http://192.168.3.131:4412,https://preprod.lore.odal.seidrstudio.pro,https://preprod.new.lore.odal.seidrstudio.pro
      LORE_PUBLIC_URL: https://preprod.lore.odal.seidrstudio.pro
      # У v2 свой канонический адрес (оверлей подставляет его lore-app-next).
      LORE_PUBLIC_URL_V2: https://preprod.new.lore.odal.seidrstudio.pro
      LORE_OIDC_ORIGIN: https://odal.seidrstudio.pro
      # SPRINT_VIZ_EMBED/EMB-L1: origin Völva для встроенных графиков (frame-src CSP).
      # Назван самой Völva 06.11: site-url стенда, резолв в 192.168.3.131, /api/health 200.
      LORE_VOLVA_ORIGIN: https://volva.odal.seidrstudio.pro
      # ── HTTPS на LAN ─────────────────────────────────────────────────────
      # Оверлей подключается ТОЛЬКО здесь, а не в основном compose: сеть
      # `headscale-net` существует лишь на ci-server, и объявление её в
      # docker-compose.yml сломало бы `docker compose up` где угодно ещё —
      # сети нет, стенд не поднимается.
      #
      # HTTPS тут не про «выставить наружу»: вход по OIDC физически невозможен
      # на http://192.168.3.131:4400, потому что `crypto.subtle` (нужен
      # oidc-client-ts для PKCE) существует только в защищённом контексте.
      # На ноуте адрес был localhost — единственное исключение спецификации, и
      # переезд молча отобрал криптографию вместе со сменой адреса.
      # Оверлей ОБЯЗАТЕЛЕН, пока auth включён: без него стенд отдаётся только по
      # :4400, а на этом адресе вход невозможен в принципе — нет защищённого
      # контекста. Отключение оверлея равносильно «UI недоступен с любой машины,
      # кроме самого сервера», и это не очевидно из самого факта отключения.
      #
      # Проверялось вечером 19.07: с выключенным оверлеем стенд отвечал 200 по
      # :4400 и выглядел рабочим, но получить сессию было неоткуда.
      #
      # PL-04: вместо оверлея прода (Host lore.odal) — оверлей ПРЕПРОДА: свои
      # порты через !override, метки Traefik на preprod.*, образы :sha8, lore.db.
      COMPOSE_FILE: docker-compose.yml:docker-compose.preprod.yml
      # ── Зеркало Nexus для Gradle внутри сборки образа ─────────────────────
      # Адрес именно LAN-ый, а не host.docker.internal: на Linux-демоне это имя
      # само не резолвится, и build-arg указывал бы в пустоту — ровно та
      # ошибка, что уже стоила отказа с прокси.
      #
      # ⚠️ Публичные репозиториии в списке вторыми — это НЕ полноценный запас,
      # и рассчитывать на него нельзя. Проверено отказом 2026-07-19: запас
      # работает только на этапе МЕТАДАННЫХ. Gradle запоминает, откуда пришёл
      # .pom, и за .jar идёт туда же:
      #
      #   Could not find jandex-3.5.3.jar
      #     Searched in the following locations:
      #         http://192.168.3.131:8081/repository/maven-central-proxy/...
      #
      # Публичных репозиториев в списке поиска нет вовсе. То есть если зеркало
      # отдало pom и не отдало jar — сборка падает, сколько запасных ни пропиши.
      #
      # Поэтому защита здесь другая: скрипт use-nexus.sh перед переключением
      # проверяет, что зеркало реально отдаёт .jar, а не просто отвечает.
      LORE_MAVEN_MIRROR: http://192.168.3.131:8081/repository/maven-central-proxy/
      LORE_PLUGIN_MIRROR: http://192.168.3.131:8081/repository/gradle-plugins-proxy/
      # PL-12: дистрибутив Gradle — raw-proxy на services.gradle.org/distributions.
      # Не отвечает (репозиторий не заведён, Nexus лежит) — compose-build-retry.sh
      # снимает его до сборки, и обёртка качает напрямую, как раньше.
      LORE_GRADLE_DIST_MIRROR: http://192.168.3.131:8081/repository/gradle-dist-proxy/
    steps:
      - uses: actions/checkout@v7
        with:
          # S3-10: выбор сервисов по путям — ci-scope.sh сравнивает
          # event.before...HEAD, нужна история. Репозиторий ~10 МБ.
          fetch-depth: 0

      # PL-04: режим прогона и тег образов. live=false — dry-run (ручной запуск
      # с dry_run=true): каждый меняющий шаг ниже стоит под
      # steps.mode.outputs.live == 'true'. Тег образов — первые 8 знаков коммита:
      # по нему релиз (PL-05) найдёт на 131 то, что прошло препрод.
      - name: Режим прогона (live / dry-run) и тег образов :sha8
        id: mode
        env:
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY" = "true" ]; then live=false; else live=true; fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
          # Два тега: рабочий preprod-<sha8> (им compose собирает и поднимает) и
          # релизный <sha8> — его ставит шаг «Пометить образы» ПОСЛЕ всех проб,
          # поэтому образ, не прошедший пробы, релизу не достанется.
          echo "LORE_IMAGE_TAG=preprod-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "LORE_SHA8=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "режим: live=$live, тег образов: preprod-${GITHUB_SHA::8} → после проб ${GITHUB_SHA::8}, ref: ${GITHUB_REF_NAME}"
          [ "$live" = true ] || echo "::notice::DRY-RUN: только проверки — без сборок, выкаток, пометок образов и оповещений"

      - name: Verify required secrets are configured
        run: |
          # Учётка Infisical проверяется ЗДЕСЬ, а не «по факту работы»: без неё
          # деплой проходит зелёным, а /lore/kc/* и /lore/forgejo/* отвечают
          # 503. Это ровно тот класс отказов, который уже прятался за успешным
          # деплоем (см. историю с ARCADEDB_ROOT_PASSWORD ниже) — падаем сразу.
          missing=""
          for v in LORE_SECRETS_CLIENT_ID LORE_SECRETS_CLIENT_SECRET LORE_SECRETS_PROJECT_ID; do
            eval "val=\${$v:-}"
            [ -z "$val" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::не заданы секреты:$missing. Добавьте в Forgejo: Settings -> Actions -> Secrets. Это machine identity Infisical (org -> Access Control -> Identities -> Universal Auth), из неё бэкенд берёт KC_ADMIN_CLIENT_SECRET и FORGEJO_API_TOKEN."
            exit 1
          fi
          if [ -z "${ARCADEDB_ROOT_PASSWORD}" ]; then
            echo "::error::secrets.ARCADEDB_ROOT_PASSWORD is not set on this repo — deploy would silently break the backend's ArcadeDB auth (see comment above). Add it in Forgejo: Settings -> Actions -> Secrets."
            exit 1
          fi

      # PL-04: ворота препрода ДО любых сборок — база/окружение/проект не прод,
      # оверлей собирается и не занимает прод-порты, база препрода есть на
      # LORE-ygg 131, окружение preprod в Infisical не пустое (без отката на prod).
      # В dry-run печатает все отказы и не роняет шаг. Логика — в скрипте.
      - name: Ворота препрода (база, Infisical preprod, порты) — громко, без отката на prod
        id: gates
        env:
          DRY_RUN: ${{ steps.mode.outputs.live == 'true' && 'false' || 'true' }}
          # Нет базы препрода — не отказ, а сигнал db_missing: её создаст шаг ниже.
          PREPROD_DB_AUTOCREATE: "true"
        run: bash .github/scripts/preprod-gates.sh

      # PL-04 (решение владелицы 08.11): базы препрода нет — создаём её из СНИМКА
      # ПРОДА, а не пустой. Только эту базу (TARGET_DB=LORE_DB, имя *_preprod
      # проверяет скрипт); другие базы LORE-ygg 131 (midgard_datahub, *_frozen_*,
      # минилор) не трогаются. CREATE_ONLY=true: существующую базу CD не
      # перезаливает никогда — обновление снимка только ручным workflow
      # «LORE preprod DB refresh». В dry-run — только проверки доступа (ssh до
      # lore-host, бэкенд прода, место на 131), без снимка.
      - name: SSH до lore-host — для снимка прода (только если базы препрода нет)
        if: steps.gates.outputs.db_missing == 'true'
        env:
          LORE_HOST: lore-host.seidrstudio.pro
          LORE_HOST_USER: nooriuta
          LORE_HOST_FP: SHA256:dp7oLAGQkIQ+fcFOuwqhnqoLOB0VkWom2ibmuzDG6YA
          LORE_HOST_SSH_KEY: ${{ secrets.LORE_HOST_SSH_KEY }}
        run: bash .github/scripts/lore-host-deploy.sh ssh

      - name: База препрода — создать из снимка прода, если её нет
        if: steps.gates.outputs.db_missing == 'true'
        env:
          TARGET_DB: ${{ env.LORE_DB }}
          CREATE_ONLY: "true"
          DRY_RUN: ${{ steps.mode.outputs.live == 'true' && 'false' || 'true' }}
        run: bash scripts/preprod-db-refresh.sh

      - name: Убрать ключ lore-host
        if: always()
        run: rm -f ~/.ssh/lore_host

      # SPRINT_UXR_S3_V2_INFRA/S3-10 (D-2026-UXR-V2-FOLDER-V1-FROZEN): выкатка
      # по путям и заморозка v1. Логика в ci-scope.sh (режим cd):
      #   * пуш в preprod — по диффу: web-next/ → только v2; backend/, shared/,
      #     compose, CI → бэкенд + v2; только документация/MCP → бэкенд не
      #     трогается. v1 (lore-app) по пушу НЕ выкатывается никогда — правка
      #     src/ печатает ::warning:: с подсказкой про ручной хотфикс;
      #   * ручной запуск: both = бэкенд + v2 (v1 сюда больше НЕ входит),
      #     frontend = хотфикс v1, backend / frontend-next — по одному.
      # Дифф не вычислился — выкатываются бэкенд и v2 (как прежний «both»).
      - name: Resolve which services to touch
        id: which
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVICE: ${{ github.event.inputs.service || '' }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/ci-scope.sh cd

      # S3-10: образ v1 закрепляется ДО любых сборок: запоминаем, на каком образе
      # работает lore-app, и ставим тег lore-app:v1-frozen (если его ещё нет).
      # После выкатки шаг «v1 не тронут» сверяет, что образ тот же.
      - name: Pin LORE v1 image (lore-app frozen)
        if: steps.mode.outputs.live == 'true'
        run: bash .github/scripts/v1-freeze.sh pin

      # Диагностика доставки флага (AL-53) — почему auth не включается, хотя
      # флаги стоят в env выше. Логика в скрипте, а не здесь: bash внутри `run:`
      # дважды ломал разбор workflow парсером Forgejo (см. resolve-proxy.sh).
      - name: Что compose реально подставит в build-args
        run: bash .github/scripts/build-args-probe.sh

      - name: Build backend image
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.backend == 'true'
        run: bash .github/scripts/compose-build-retry.sh lore-backend

      - name: Build frontend image
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend == 'true'
        run: bash .github/scripts/compose-build-retry.sh lore-app

      # SPRINT_UXR_S3_V2_INFRA/S3-06 (ADR-LORE-045): второй образ — LORE v2 из
      # web-next/ (сервис lore-app-next). Отдельным шагом, а не вторым именем в
      # той же команде: упавший v2 должен быть виден как упавший v2.
      - name: Build frontend image (v2, lore-app-next)
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend_next == 'true'
        run: bash .github/scripts/compose-build-retry.sh lore-app-next

      # DBR-06: накатка схемы — отдельный ВИДИМЫЙ шаг, а не побочный эффект
      # старта. Тот же образ, root-кред (LORE_MART_AUTH=basic), процесс
      # накатывает и выходит (lore.migrate.only). Упавший шаг — ненулевой код,
      # деплой останавливается ДО подмены работающего контейнера. Рантайм ниже
      # стартует без накатки (lore.migrate=false) и сверяет версию схемы.
      - name: Migrate schema (separate step, root)
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.backend == 'true'
        env:
          LORE_MIGRATE: "true"
          LORE_MIGRATE_ONLY: "true"
          LORE_MART_AUTH: basic
        run: |
          rc=0
          timeout 1800 docker compose run --rm --no-deps -T lore-backend > /tmp/migrate.log 2>&1 || rc=$?
          grep -E "LORE MIGRATE|LORE MART|ERROR|Exception" /tmp/migrate.log | tail -80 || true
          if [ "$rc" != "0" ]; then
            echo "::error::накатка схемы упала (код $rc) — работающий бэкенд НЕ подменён. Хвост лога:"
            tail -60 /tmp/migrate.log
            exit 1
          fi
          grep -q "lore.migrate.only=true — схема накатана" /tmp/migrate.log \
            || { echo "::error::процесс вышел с 0, но строки о завершённой накатке нет — накатка не подтверждена"; tail -60 /tmp/migrate.log; exit 1; }
          echo "накатка подтверждена"

      # PL-04: у препрода свой MinIO (порты 19000/19001, том lore-preprod_*).
      # Бэкенд поднимается с --no-deps, поэтому MinIO сам не стартует — без этого
      # шага первая выкатка препрода дала бы бэкенд без хранилища (S3 → 503).
      # Идемпотентно: работающий MinIO не пересоздаётся, minio-init — разовый.
      - name: MinIO препрода (свой, идемпотентно)
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.backend == 'true'
        run: docker compose up -d minio minio-init

      - name: Deploy backend
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.backend == 'true'
        env:
          # Препрод ходит в ArcadeDB 131 под root (basic) — решение владелицы
          # 08.11.2026. Токен lore-backend на 131 выдан только на system_aida_lore:
          # на базу препрода он давал 403 при старте, бэкенд уходил в рестарт-цикл.
          # Прежняя переменная репозитория vars.LORE_MART_AUTH (DBR-01, стенд
          # прода на 131) препрод больше не переключает: прод живёт на lore-host
          # со своим входом. Свой токен на базу препрода — позже, если понадобится.
          LORE_MART_AUTH: basic
          # AL-91: проектный скоуп чтения — переменная репозитория, по умолчанию выключен.
          LORE_SCOPE_ENFORCE: ${{ vars.LORE_SCOPE_ENFORCE || 'false' }}
        run: docker compose up -d --no-deps lore-backend

      - name: Deploy frontend
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend == 'true'
        run: docker compose up -d --no-deps lore-app

      # v2 рядом с v1, а не вместо: свой `up --no-deps`, lore-app не трогается.
      - name: Deploy frontend (v2, lore-app-next)
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend_next == 'true'
        run: docker compose up -d --no-deps lore-app-next

      # PL-04: v1 заморожен и по пушу не собирается, но на препроде он нужен —
      # релиз везёт на прод все три образа, прошедшие препрод. Если v1 в проекте
      # lore-preprod ещё не запущен (первая выкатка), поднимаем его ОБРАЗОМ ПРОДА:
      # unlimitedlore-lore-app:<vars.LORE_PREPROD_V1_SEED, по умолчанию latest> —
      # на 131 это последняя сборка v1 старого стенда (07a8c740 = прод v1).
      # Уже запущен — шаг ничего не делает. Образа нет — красный с подсказкой.
      - name: Препрод v1 — засев образом прода, если v1 ещё не запущен
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend != 'true'
        env:
          SEED: ${{ vars.LORE_PREPROD_V1_SEED || 'latest' }}
        run: |
          if [ -n "$(docker compose ps -q lore-app)" ]; then echo "v1 препрода уже работает — засев не нужен"; exit 0; fi
          src="unlimitedlore-lore-app:$SEED"
          id=$(docker image inspect -f '{{.Id}}' "$src" 2>/dev/null) || {
            echo "::error::v1 на препроде не запущен, а образа $src для засева нет. Задайте vars.LORE_PREPROD_V1_SEED (тег образа v1 прода) или соберите v1: LORE CD, service=frontend."; exit 1; }
          docker tag "$id" "unlimitedlore-lore-app:${LORE_IMAGE_TAG}"
          echo "::notice::v1 препрода засеян образом $src ($id)"
          docker compose up -d --no-deps lore-app

      # S3-10: v1 заморожен — проверяем фактом, а не обещанием. Если этот прогон
      # v1 не выкатывал, lore-app обязан работать на том же образе, что до
      # выкатки (сменился или пропал — деплой красный).
      - name: LORE v1 not touched (frozen image unchanged)
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend != 'true'
        run: bash .github/scripts/v1-freeze.sh verify

      # Хотфикс v1 (ручной запуск service=frontend): тег переезжает на новый образ.
      - name: Re-pin LORE v1 image after hotfix
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend == 'true'
        run: bash .github/scripts/v1-freeze.sh repin

      # Real verification, not "the command exited 0" — matches the manual
      # check this session ran by hand after every deploy this sprint.
      #
      # NOT curl 127.0.0.1:PORT from this step: this job runs inside a runner
      # container on the isolated "forgejo-net" bridge network (DooD via a
      # socket mount, not host networking) — its own 127.0.0.1 is itself, not
      # the Docker host, so a direct curl here would silently hit nothing.
      # `docker inspect`/`docker exec` go through the mounted socket instead,
      # which reaches the actual containers regardless of network topology.
      #
      # Resolved via `docker compose ps -q`, not a hardcoded container name —
      # the compose project name is derived from the checkout directory, which
      # may not be "unlimitedlore" on the runner's workspace.
      # Окно 300с, а не 120с. Замер 04.09.2026 на выкате с миграциями: один
      # только «BACKUP DATABASE» перед шагами занял ~2.5 минуты, то есть
      # корректный старт НЕ укладывался в прежние 120с и джоб краснел на
      # исправно поднимающемся сервисе. Красный деплой при живом сервисе хуже
      # медленного: он обесценивает сигнал, и следующий настоящий отказ прочтут
      # как «опять не дождалось».
      #
      # При отказе печатаем хвост лога контейнера. Прежнее сообщение называло
      # только «не стал healthy», и причину приходилось искать по ssh — а
      # причина там же, в логе: миграция не прошла, приложение отказалось
      # стартовать, docker перезапустил контейнер по кругу.
      - name: Wait for backend health
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.backend == 'true'
        run: |
          cid=$(docker compose ps -q lore-backend)
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "missing")
            if [ "$status" = "healthy" ]; then echo "backend healthy (${i}0s)"; exit 0; fi
            sleep 5
          done
          echo "::error::backend did not report healthy within 300s (last status: $status)"
          echo "--- last 80 lines of lore-backend log ---"
          docker logs --tail 80 "$cid" 2>&1 || true
          exit 1

      # DBR-10, пункт 5: «healthy» выше — это LIVENESS (/q/health/live в
      # healthcheck compose): процесс поднят. Он зелёный и тогда, когда к базе
      # бэкенд не ходит вовсе — кред отбит, база не открыта. Ровно этот случай
      # (локаут общего кред-а, 31.07) и есть причина спринта DB_RESILIENCE.
      #
      # READINESS спрашивает базу НАШИМ кредом (ArcadeReadinessCheck, PR #357:
      # SELECT по schema:types) и обязательный KC-мост — то есть проверяет
      # работу, а не наличие. Требуем HTTP 200; при отказе печатаем тело: в нём
      # причина (какая проверка DOWN и почему), а «DOWN» без причины одинаково
      # выглядит при упавшей БД, неверном креде и несуществующей базе.
      - name: Verify backend readiness (DB reachable with our credential)
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.backend == 'true'
        run: |
          cid=$(docker compose ps -q lore-backend)
          body=""; code=""
          for i in $(seq 1 24); do
            code=$(docker exec "$cid" curl -s -o /tmp/ready.json -w '%{http_code}' -m 10 http://localhost:9100/q/health/ready || echo "000")
            body=$(docker exec "$cid" cat /tmp/ready.json 2>/dev/null || true)
            if [ "$code" = "200" ]; then echo "readiness UP (${i}×5s): $body"; exit 0; fi
            sleep 5
          done
          echo "::error::readiness не поднялся за 120с (HTTP $code) — бэкенд жив, но не работает с базой или мостом"
          echo "--- тело /q/health/ready ---"
          echo "$body"
          exit 1

      # DBU-14: лечение индексов после переезда СУБД — конвейером, не руками.
      #
      # Индекс, собранный до исправления порядка строковых ключей (ArcadeDB
      # #5321), обслуживает только записи, сделанные ПОСЛЕ сборки. Старое он не
      # находит и НЕ ПАДАЕТ — возвращает пустоту. Замерено 04.08 на копии
      # прода: `KnowDecision.decision_id` — 0 из 40 ключей при живом скане.
      # Лечится перестройкой, но узнать о поломке можно только сверкой: метку
      # `upgradeWarning` движок ставит НЕ ВСЕМ (сломанный KnowDecision её не
      # имел).
      #
      # Сначала отчёт. Если чисто — шаг заканчивается, база не трогается вовсе.
      # Если нет — лечение, и оно само делает бэкап перед первой правкой.
      #
      # Автолечение отключается переменной LORE_DB_AUTOHEAL=false: тогда шаг
      # остаётся отчётом и деплой продолжается с предупреждением, а не тихо.
      - name: Heal DB indexes after upgrade
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.backend == 'true'
        env:
          DB_USER: root
          DB_PASS: ${{ secrets.ARCADEDB_ROOT_PASSWORD }}
          # PL-04: база препрода, а не прод-имя по умолчанию.
          DB_NAME: ${{ env.LORE_DB }}
          # Реестр FT лежит В РЕПОЗИТОРИИ, а не в build/: образ собирается
          # внутри docker, gradle на раннере не запускается, и артефакта сборки
          # здесь не бывает. Копию сверяет SliceSqlDumpTest — разойтись с
          # реестром она не может незаметно.
          FT_REGISTRY: .github/data/ft-indexes.tsv
          # 10 ключей на индекс: полная сверка на 40 занимает минуты и держит
          # деплой. Десяти хватает, чтобы поймать поломку этого класса — она
          # даёт НОЛЬ найденных, а не «почти все». Частичное расхождение почти
          # всегда означает негодную мерку, а не полуживой индекс.
          KEYS: 10
        run: |
          if [ ! -s "$FT_REGISTRY" ]; then
            # Без реестра FULL_TEXT нечем пересоздать, и молчать нельзя:
            # лечение окажется неполным, а отчитается успехом.
            echo "::warning::нет ${FT_REGISTRY} — FULL_TEXT-индексы вылечить нечем"
          fi

          # Адрес базы. `127.0.0.1` НЕ годится: шаг выполняется внутри
          # контейнера задания, и localhost там — сам контейнер. Ровно на этом
          # 04.08 упал регресс СУБД, пока я не развела адресацию.
          #
          # Бэкенд ходит в БД через `extra_hosts: arcade:host-gateway`, то есть
          # ArcadeDB слушает на ХОСТЕ. Из контейнера задания хост — это шлюз по
          # умолчанию.
          #
          # Шлюз берём из /proc/net/route, а НЕ из `ip route`: в раннер-образе
          # нет iproute2, и первый прогон 04.08 упал с exit 127 «command not
          # found» — деплой при этом уже прошёл, а шаг лечения не выполнился
          # вовсе. Здесь нужны только чтение файла и арифметика оболочки.
          GW="${ARCADE_HOST:-}"
          if [ -z "$GW" ]; then
            hex=$(awk '$2=="00000000" && $8=="00000000" {print $3; exit}' /proc/net/route 2>/dev/null)
            if [ -n "$hex" ] && [ ${#hex} -eq 8 ]; then
              # little-endian hex → точечная запись
              GW="$((16#${hex:6:2})).$((16#${hex:4:2})).$((16#${hex:2:2})).$((16#${hex:0:2}))"
            fi
          fi
          if [ -z "$GW" ]; then
            echo "::error::не определить адрес хоста — до БД не достучаться"
            exit 1
          fi
          echo "адрес БД определён как: $GW"
          export DB_URL="http://$GW:2480"
          # Доступ проверяется ДО лечения и именно под нашей учёткой: /api/v1/ready
          # отвечает кому угодно, и по нему база «живая» даже с неверным паролем.
          if ! curl -sf -m 10 -u "root:$DB_PASS" "$DB_URL/api/v1/databases" >/dev/null; then
            echo "::error::БД по $DB_URL не пустила под root — лечение не запускается"
            exit 1
          fi
          echo "БД доступна: $DB_URL"

          if bash .github/scripts/db-heal.sh; then
            echo "индексы в порядке — лечение не требуется"
            exit 0
          fi
          if [ "${{ vars.LORE_DB_AUTOHEAL }}" = "false" ]; then
            echo "::warning::найдены сломанные индексы, но автолечение выключено (LORE_DB_AUTOHEAL=false)"
            exit 0
          fi
          echo "::warning::найдены сломанные индексы — лечу"
          bash .github/scripts/db-heal.sh --apply

      # «Контейнер healthy» не значит «мосты настроены»: healthcheck смотрит
      # только /q/health/live. Пустой секрет даёт живой контейнер и мёртвый
      # KC-мост — именно так выглядел бы зелёный деплой без учётки Infisical.
      # Поэтому проверяем ФАКТ: preflight должен сказать, что KC настроен.
      - name: Verify KC bridge actually got its secret
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.backend == 'true'
        run: |
          cid=$(docker compose ps -q lore-backend)
          # Проверка enforcement (auth реально требует токен) зависит от
          # режима — auth-preflight сам под requireAdmin, а после включения
          # auth заголовку X-Seer-Role больше не верят, так что тот же запрос
          # честно получает 401/403. Это ПОДТВЕРЖДЕНИЕ: бэкенд поднялся и
          # требует токен. 200 в этом режиме означал бы, что флаг не попал в
          # СБОРКУ образа (quarkus.oidc.enabled фиксируется на build-time).
          # AL-88 (2026-07-30): curl идёт через ОТДЕЛЬНЫЙ throwaway-контейнер на
          # compose-сети проекта (`docker run --network ..._default`), а не
          # `docker exec` внутрь backend'а и не host.docker.internal — сама
          # причина расписана ниже, у гейта kc_configured (тот же класс фикса).
          code=$(docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" curlimages/curl:latest \
            curl -s -o /dev/null -w '%{http_code}' -m 10 \
            -H 'X-Seer-Role: admin' http://lore-backend:9100/lore/kc/auth-preflight || echo 000)
          echo "auth-preflight -> HTTP $code"
          if [ "${LORE_AUTH_ENABLED}" = "true" ]; then
            case "$code" in
              401|403) echo "auth включён и ЗАСТАВЛЯЕТ предъявлять токен — заголовку больше не верят" ;;
              200) echo "::error::auth должен быть включён, но эндпоинт пустил по заголовку X-Seer-Role. Значит LORE_AUTH_ENABLED не попал в СБОРКУ образа (quarkus.oidc.enabled фиксируется на build-time) — проверьте build-args в compose."; exit 1 ;;
              *)   echo "::error::бэкенд не ответил на auth-preflight (HTTP $code)"; exit 1 ;;
            esac
          fi
          # MIG-33: kc_configured проверяется ЗДЕСЬ, в ОБЕИХ ветках одинаково —
          # раньше это было только в auth-off ветке (через auth-preflight,
          # который при auth on сам требует токен и JSON-тело не отдаёт), и
          # мёртвый мост за корректно включённым auth проходил CD зелёным.
          # /q/health/ready — та же дырка в SeerRoleFromTokenFilter.isProtected,
          # что у /q/health/live (healthcheck compose), поэтому читается без
          # токена независимо от режима auth (LoreBridgeHealthCheck).
          #
          # AL-88 (30-31.07.2026) — ШЕСТЬ провалов подряд, реальная причина
          # найдена на шестом. Хроника (полная — в задаче AL-88 LORE, не тут):
          # окно 120с/200с/450с/300с/300с, механизм docker-exec-в-цикле →
          # throwaway-контейнер → реже опрос — ничего не помогало, потому что
          # ни одна из гипотез (гонка тайминга, exec-interference, частота
          # опроса) не была настоящей причиной. Диагностическое логирование
          # внутри SecretProvider (шестой прогон) впервые дало факт: секрет
          # получен за 110-130мс, kc_configured становился true в течение ~1с
          # после старта контейнера — то есть ДО первой же проверки этого шага.
          # А цикл всё равно не находил совпадение все 12 попыток подряд.
          #
          # Настоящая причина — опечатка в паттерне: JSON отдаёт
          # `"kc_configured": true` (ПРОБЕЛ после двоеточия — стандартное
          # форматирование Vert.x JsonObject), а паттерн искал
          # `"kc_configured":true` БЕЗ пробела. Совпасть не мог НИКОГДА,
          # независимо от того, что происходило с секретом, Infisical или
          # частотой опроса — все шесть падений с первого до последнего были
          # этим одним и тем же missing-space багом. Диагностический дамп
          # каждый раз показывал true СРАЗУ после отказа именно потому, что он
          # печатал сырое тело, а не прогонял его через тот же кривой паттерн.
          #
          # Канал опроса (throwaway-контейнер на compose-сети
          # `${COMPOSE_PROJECT_NAME}_default`, не host.docker.internal — тот
          # смотрит на loopback-порт, недостижимый с моста) и интервал 25с
          # остаются оправданными сами по себе — они не были причиной, но и не
          # были ошибкой.
          hbody=$(docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" curlimages/curl:latest sh -c '
            hbody=""
            for i in $(seq 1 12); do
              hbody=$(curl -s -m 10 http://lore-backend:9100/q/health/ready || true)
              if echo "$hbody" | grep -qE "\"kc_configured\"[[:space:]]*:[[:space:]]*true"; then break; fi
              sleep 25
            done
            echo "$hbody"
          ')
          case "$hbody" in
            *'"kc_configured": true'*|*'"kc_configured":true'*) echo "KC-мост настроен" ;;
            *)
              echo "::error::КС-мост не получил секрет за 300с (kc_configured != true в /q/health/ready). Секреты берутся из Infisical по machine identity — проверьте LORE_SECRETS_* и что identity добавлена в проект."
              # AL-88 (2026-07-30, воспроизведено дважды): голого текста ошибки
              # недостаточно, чтобы отличить «Infisical недоступен по сети» от
              # «доступен, но identity/project отклонён» — оба дают ровно тот же
              # kc_configured:false снаружи. Дампим три вещи, которых раньше не
              # было в логе CD вообще:
              echo "--- /q/health/ready тело (полностью) ---"
              echo "$hbody"
              echo "--- сетевая связность контейнера до Infisical (host-gateway:18080) ---"
              docker exec "$cid" curl -sv -m 10 -o /dev/null "${LORE_SECRETS_URL:-http://infisical:18080}" 2>&1 || true
              echo "--- логи lore-backend (последние 150 строк, фильтр SecretProvider/Infisical/KC) ---"
              docker compose logs --no-color --tail=150 lore-backend 2>&1 | grep -iE "secretprovider|infisical|kcbridge|authstartupguard" || echo "(в логах ничего не найдено по фильтру — секцию расширить вручную: docker compose logs lore-backend)"
              exit 1
              ;;
          esac

      # DBR-18: секреты мостов проверяются РАБОТОЙ, а не наличием. Шаг выше
      # подтверждает только kc_configured — «секрет получен»; отозванный или
      # ротированный секрет проходил его зелёным, а мост был мёртв. Группа
      # bridges (LoreBridgeProbeCheck) делает живую пробу: токен KC по client
      # credentials и чтение репозитория зарегистрированного проекта в Forgejo
      # (то же, что делает сам мост). Не в readiness намеренно —
      # недоступный KC не должен выводить бэкенд из ротации.
      # Решает HTTP-КОД группы (200 = UP, 503 = DOWN), а не поиск подстроки в
      # теле: шесть ложных провалов AL-88 были ровно grep-ом по JSON.
      - name: Verify bridges actually work (DBR-18)
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.backend == 'true'
        run: |
          out=$(docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" curlimages/curl:latest \
            sh -c 'curl -s -m 30 -w "\n%{http_code}" http://lore-backend:9100/q/health/group/bridges || printf "\n000"')
          code=$(printf '%s' "$out" | tail -n1)
          body=$(printf '%s' "$out" | sed '$d')
          echo "bridges -> HTTP $code"
          echo "$body"
          case "$code" in
            200) echo "мосты KC и Forgejo отвечают своими секретами (либо не настроены — probed=false в теле)" ;;
            503)
              # Две РАЗНЫЕ причины DOWN, и текст обязан их различать: на #711
              # сбой кода пробы (NPE) был назван «секрет отозван».
              if printf '%s' "$body" | grep -qE '"probe_defect"[[:space:]]*:[[:space:]]*"[^"]+' || printf '%s' "$body" | grep -q '"exceptionClass"'; then
                echo "::error::упала САМА проба мостов (дефект кода, не секрет) — причина в probe_defect/exceptionClass выше. О секретах это ничего не говорит."
              else
                echo "::error::мост настроен, но не работает — kc_error / forgejo_error выше называют, какой и почему. Секрет отозван или ротирован: обновите его в Infisical."
              fi
              exit 1 ;;
            *)   echo "::error::группа /q/health/group/bridges не ответила (HTTP $code) — бэкенд без LoreBridgeProbeCheck или недоступен"; exit 1 ;;
          esac

      - name: Verify frontend serves
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend == 'true'
        run: |
          cid=$(docker compose ps -q lore-app)
          code=$(docker exec "$cid" curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/)
          if [ "$code" != "200" ]; then
            echo "::error::frontend (in-container) returned HTTP $code"
            exit 1
          fi
          echo "frontend OK ($code)"
          # DBR-10, пункт 5: 200 на index.html — наличие, а не работа. SPA отдаёт
          # 200 на любой путь, и битая сборка (index ссылается на бандл, которого
          # в образе нет) прошла бы эту проверку. Поэтому берём бандл, на который
          # ссылается САМ index, и требуем, чтобы он отдавался.
          js=$(docker exec "$cid" sh -c 'curl -s http://127.0.0.1/ | grep -o "src=\"/assets/[^\"]*\.js\"" | head -1 | cut -d\" -f2')
          if [ -z "$js" ]; then
            echo "::error::в index.html не найден ни один /assets/*.js — проверять нечего, значит сборка не та"
            exit 1
          fi
          jcode=$(docker exec "$cid" curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1$js")
          jtype=$(docker exec "$cid" curl -s -o /dev/null -w "%{content_type}" "http://127.0.0.1$js")
          case "$jtype" in *javascript*) ;; *) jtype="НЕ JS: $jtype" ;; esac
          if [ "$jcode" != "200" ] || [ "${jtype#НЕ JS}" != "$jtype" ]; then
            echo "::error::index.html ссылается на $js, а он отдаётся как HTTP $jcode ($jtype) — бандл не тот, что в index"
            exit 1
          fi
          echo "бандл из index отдаётся: $js ($jcode, $jtype)"

      # SPRINT_UXR_S0_SAFETY/S0-03: путь ПОЛЬЗОВАТЕЛЯ, а не изнутри контейнеров.
      # Все проверки выше идут docker exec'ом или по сети compose и не видят
      # опубликованный порт :4400, location /lore/ в nginx и приём токена
      # бэкендом. Проба стучится в http://127.0.0.1:4400/lore/version из
      # одноразового контейнера в сети ХОСТА (своё 127.0.0.1 у раннера — он сам)
      # с service-токеном (client_credentials) и требует 200 + JSON с commit.
      # Если выкатывался бэкенд — commit обязан совпасть с этим коммитом, иначе
      # отвечает старый образ. Логика и самопроверка — в скрипте (--selftest
      # гоняется в backend CI на каждом PR, включая контроль «неверный порт → красный»).
      # Нет секретов LORE_CD_PROBE_CLIENT_* — шаг КРАСНЫЙ (BLOCKED), не пропуск.
      #
      # PL-04: коммит СБОРКИ работающего бэкенда — из метки revision образа.
      # Проба /lore/version сверяет commit ВСЕГДА, а не только когда бэкенд
      # выкатывался: у перетегированного образа commit ≠ sha пуша (PL-08).
      - name: Коммит сборки бэкенда препрода (метка revision)
        id: pinned
        if: steps.mode.outputs.live == 'true'
        run: bash .github/scripts/preprod-pin-sha.sh revision

      # PL-04: путь пользователя — по ИМЕНИ препрода через Traefik 131 (сертификат
      # regru). Первый сертификат выписывается DNS-01 — до 2 минут повторов на 000.
      - name: Проба /lore/version по имени препрода (S0-03)
        if: steps.mode.outputs.live == 'true'
        env:
          PROBE_CLIENT_ID: ${{ secrets.LORE_CD_PROBE_CLIENT_ID }}
          PROBE_CLIENT_SECRET: ${{ secrets.LORE_CD_PROBE_CLIENT_SECRET }}
          PROBE_CURL: docker run --rm --network host curlimages/curl:latest curl
          PROBE_ATTEMPTS: "12"
          PROBE_DELAY: "10"
          EXPECT_COMMIT: ${{ steps.pinned.outputs.backend_revision }}
        run: bash .github/scripts/version-probe.sh https://preprod.lore.odal.seidrstudio.pro

      # S3-06: то же, что «Verify frontend» выше, для v2, плюс «это именно v2»: оба образа собираются с одного
      # шаблона nginx, и перепутанный бандл (v1 в образе v2) прошёл бы проверку
      # «200 + бандл отдаётся» молча.
      - name: Verify frontend v2 serves
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend_next == 'true'
        run: |
          cid=$(docker compose ps -q lore-app-next)
          [ -n "$cid" ] || { echo "::error::контейнер lore-app-next не найден после up"; exit 1; }
          page=$(docker exec "$cid" curl -s http://127.0.0.1/)
          echo "$page" | grep -q '<title>LORE v2</title>' || {
            echo "::error::lore-app-next отдаёт не index v2 (нет <title>LORE v2</title>)"; exit 1; }
          js=$(echo "$page" | grep -o 'src="/assets/[^"]*\.js"' | head -1 | cut -d'"' -f2)
          [ -n "$js" ] || { echo "::error::в index v2 нет ни одного /assets/*.js"; exit 1; }
          jcode=$(docker exec "$cid" curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1$js")
          jtype=$(docker exec "$cid" curl -s -o /dev/null -w "%{content_type}" "http://127.0.0.1$js")
          case "$jcode:$jtype" in
            200:*javascript*) echo "v2 OK: index v2, бандл $js ($jcode, $jtype)" ;;
            *) echo "::error::index v2 ссылается на $js, а он отдаётся как HTTP $jcode ($jtype)"; exit 1 ;;
          esac

      # ── Пробы снаружи контейнеров (S3-06) ─────────────────────────────────
      # Шаги выше смотрят ИЗНУТРИ контейнера. Здесь — путь клиента: через
      # nginx до бэкенда. Логика и разбор исходов — в post-deploy-probe.sh
      # (bash в `run:` уже ломал разбор workflow парсером Forgejo).
      #
      # PL-04: опубликованный порт v1 ПРЕПРОДА (:4410). Прежняя проба :4400 —
      # адрес MCP — теперь смотрит на пересыльщик прод-MCP и препроду не
      # принадлежит. Коммит — из метки образа (шаг pinned).
      - name: Probe :4410/lore/version (опубликованный порт v1 препрода)
        if: steps.mode.outputs.live == 'true'
        env:
          WANT_COMMIT: ${{ steps.pinned.outputs.backend_revision }}
        run: bash .github/scripts/post-deploy-probe.sh version "v1 :4410" http://192.168.3.131:4410/lore/version "$WANT_COMMIT"

      # /lore/ через nginx v2 — общий шаблон обязан проксировать и у второго
      # фронта (через него пойдёт телефон с new.lore). Адрес внутри сети
      # compose: опубликованный порт v2 (4402) — деталь для ручного захода.
      - name: Probe /lore/version через nginx v2
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend_next == 'true'
        run: PROBE_NETWORK="${COMPOSE_PROJECT_NAME}_default" bash .github/scripts/post-deploy-probe.sh version "v2 nginx" http://lore-app-next/lore/version

      # new.lore (D-2026-UXR-V2-HOST): отдаётся ли по публичному имени именно
      # v2. DNS, сертификат и роутер — S3-03/04 (другая сессия); до их
      # готовности там v1 через временный роутер, поэтому строгость —
      # переменной репозитория: warn по умолчанию (громко, деплой зелёный),
      # required после S3-04 (не v2 → деплой красный).
      # PL-04: публичное имя v2 ПРЕПРОДА.
      - name: Probe preprod.new.lore (публичный адрес v2 препрода)
        if: steps.mode.outputs.live == 'true' && steps.which.outputs.frontend_next == 'true'
        env:
          LORE_V2_PUBLIC_PROBE: ${{ vars.LORE_V2_PUBLIC_PROBE || 'warn' }}
        run: bash .github/scripts/post-deploy-probe.sh v2-page https://preprod.new.lore.odal.seidrstudio.pro/

      # PL-04: по ИМЕНИ препрода отдаётся бандл ровно того контейнера, что работает
      # в проекте lore-preprod (а не старого стенда и не чужого маршрута Traefik).
      # Тот же скрипт сверяет прод в релизе — там ожидаемое берётся из образа.
      - name: Проба бандла v1 по имени препрода
        if: steps.mode.outputs.live == 'true'
        run: bash .github/scripts/bundle-probe.sh "v1 препрод" container:lore-app https://preprod.lore.odal.seidrstudio.pro/

      - name: Проба бандла v2 по имени препрода
        if: steps.mode.outputs.live == 'true'
        run: bash .github/scripts/bundle-probe.sh "v2 препрод" container:lore-app-next https://preprod.new.lore.odal.seidrstudio.pro/

      # PL-04 → PL-05: ПОСЛЕДНИМ, после всех проб — тег unlimitedlore-<сервис>:<sha8>
      # на образы, работающие в lore-preprod (собранное сейчас и не тронутое).
      # По нему релиз найдёт на 131 то, что прошло препрод; не прошедшее пробы
      # тега не получает.
      - name: Пометить образы препрода :sha8 (их везёт релиз)
        if: steps.mode.outputs.live == 'true'
        run: bash .github/scripts/preprod-pin-sha.sh tag

      # Telegram notifications — same pattern as aida-root's cd.yml (secrets.
      # TELEGRAM_TOKEN/TELEGRAM_CHAT_ID, silent no-op if unset so this doesn't
      # fail for anyone who hasn't configured them on THIS repo — Forgejo
      # secrets are per-repo, aida-root's config does not carry over here).
      # Only success/failure, no "start" ping: this fires on every push to
      # preprod, and a start-notification for every promotion would be
      # noisy where aida-root's tag-triggered prod releases are not.
      # continue-on-error + trailing `exit 0`: Telegram is best-effort only.
      # 2026-07-13: api.telegram.org:443 was unreachable from this host entirely
      # (host + both docker networks timed out at the TCP level). 2026-07-14: the
      # act_runner containers were given an outbound HTTP(S) proxy (runner.envs
      # HTTP_PROXY/HTTPS_PROXY -> host.docker.internal:10809, routing through the
      # host's local VPN client; NO_PROXY keeps the Forgejo-internal checkout
      # unproxied) and Telegram is reachable again — confirmed live via a real
      # workflow_dispatch run reaching the user's Telegram. Kept best-effort
      # anyway: the proxy is a detail of THIS dev machine, not guaranteed to
      # exist on whatever CI host eventually replaces it, so an unreachable
      # Telegram still must not turn a healthy deploy red.
      # Ссылки в сообщении — ТОЛЬКО публичные (2026-07-24, замечание владельца).
      # github.server_url внутри act_runner = внутренний ROOT_URL Forgejo
      # (http://forgejo:3000) — такая ссылка с телефона мертва. Публичная база
      # захардкожена сознательно: это свойство ЭТОГО стенда, как и сам runner.
      # PR промоушна вытаскивается из merge-коммита (push в preprod — всегда
      # результат мержа PR develop→preprod); нет номера — строка опускается,
      # а не рисуется битой.
      - name: Notify success
        if: success() && steps.mode.outputs.live == 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_REPO: https://git.seidrstudio.pro/AIDA/UnlimitedLORE
          STAND_URL: https://preprod.lore.odal.seidrstudio.pro
        run: |
          [ -z "${TG_TOKEN}" ] && exit 0
          RUN_URL="${PUBLIC_REPO}/actions/runs/${{ github.run_number }}"
          SUBJ=$(git log -1 --pretty=%s)
          PR_NUM=$(printf '%s' "$SUBJ" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          # Заголовок PR из merge-коммита — «что именно выехало» читается из
          # уведомления, без похода по ссылке (замечание владельца 2026-07-24).
          PR_TITLE=$(printf '%s' "$SUBJ" | sed -E "s/^Merge pull request '(.*)' \(#[0-9]+\).*$/\1/")
          [ "$PR_TITLE" = "$SUBJ" ] && PR_TITLE=""
          PR_LINE=""
          [ -n "$PR_NUM" ]   && PR_LINE=$(printf "\nPR: %s/pulls/%s" "$PUBLIC_REPO" "$PR_NUM")
          [ -n "$PR_TITLE" ] && PR_LINE=$(printf "\nЧто: %s%s" "$PR_TITLE" "$PR_LINE")
          MSG=$(printf "✅ LORE CD: препрод обновлён\nRef: %s @ %.10s\nBy: %s\nService: %s%s\n\nПрепрод: %s\nРелизы: %s/releases\nRun: %s" \
            "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.actor }}" \
            "${{ github.event.inputs.service || 'both' }}" "$PR_LINE" \
            "$STAND_URL" "$PUBLIC_REPO" "$RUN_URL")
          jq -n --arg chat "$TG_CHAT" --arg text "$MSG" \
            '{"chat_id":$chat,"text":$text}' > /tmp/tg-payload.json
          for attempt in 1 2 3; do
            if curl -sf --max-time 10 -X POST \
                 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                 -H "Content-Type: application/json" \
                 -d @/tmp/tg-payload.json; then
              echo "[tg] success notification sent (attempt $attempt)"
              break
            fi
            echo "::warning::[tg] success-notify attempt $attempt/3 failed"
            [ $attempt -lt 3 ] && sleep $((attempt * 5))
          done
          exit 0

      - name: Notify failure
        if: failure() && steps.mode.outputs.live == 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_REPO: https://git.seidrstudio.pro/AIDA/UnlimitedLORE
        run: |
          [ -z "${TG_TOKEN}" ] && exit 0
          RUN_URL="${PUBLIC_REPO}/actions/runs/${{ github.run_number }}"
          SUBJ=$(git log -1 --pretty=%s)
          PR_NUM=$(printf '%s' "$SUBJ" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          PR_TITLE=$(printf '%s' "$SUBJ" | sed -E "s/^Merge pull request '(.*)' \(#[0-9]+\).*$/\1/")
          [ "$PR_TITLE" = "$SUBJ" ] && PR_TITLE=""
          PR_LINE=""
          [ -n "$PR_NUM" ]   && PR_LINE=$(printf "\nPR: %s/pulls/%s" "$PUBLIC_REPO" "$PR_NUM")
          [ -n "$PR_TITLE" ] && PR_LINE=$(printf "\nЧто: %s%s" "$PR_TITLE" "$PR_LINE")
          MSG=$(printf "❌ LORE CD: выкатка препрода УПАЛА\nRef: %s @ %.10s\nBy: %s\nService: %s%s\n\nRun: %s" \
            "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.actor }}" \
            "${{ github.event.inputs.service || 'both' }}" "$PR_LINE" "$RUN_URL")
          jq -n --arg chat "$TG_CHAT" --arg text "$MSG" \
            '{"chat_id":$chat,"text":$text}' > /tmp/tg-payload.json
          for attempt in 1 2 3; do
            if curl -sf --max-time 10 -X POST \
                 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                 -H "Content-Type: application/json" \
                 -d @/tmp/tg-payload.json; then
              echo "[tg] failure notification sent (attempt $attempt)"
              break
            fi
            echo "::warning::[tg] failure-notify attempt $attempt/3 failed"
            [ $attempt -lt 3 ] && sleep $((attempt * 5))
          done
          exit 0
