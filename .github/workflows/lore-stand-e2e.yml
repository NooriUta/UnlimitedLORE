# Тесты стенда под тестовыми учётками (SPRINT_LORE_ADMIN_POLISH/AP-02,
# SPRINT_UXR_S11_TEST_OPT/E2E-STAND): автологин test-* → RBAC (rbac.stand.ts) и смоук
# (smoke.stand.ts) против ПРЕПРОДА. Владелица 15.11.2026: «доработай тесты, чтобы он
# сам подставлял тестовые учётки и вы могли проверять».
#
# Запуск — по кнопке (workflow_dispatch), чтобы проверять выкатку, когда она встала.
# Нужен секрет LORE_STAND_ACCOUNTS_JSON ({"test-sa":"…",…}; только TEST-логины —
# остальные отвергает сам скрипт). Заводит его CICDGitHub из Infisical. Пароли в журнал
# не попадают. Прод отвергается и автологином, и смоуком (isForbiddenStandUrl).
name: LORE stand e2e (preprod, test accounts)

on:
  workflow_dispatch:
    inputs:
      stand_url:
        description: 'Адрес стенда (только препрод)'
        required: false
        default: 'https://preprod.new.lore.odal.seidrstudio.pro'

concurrency:
  group: lore-stand-e2e
  cancel-in-progress: false

jobs:
  stand-e2e:
    runs-on: lore-only
    timeout-minutes: 30
    env:
      LORE_STAND_URL: ${{ inputs.stand_url }}
      LORE_STAND_ACCOUNTS_JSON: ${{ secrets.LORE_STAND_ACCOUNTS_JSON }}
      # Проба брокеринга seer → omilore (BR-01/02): пароль test-* в seerPreprod.
      LORE_STAND_BROKER_ACCOUNTS_JSON: ${{ secrets.LORE_STAND_BROKER_ACCOUNTS_JSON }}
      LORE_STAND_STORAGE_STATE: e2e/stand/.auth/stand.json
      # Chrome в образе раннера нет — Chromium из Playwright.
      LORE_STAND_CHANNEL: ''
    steps:
      - uses: actions/checkout@v7

      - name: Resolve a working proxy address (or drop it)
        run: bash .github/scripts/resolve-proxy.sh

      - name: Use Nexus mirror (npm)
        run: bash .github/scripts/use-nexus.sh

      - name: Use runner-image Node
        run: |
          command -v node >/dev/null || { echo "::error::в образе раннера нет node"; exit 1; }
          node --version

      - name: Install web-next
        working-directory: web-next
        run: bash ../.github/scripts/npm-retry.sh ci

      # Chromium (~100 МБ) качается на каждом прогоне по более быстрому из двух путей (шаг
      # «Сеть» ниже). Кеша нет: actions/cache в локальном Forgejo не зеркалирован — прогон
      # 7845 упал на подготовке «actions/cache … Repository not found». Остальные
      # workflow репо обходятся checkout, setup-node, setup-java, upload-artifact.

      # Владелица 15.11.2026: «поставь проверку и так и так и выбор быстрого варианта».
      # Быстрее бывает то прокси, то прямой путь — зависит от источника (замер CICDGitHub:
      # CDN Playwright через прокси 1018 КБ/с, напрямую 350; GitHub — наоборот). Скрипт
      # меряет оба пути на файле CDN и при выигрыше прямого пишет пустые HTTP(S)_PROXY в
      # $GITHUB_ENV до конца джобы. Копия AIDA/core-services scripts/pick-fastest-net.sh
      # (7cb22d9). Билд 1148 = chromium-headless-shell Playwright 1.49.1 — при смене версии
      # Playwright поменять PROBE_URL.
      - name: Сеть — выбрать быстрый путь
        env:
          PROBE_URL: https://playwright.azureedge.net/builds/chromium/1148/chromium-headless-shell-linux.zip
        run: bash .github/scripts/pick-fastest-net.sh

      # Браузеры — из зеркала kkRepo на ci-server (владелица 15.11.2026: «положите в kkrepo с
      # cicdgithub сессией»; заведено CICDGitHub, raw-прокси на cdn.playwright.dev, пути как на
      # CDN — RUNBOOK-CI-MIRROR-KKREPO-NEXUS). Проба — файлом (у kkRepo нет /service/rest):
      # жив — PLAYWRIGHT_DOWNLOAD_HOST на зеркало; нет — откат на CDN (с предупреждением).
      # Три попытки: CDN на этом раннере рвётся (прогон 7848 — таймаут на 90 % архива,
      # запасные CDN недоступны: EAI_AGAIN и IPv6 ENETUNREACH).
      - name: Install Chromium
        working-directory: web-next
        env:
          PW_MIRROR: http://192.168.3.131:8081/repository/playwright-proxy
        run: |
          export NO_PROXY="${NO_PROXY:+$NO_PROXY,}192.168.3.131" no_proxy="${no_proxy:+$no_proxy,}192.168.3.131"
          if curl -sf --max-time 20 -o /dev/null "$PW_MIRROR/builds/ffmpeg/1010/ffmpeg-linux.zip"; then
            export PLAYWRIGHT_DOWNLOAD_HOST="$PW_MIRROR"; echo "браузеры — из зеркала kkRepo"
          else
            echo "::warning::зеркало kkRepo не ответило — браузеры с CDN"
          fi
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::загрузка Chromium не удалась (попытка $i из 3)"; sleep 15
          done
          echo "::error::Chromium не установлен за 3 попытки"; exit 1

      # Достижим ли стенд и KC из контейнера раннера — через прокси раннера и напрямую.
      # Только диагностика: шаг не роняет джобу (прогон 7846 упал на входе без следа).
      - name: Сеть — достижимость стенда и KC
        continue-on-error: true
        run: |
          for u in "$LORE_STAND_URL/news" "https://odal.seidrstudio.pro/kc/realms/omilorePreprod/.well-known/openid-configuration"; do
            echo "== $u"
            getent hosts "$(echo "$u" | sed -E 's#https?://([^/]+).*#\1#')" || echo "DNS: не разрешается"
            echo "через прокси (${HTTPS_PROXY:-нет}): $(curl -sS -o /dev/null --max-time 20 -w '%{http_code} %{remote_ip} %{time_total}s' "$u" 2>&1)"
            echo "напрямую: $(env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy curl -sS -o /dev/null --max-time 20 -w '%{http_code} %{remote_ip} %{time_total}s' "$u" 2>&1)"
          done

      - name: Автологин тестовых учёток
        working-directory: web-next
        run: npm run e2e:stand:login

      - name: RBAC + смоук + брокеринг на стенде
        working-directory: web-next
        run: npm run e2e:stand

      - name: Отчёт
        if: always()
        working-directory: web-next
        run: cat e2e/.stand-report/summary.md 2>/dev/null || echo "отчёта нет"
