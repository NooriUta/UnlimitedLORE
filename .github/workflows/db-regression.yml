name: DB regression (ArcadeDB)

# DBU-08: постоянный регресс СУБД по матрице версий.
#
# НЕ гейт релиза. Прогон разведочный: красный результат на кандидате не должен
# ронять пайплайн develop, иначе чужой релиз начнёт блокировать нашу работу.
# Гейтом набор становится только в момент явного апгрейда (DBU-09).
#
# Зачем вообще: апгрейд СУБД у нас каждый раз превращался в разведку заново, а
# заметкам релиза верить нельзя — 26.8.1 объявлял исправленными #4732 и
# #5675/#5765, обе правки оказались неполными (DBR-12, DBR-13).
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Текущая рабочая версия — эталон сравнения'
        required: true
        default: '26.7.2'
      candidate:
        description: 'Версия-кандидат на апгрейд'
        required: true
        default: '26.8.1'
  schedule:
    # Раз в неделю: ловит новые релизы без ручного захода. Ночь субботы —
    # прогон ни с чем не конкурирует за раннер.
    - cron: '17 2 * * 6'

jobs:
  # ОДНО задание на обе версии, а не матрица из двух.
  #
  # Матрица требовала передавать выдачу между заданиями через артефакты, а
  # upload-artifact@v4 на Forgejo не работает вовсе: «@actions/artifact v2.0.0+
  # … are not currently supported on GHES». Прогон 04.08 отработал полностью и
  # всё равно был помечен упавшим — из-за шага выгрузки, а не из-за тестов.
  #
  # Параллельность здесь ничего не стоит: набор отрабатывает за две секунды.
  # Зато сравнение делается на месте, без переноса файлов между заданиями.
  regress:
    runs-on: ubuntu-latest
    # Версии заданы ОДИН раз на задание. Раньше выражение
    # `inputs.X || 'версия'` повторялось шестью строками ниже, и бамп означал
    # шесть правок, любую из которых можно пропустить — а пропуск выглядел бы
    # не ошибкой, а прогоном не той пары версий (ARC281-08).
    env:
      BASELINE: ${{ inputs.baseline || '26.7.2' }}
      CANDIDATE: ${{ inputs.candidate || '26.8.1' }}
    steps:
      - uses: actions/checkout@v7

      # Пароль пробы — локальный контейнер, живёт минуты и умирает вместе с
      # прогоном. Секрет прода сюда не нужен и намеренно не берётся: набор не
      # ходит ни в прод, ни в общую тест-БД.
      #
      # Порт на хост НЕ публикуется: `-p 2480:2480` упирался в «port is already
      # allocated» — на ci-server этот порт держит БОЕВОЙ LORE-ygg. Проба
      # обязана быть безразлична к тому, что ещё крутится на машине.
      #
      # Связь по имени контейнера в общей docker-сети: задание живёт в своём
      # контейнере, docker здесь хостовый (DooD), поэтому localhost не годится.
      - name: Прогон обеих версий
        run: |
          set -eu
          NET=$(docker inspect "$(hostname)" \
                --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' 2>/dev/null \
                | head -1)
          if [ -z "$NET" ]; then
            echo "::error::не определить docker-сеть задания — проба не достучится до БД"
            exit 1
          fi
          echo "сеть задания: $NET"

          run_one() {
            ver="$1"; name="arcade-regress-$ver"
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker run -d --name "$name" --network "$NET" \
              -e JAVA_OPTS="-Darcadedb.server.rootPassword=regress-local -Darcadedb.server.defaultDatabases=probe[root]" \
              "arcadedata/arcadedb:$ver" >/dev/null

            # Ожидание ДОСТУПА, а не доступности: /api/v1/ready отвечает кому
            # угодно, и по нему сервер «живой» даже с неверным паролем — дальше
            # тесты падают непрозрачными 500. Годным считается только тот, кто
            # под нашей учёткой отдаёт список баз.
            ok=0
            for i in $(seq 1 60); do
              if curl -sf -m 4 -u root:regress-local "http://$name:2480/api/v1/databases" >/dev/null 2>&1; then
                echo "$ver готов через ${i}s"; ok=1; break
              fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::ArcadeDB $ver не пустил под root за 60s"
              docker logs "$name" 2>&1 | tail -50
              docker rm -f "$name" >/dev/null 2>&1 || true
              return 1
            fi

            DB_URL="http://$name:2480" DB_USER=root DB_PASS=regress-local \
              DB_NAME="regress_${GITHUB_RUN_ID:-local}" \
              bash .github/scripts/db-regression.sh > "result-$ver.tsv" || true

            docker rm -f "$name" >/dev/null 2>&1 || true

            # Пустая выдача — это «прогон не состоялся», а НЕ «провалов нет».
            # Прежняя редакция печатала «провалов нет» после того, как
            # контейнер вовсе не поднялся: grep не нашёл файла, ветка else
            # отрапортовала чистоту. Подмена «не удалось посмотреть» на
            # «посмотрел и там пусто» — против неё весь набор и написан.
            if [ ! -s "result-$ver.tsv" ]; then
              echo "::error::выдачи $ver нет — прогон не состоялся"
              return 1
            fi
            cat "result-$ver.tsv"
          }

          rc=0
          echo "## Регресс $BASELINE против $CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
          for v in "$BASELINE" "$CANDIDATE"; do
            echo "::group::$v"
            run_one "$v" || rc=1
            echo "::endgroup::"
            {
              echo "### $v"
              echo '```'
              cat "result-$v.tsv" 2>/dev/null || echo "(выдачи нет)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$rc"

      # Самоконтроль набора. Если кейс, обязанный краснеть, зелёный — весь
      # прогон недостоверен, и это единственное условие, при котором шаг падает.
      # Иначе «регресс зелёный» может означать «набор ничего не смотрит».
      - name: Проверить, что набор вообще способен видеть поломку
        if: always()
        run: |
          rc=0
          for f in result-*.tsv; do
            [ -e "$f" ] || { echo "::error::нет ни одной выдачи — проверять нечего"; exit 1; }
            line=$(grep -P '^selfcheck\.detects_missing_index\t' "$f" || true)
            if [ -z "$line" ]; then
              echo "::error::$f: кейс самоконтроля не отработал — вердиктам верить нельзя"; rc=1; continue
            fi
            case "$line" in
              *"$(printf '\t')PASS$(printf '\t')"*) echo "$f: самоконтроль в порядке" ;;
              *) echo "::error::$f: набор не видит заведомой поломки: $line"; rc=1 ;;
            esac
          done
          exit "$rc"

      # DBU-15: значок задания обязан нести смысл САМ, без чтения лога.
      #
      # Логи этого раннера теряются (замерено 30.08.2026: задание 14626 —
      # «No log file found», статус зелёный). Пока вердикты жили только в логе,
      # потерянный лог делал прогон неотличимым от непроведённого.
      #
      # Сверяется не «есть ли провалы», а совпадает ли картина с известной. На
      # версии-КАНДИДАТЕ расхождение не роняет задание: чужой релиз не должен
      # блокировать нашу работу — там оно только предупреждение. На версии,
      # НА КОТОРОЙ МЫ РАБОТАЕМ, расхождение красит задание: это наш дефект или
      # наша же починка, доехавшая сверху.
      - name: Сверить картину с известными провалами
        if: always()
        run: |
          rc=0
          bash .github/scripts/db-regression-diff-known.sh \
            "$BASELINE" "result-$BASELINE.tsv" || rc=1
          bash .github/scripts/db-regression-diff-known.sh \
            "$CANDIDATE" "result-$CANDIDATE.tsv" \
            || echo "::warning::кандидат разошёлся с известной картиной — это повод посмотреть, а не повод падать"
          exit "$rc"

      # Найденные расхождения называются поимённо. «Регресс упал» без указания
      # кейса бесполезен: именно так однажды пришлось поднимать полный лог
      # раннера, чтобы понять, что упало не из-за правки.
      - name: Назвать провалившиеся кейсы
        if: always()
        run: |
          for f in result-*.tsv; do
            [ -e "$f" ] || continue
            fails=$(grep -P '\tFAIL\t' "$f" || true)
            if [ -n "$fails" ]; then
              echo "::warning::$f — провалившиеся кейсы:"
              printf '%s\n' "$fails" | while IFS= read -r l; do echo "::warning::  $l"; done
            else
              echo "$f: провалов нет (кейсов в выдаче: $(grep -c . "$f"))"
            fi
          done

      # Дифф отвечает на вопрос, ради которого набор и заведён: что ИЗМЕНИЛОСЬ
      # между версиями. Кейсы OBSERVE верного ответа не знают — про них можно
      # судить только сравнением, и молчаливое изменение грамматики видно
      # именно здесь (ровно так однажды пропала форма DELETE EDGE).
      - name: Сравнить версии
        if: always()
        run: |
          a="result-$BASELINE.tsv"; b="result-$CANDIDATE.tsv"
          if [ ! -s "$a" ] || [ ! -s "$b" ]; then
            echo "::warning::готова не обе выдачи — сравнивать не с чем. Это НЕ значит «различий нет»."
            exit 0
          fi
          {
            echo "### Дифф $BASELINE → $CANDIDATE"
            echo '```diff'
            diff "$a" "$b" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if diff -q "$a" "$b" >/dev/null; then
            echo "поведение версий совпадает по всем кейсам набора"
          else
            echo "::warning::поведение версий РАЗЛИЧАЕТСЯ — см. сводку прогона"
          fi
