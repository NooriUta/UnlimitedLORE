name: LORE v1 freeze guard

# SPRINT_UXR_S3_V2_INFRA/S3-10, решение D-2026-UXR-V2-FOLDER-V1-FROZEN:
# LORE v1 (src/, сервис lore-app) заморожен, новая работа идёт в web-next/.
# PR в develop, трогающий src/**, без метки v1-hotfix — ПРЕДУПРЕЖДЕНИЕ, не блок:
# ::warning:: на каждый файл, блок в сводке шага, счёт тестовых/продуктовых
# файлов. Решение владелицы 07.11.2026: «ставь не обязательным, но чтобы потом
# не забыть» (первый же тестовый PR #854 упёрся в красный гард). Вернуть блок
# или снять гард — разбор в SPRINT_UXR_S8_SWITCH/S8-06.
#
# Отдельный workflow, а не job в frontend-ci.yml: проверка должна
# перезапускаться при навешивании/снятии метки (labeled/unlabeled). Будь она
# частью frontend-ci, каждое такое событие перегоняло бы весь фронтовый CI, а
# прогон по событию метки ещё и перезаписывал бы статус build свежим (возможно,
# зелёным) — красная сборка могла бы «отмыться» навешиванием метки.
#
# Только PR в develop: промоушн develop→preprod→main несёт правку, уже
# прошедшую этот гард (с меткой — на исходном PR).
#
# Метка ищется в payload события (labels PR). Хотфикс v1 после мержа
# выкатывается вручную: LORE CD, service=frontend (по пушу v1 не выкатывается).
on:
  pull_request:
    branches: [ "develop" ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  guard:
    runs-on: lore-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # дифф base...HEAD

      # Не вычислился дифф — громкое «НЕ ПРОВЕРЕНА» (::warning:: + сводка):
      # «не проверено» ≠ «src/ не тронут», но и это не блок (S8-06).
      - name: src/ (LORE v1) не тронут без метки v1-hotfix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/ci-scope.sh guard-v1
