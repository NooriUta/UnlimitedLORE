name: LORE migration snapshot (prod → preprod) and model-migration run

# SPRINT_LORE_OWN_HOST/OH-MIG-SNAPSHOT-WF — для переезда на новую модель
# (SPRINT_LORE_MODEL_DOCS_TIDY/MIG-01). Только ручной запуск.
#
#   action=snapshot — scripts/migration-snapshot.sh: свежий BACKUP прода (только чтение,
#                     кредом прод-бэкенда, как migrate-live-check), sha256, счёт KnowSprint /
#                     KnowTask / KnowPhase, развёртывание на препроде отдельной базой
#                     migration_src_<дата>. Имя занято — отказ.
#   action=migrate  — конвейер scripts/model-migration/ из ветки code_ref (по умолчанию develop)
#                     на препроде: источник → приёмник, этап stage; логика —
#                     .github/scripts/model-migration-run.sh. Этап full (MIG-01, выкатка 1.18 на
#                     препрод) — как tools/run/ryzen-full-all.sh: connect --create-dst, два прогона
#                     transfer → edges → dst-fingerprint и сверка отпечатков. Файл решений — decisions
#                     (по умолчанию scripts/model-migration/rules/decisions.lore.json). Приёмник
#                     препрода — migration_dst_preprod: проходит и ворота препрода (*_preprod), и
#                     сторож переноса (migration_dst*).
#                     Доступ — секреты MIG_DB_USER / MIG_DB_PASSWORD (учётка препрод-ArcadeDB,
#                     вносит владелица или CICDGitHub); секретов нет — шаг отвечает BLOCKED и
#                     называет, что завести. Файл доступа собирается во временный каталог и удаляется.
#                     Приёмник не может быть system_aida_lore* и не может совпасть с источником.
#
# Первый запуск каждого действия — только по прямому слову владелицы.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'snapshot — снимок прода на препрод; migrate — прогон конвейера'
        required: true
        type: choice
        options: ['snapshot', 'migrate']
      name:
        description: 'snapshot: имя базы-копии (пусто = migration_src_<дата UTC>); migrate: база-источник'
        required: false
        default: ''
        type: string
      dest:
        description: 'migrate: база-приёмник'
        required: false
        default: 'migration_dst_preprod'
        type: string
      stage:
        description: 'migrate: этап'
        required: false
        default: 'dry-run'
        type: choice
        options: ['dry-run', 'transfer', 'transfer-edges', 'orphan-census', 'full']
      reset:
        description: 'migrate/transfer: очистить непустой приёмник (--reset)'
        required: false
        default: false
        type: boolean
      code_ref:
        description: 'migrate: ветка или SHA кода конвейера'
        required: false
        default: 'develop'
        type: string
      decisions:
        description: 'migrate: файл решений (путь в репозитории)'
        required: false
        default: 'scripts/model-migration/rules/decisions.lore.json'
        type: string

concurrency:
  group: lore-migration-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    if: inputs.action == 'snapshot'
    runs-on: ubuntu-latest
    env:
      LORE_HOST: lore-host.seidrstudio.pro
      LORE_HOST_USER: nooriuta
      LORE_HOST_FP: SHA256:dp7oLAGQkIQ+fcFOuwqhnqoLOB0VkWom2ibmuzDG6YA
      NAME: ${{ inputs.name }}
      REPORT_DIR: ${{ github.workspace }}/migration-snapshot-report
    steps:
      - uses: actions/checkout@v7

      - name: SSH-ключ CD и закреплённый ключ хоста
        env:
          LORE_HOST_SSH_KEY: ${{ secrets.LORE_HOST_SSH_KEY }}
        run: bash .github/scripts/lore-host-deploy.sh ssh

      - name: Снимок прода → препрод
        run: bash scripts/migration-snapshot.sh

      - name: Отчёт — артефактом
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: migration-snapshot-${{ github.run_id }}
          path: migration-snapshot-report/

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/lore_host

      - name: Уборка контейнеров прогона
        if: always()
        run: bash .github/scripts/ci-teardown.sh "${{ github.run_id }}"

  migrate:
    if: inputs.action == 'migrate'
    runs-on: ubuntu-latest
    env:
      MIG_SRC_DB: ${{ inputs.name }}
      MIG_DST_DB: ${{ inputs.dest }}
      STAGE: ${{ inputs.stage }}
      RESET: ${{ inputs.reset }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.code_ref }}

      # Логика сторожа и конвейера — в .github/scripts/model-migration-run.sh (тесты:
      # web-next/src/preprod-118-switch.test.ts). Сторож — отдельным шагом, чтобы отказ по имени
      # базы был виден до обращения к секретам.
      - name: Сторож баз (дублирует env.mjs)
        env:
          GUARD_ONLY: "true"
        run: bash .github/scripts/model-migration-run.sh

      # Секретов MIG_DB_USER / MIG_DB_PASSWORD нет — BLOCKED (код 2) с именами, что завести;
      # конвейер не запускается. Этап full — два прогона transfer → edges → dst-fingerprint и сверка.
      - name: Конвейер model-migration
        env:
          MIG_DB_USER: ${{ secrets.MIG_DB_USER }}
          MIG_DB_PASSWORD: ${{ secrets.MIG_DB_PASSWORD }}
          MIG_DECISIONS: ${{ inputs.decisions }}
        run: bash .github/scripts/model-migration-run.sh

      - name: Отчёт — артефактом
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: model-migration-${{ inputs.stage }}-${{ github.run_id }}
          path: migration-report/
