name: LORE Release (publish on tag)

# Публикация Release по пушу тега.
#
# Зачем понадобилось. Теги v1.0.50…v1.0.54 были запушены, а объектов Release для
# них не создано — список опубликованных обрывался на v1.0.49. Витрина при этом
# писала «97 коммитов develop с этого выпуска», то есть показывала состояние
# двухдневной давности при сделанной и оттегированной работе (MIG-26).
#
# Автоматизации не существовало НИКОГДА: до переезда стенд жил на ноутбуке,
# релизы публиковались руками, и это было нормально. С появлением сервера и
# раннеров ручной шаг стал единственным, который никто не выполняет.
#
# Тег — и есть событие релиза, поэтому триггер по тегу, а не по ветке: релизы
# режутся на develop, и привязка к ветке ничего бы не дала.

on:
  push:
    tags: ["v*"]
  # Ручной перезапуск (MIR-01): rerun-эндпоинта у Forgejo 15 в API нет, а
  # «перезапустить прогон» — штатный ответ и на пропавший RELEASE-файл, и на
  # замену GH_MIRROR_TOKEN. Оба шага идемпотентны (существующий релиз не
  # трогается, push тегов up-to-date безвреден), поэтому повторный прогон по
  # ЛЮБОМУ уже выпущенному тегу безопасен. Заодно dispatch-прогон ПРОВЕРЯЕТ
  # токен зеркала громко — см. шаг Verify mirror token ниже.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для (пере)публикации, напр. v1.0.58'
        required: true
        type: string

permissions:
  contents: write        # нужно для создания Release

concurrency:
  group: lore-release-${{ github.ref }}
  cancel-in-progress: false   # публикация не гонка — очередь, а не отмена

jobs:
  publish:
    name: Publish Forgejo release from RELEASE-<tag>.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ── Проверка токена зеркала — ТОЛЬКО на ручном прогоне ─────────────────
      # Замена GH_MIRROR_TOKEN иначе непроверяема до следующего релиза: mirror-шаг
      # под continue-on-error, и битый токен там виден только в логе, который
      # снаружи не читается (нет API). Здесь отказ КРАСИТ прогон: скоупы classic
      # PAT читаются read-only из заголовка X-OAuth-Scopes; без workflow push
      # релиза, задевшего .github/workflows/*, будет отклонён целиком (MIR-01).
      # Вердикт уходит в Telegram ВСЕГДА (best-effort): лог прогона снаружи не
      # читается (нет API у Forgejo 15, веб — только под логином), и без этого
      # «проверка токена» вырождалась в «прогон красный, а почему — идите в UI».
      # Без `shell: bash` и `set -u` НАМЕРЕННО: два ручных прогона умирали с
      # exitcode 1 до единой строки вывода и до Telegram, при том что секреты в
      # dispatch-прогоны доезжают (проверено ручным CD-прогоном — уведомление
      # пришло). Работающий notify-шаг lore-cd отличался ровно этими двумя
      # строками — повторяем его форму. Пинг первой строкой — детектор «скрипт
      # вообще стартовал»: длина токена, не сам токен.
      - name: Verify mirror token (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_REPO:  ${{ secrets.GH_MIRROR_REPO }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${TG_TOKEN:-}" ]; then
            curl -sf --max-time 10 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' \
              -d "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"probe: verify-шаг стартовал, длина GH_MIRROR_TOKEN=${#GH_TOKEN}\"}" || true
          fi
          FAIL=""
          NOTE=""
          if [ -z "${GH_TOKEN:-}" ]; then
            FAIL="GH_MIRROR_TOKEN не задан (Forgejo: Settings -> Actions -> Secrets, репо AIDA/UnlimitedLORE)"
          else
            code=$(curl -s -m 20 -o /tmp/user.json -w '%{http_code}' -D /tmp/hdr.txt \
              -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user) || code="000"
            if [ "$code" != "200" ]; then
              FAIL="токен зеркала не аутентифицируется (HTTP $code): $(head -c 200 /tmp/user.json 2>/dev/null)"
            else
              SCOPES=$(grep -i '^x-oauth-scopes:' /tmp/hdr.txt | cut -d: -f2- | tr -d ' \r')
              if [ -n "$SCOPES" ]; then
                # classic PAT: скоупы читаются из заголовка — проверяем оба.
                case ",$SCOPES," in *,repo,*) : ;; *)
                  FAIL="classic PAT без scope repo (скоупы: $SCOPES) — пуш зеркала не пройдёт" ;;
                esac
                if [ -z "$FAIL" ]; then case ",$SCOPES," in *,workflow,*) NOTE="classic PAT, скоупы [$SCOPES]" ;; *)
                  FAIL="classic PAT БЕЗ scope workflow (скоупы: $SCOPES) — релиз, задевший .github/workflows/*, GitHub отклонит целиком (MIR-01)" ;;
                esac; fi
              else
                # fine-grained PAT: заголовка скоупов НЕТ by design — скоупы не
                # проверить read-only. Функциональная проба: доступ к самому репо.
                if git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO:-NooriUta/UnlimitedLORE}.git" HEAD >/dev/null 2>&1; then
                  NOTE="fine-grained PAT: аутентификация и чтение репо ок. Права Contents/Workflows (Read and write) read-only НЕ проверяются — их докажет первый реальный пуш релиза"
                else
                  FAIL="fine-grained PAT аутентифицируется, но НЕ имеет доступа к ${GH_REPO:-NooriUta/UnlimitedLORE} — проверьте Repository access в настройках токена"
                fi
              fi
            fi
          fi
          if [ -z "$FAIL" ]; then
            VERDICT="✅ GH_MIRROR_TOKEN исправен: $NOTE"
          else
            VERDICT="❌ GH_MIRROR_TOKEN: $FAIL"
          fi
          echo "$VERDICT"
          if [ -n "${TG_TOKEN:-}" ]; then
            jq -n --arg chat "$TG_CHAT" --arg text "Проверка токена зеркала (ручной прогон):
          $VERDICT" '{"chat_id":$chat,"text":$text}' > /tmp/tg.json
            curl -sf --max-time 10 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" -d @/tmp/tg.json || echo "::warning::telegram недоступен"
          fi
          if [ -n "$FAIL" ]; then echo "::error::$FAIL"; exit 1; fi

      - name: Publish
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -u
          # dispatch-прогон приходит с веткой в GITHUB_REF — тег берём из input.
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          FILE="RELEASE-${TAG}.md"

          # Адрес API — тот же, по которому в этом же job'е ходит actions/checkout
          # (http://forgejo:3000). Публичное имя из github.server_url изнутри
          # раннера может не резолвиться: раннер живёт в сети forgejo-net.
          API="http://forgejo:3000/api/v1/repos/${GITHUB_REPOSITORY}"

          # ТЕЛО ОБЯЗАТЕЛЬНО. Пустой релиз хуже отсутствующего: он выглядит
          # опубликованным, и пропажу описания замечают через недели. Тот же
          # принцип, что в lore-cd.yml — проверять факт, а не код возврата.
          if [ ! -f "$FILE" ]; then
            echo "::error::нет $FILE — релиз $TAG не публикуется. Опишите релиз в этом файле и перезапустите: пустое тело выглядит опубликованным и прячет пропажу."
            exit 1
          fi

          # Идемпотентность: тег могли перезапушить, а workflow — перезапустить
          # вручную. Существующий релиз НЕ трогаем: тело могли отредактировать
          # руками, и повторная запись затёрла бы правку.
          code=$(curl -s -o /tmp/existing.json -w '%{http_code}' \
            -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG")
          if [ "$code" = "200" ]; then
            echo "релиз $TAG уже опубликован — ничего не меняю"
            exit 0
          fi

          # Первая строка файла — заголовок релиза, остальное — тело.
          TITLE=$(head -1 "$FILE" | sed 's/^#\+[[:space:]]*//')
          [ -z "$TITLE" ] && TITLE="$TAG"

          # jq собирает JSON сам: тело — многострочный markdown с кавычками и
          # обратными слэшами, ручная сборка строки его бы поломала.
          jq -n --arg tag "$TAG" --arg name "$TITLE" --rawfile body "$FILE" \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}' \
            > /tmp/release.json

          code=$(curl -s -o /tmp/created.json -w '%{http_code}' -X POST \
            -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/release.json "$API/releases")

          if [ "$code" != "201" ]; then
            echo "::error::создание релиза $TAG вернуло HTTP $code"
            head -c 500 /tmp/created.json
            exit 1
          fi
          echo "релиз $TAG опубликован: $TITLE"

      # ── Зеркало GitHub ────────────────────────────────────────────────────
      # Последнее звено цепочки develop → preprod → main (tag) → mirror.
      #
      # Forgejo — источник истины и место CI/CD; GitHub остаётся ЗЕРКАЛОМ
      # РЕЛИЗОВ (Actions там отключены — аккаунт в billing-локе, прогоны не
      # запускаются вовсе). Поэтому льём только релизное: ветку main и сам тег,
      # а не ветки разработки — иначе зеркало копило бы dev-шум, ради которого
      # оно не заводилось.
      #
      # Раньше этого шага не было совсем: теги и main уезжали в GitHub руками,
      # и зеркало регулярно отставало (проверено 2026-07-16 — объекты Release
      # обрывались на v1.0.45 при существующих тегах до v1.0.49).
      #
      # Токен НЕ обязателен: без него шаг честно предупреждает и выходит, а не
      # роняет уже опубликованный релиз. Красный релиз из-за недоступного
      # зеркала — худший обмен, чем отставшее зеркало, о котором сказано вслух.
      - name: Mirror main + tag to GitHub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_REPO: ${{ secrets.GH_MIRROR_REPO }}   # напр. NooriUta/UnlimitedLORE
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -u
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"

          if [ -z "${GH_TOKEN:-}" ] || [ -z "${GH_REPO:-}" ]; then
            echo "::warning::зеркало GitHub пропущено — не заданы GH_MIRROR_TOKEN/GH_MIRROR_REPO (Forgejo: Settings -> Actions -> Secrets). Тег $TAG останется только в Forgejo."
            exit 0
          fi

          # Полная история нужна для push ветки: checkout по умолчанию мелкий,
          # и GitHub отверг бы неполный набор объектов.
          git fetch --unshallow origin 2>/dev/null || git fetch --prune origin
          git fetch origin main:refs/remotes/origin/main --force
          # dispatch-прогон стартует с ветки: тега в мелком checkout нет — добираем
          # явно, иначе is-ancestor ниже молча пропустил бы зеркалирование.
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force 2>/dev/null || true

          # Тег обязан быть В main: зеркало отражает релизы, а не произвольные
          # точки. Тег мимо main означает, что релиз срезан не оттуда — это
          # ошибка процесса, и молча зеркалить её нельзя.
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "::warning::тег $TAG не содержится в main — зеркалирование пропущено. Сначала влейте preprod в main, потом ставьте тег."
            exit 0
          fi

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
            "refs/remotes/origin/main:refs/heads/main" "refs/tags/$TAG"
          echo "зеркало обновлено: main + $TAG -> github.com/${GH_REPO}"

          # ── Release-объект в GitHub ────────────────────────────────────────
          # git push переносит ТОЛЬКО теги и ветки. Release — отдельная сущность
          # API поверх тега, пушем она не создаётся никогда.
          #
          # Из-за этого зеркало годами держало актуальные теги при пустой
          # странице релизов: код был на месте, а описания — нет. Обнаружилось
          # 2026-07-22, когда владелец открыла /releases и увидела обрыв на
          # v1.0.49 при тегах до v1.0.57. Пятнадцать пропущенных залиты разово,
          # этот шаг закрывает дыру на будущее.
          #
          # Существующий релиз НЕ трогаем по той же причине, что и в Forgejo:
          # тело могли отредактировать руками.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GH_REPO}/releases/tags/$TAG")
          if [ "$code" = "200" ]; then
            echo "релиз $TAG в зеркале уже есть — не трогаю"
            exit 0
          fi

          # Тело берём из того же RELEASE-<tag>.md, что ушёл в Forgejo:
          # два источника разошлись бы при первой же правке одного из них.
          #
          # FILE и TITLE вычисляются ЗАНОВО: каждый шаг `run:` — отдельный
          # процесс, переменные предыдущего сюда не переходят. Понадеявшись на
          # них, шаг получил бы пустое имя и путь — и упал бы не на том месте,
          # где ошибка.
          FILE="RELEASE-${TAG}.md"
          TITLE=$(head -1 "$FILE" | sed 's/^#\+[[:space:]]*//')
          [ -z "$TITLE" ] && TITLE="$TAG"

          jq -n --arg tag "$TAG" --arg name "$TITLE" --rawfile body "$FILE" \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}' \
            > /tmp/gh-release.json

          code=$(curl -s -o /tmp/gh-created.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            --data-binary @/tmp/gh-release.json \
            "https://api.github.com/repos/${GH_REPO}/releases")

          if [ "$code" = "201" ]; then
            echo "релиз $TAG опубликован в зеркале"
          else
            # Предупреждение, а не отказ: релиз в Forgejo уже опубликован, и
            # ронять его из-за зеркала — худший обмен. Но молчать нельзя, иначе
            # витрина снова отстанет незаметно.
            echo "::warning::публикация релиза $TAG в зеркале вернула HTTP $code — тег и main доехали, описание нет"
            head -c 300 /tmp/gh-created.json
          fi
