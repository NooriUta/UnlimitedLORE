name: LORE Release (publish on tag)

# Публикация Release по пушу тега.
#
# Зачем понадобилось. Теги v1.0.50…v1.0.54 были запушены, а объектов Release для
# них не создано — список опубликованных обрывался на v1.0.49. Витрина при этом
# писала «97 коммитов develop с этого выпуска», то есть показывала состояние
# двухдневной давности при сделанной и оттегированной работе (MIG-26).
#
# Автоматизации не существовало НИКОГДА: до переезда стенд жил на ноутбуке,
# релизы публиковались руками, и это было нормально. С появлением сервера и
# раннеров ручной шаг стал единственным, который никто не выполняет.
#
# Тег — и есть событие релиза, поэтому триггер по тегу, а не по ветке: релизы
# режутся на develop, и привязка к ветке ничего бы не дала.

on:
  push:
    tags: ["v*"]
  # Ручной перезапуск (MIR-01): rerun-эндпоинта у Forgejo 15 в API нет, а
  # «перезапустить прогон» — штатный ответ и на пропавший RELEASE-файл, и на
  # замену GH_MIRROR_TOKEN. Оба шага идемпотентны (существующий релиз не
  # трогается, push тегов up-to-date безвреден), поэтому повторный прогон по
  # ЛЮБОМУ уже выпущенному тегу безопасен. Заодно dispatch-прогон ПРОВЕРЯЕТ
  # токен зеркала громко — см. шаг Verify mirror token ниже.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для (пере)публикации, напр. v1.0.58'
        required: true
        type: string

permissions:
  contents: write        # нужно для создания Release

concurrency:
  group: lore-release-${{ github.ref }}
  cancel-in-progress: false   # публикация не гонка — очередь, а не отмена

jobs:
  publish:
    name: Publish Forgejo release from RELEASE-<tag>.md
    # AL-88 (2026-07-30): пробовали выделенный раннер lore-only — см. тот же
    # комментарий в backend-ci.yml про необъяснённый сбой. Откачено к общему пулу.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ── Проверка токена зеркала — ТОЛЬКО на ручном прогоне ─────────────────
      # Замена GH_MIRROR_TOKEN иначе непроверяема до следующего релиза: mirror-шаг
      # под continue-on-error, и битый токен там виден только в логе, который
      # снаружи не читается (нет API). Здесь отказ КРАСИТ прогон: скоупы classic
      # PAT читаются read-only из заголовка X-OAuth-Scopes; без workflow push
      # релиза, задевшего .github/workflows/*, будет отклонён целиком (MIR-01).
      # Вердикт уходит в Telegram ВСЕГДА (best-effort): лог прогона снаружи не
      # читается (нет API у Forgejo 15, веб — только под логином), и без этого
      # «проверка токена» вырождалась в «прогон красный, а почему — идите в UI».
      # Без `shell: bash` и `set -u` НАМЕРЕННО: два ручных прогона умирали с
      # exitcode 1 до единой строки вывода и до Telegram, при том что секреты в
      # dispatch-прогоны доезжают (проверено ручным CD-прогоном — уведомление
      # пришло). Работающий notify-шаг lore-cd отличался ровно этими двумя
      # строками — повторяем его форму. Пинг первой строкой — детектор «скрипт
      # вообще стартовал»: длина токена, не сам токен.
      # SE-12: проверка токена больше НЕ ПРЕГРАЖДАЕТ публикацию. Ручной прогон
      # 15866 (11.09.2026) умер здесь за четыре секунды до единой строки вывода,
      # и релиз v1.10.0 пришлось публиковать руками через API. Публикация в
      # Forgejo и пуш в зеркало — разные шаги с разными предусловиями: токен
      # зеркала не имеет права мешать выложить описание релиза. Отказ при этом
      # по-прежнему КРАСИТ прогон — вердиктом в последнем шаге джоба.
      - name: Verify mirror token (workflow_dispatch only)
        id: verify_mirror_token
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_REPO:  ${{ secrets.GH_MIRROR_REPO }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # SE-12: отметки «докуда дошли». Шаг дважды умирал с кодом 1 БЕЗ единой
          # строки вывода (задания 15866 и 18008), и причину по логу назвать
          # нельзя — отсутствие вывода не отличает «скрипт не начался» от
          # «упал на первой команде». Отметки это различают.
          echo "[verify] шаг начался"
          if [ -n "${TG_TOKEN:-}" ]; then
            curl -sf --max-time 10 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' \
              -d "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"probe: verify-шаг стартовал, длина GH_MIRROR_TOKEN=${#GH_TOKEN}\"}" \
              && echo "[verify] telegram-проба: отправлено" \
              || echo "::warning::[verify] telegram-проба НЕ отправлена — api.telegram.org недоступен или отказал"
          fi
          # 04.11.2026: здесь печаталось «проба пройдена» при любом исходе (curl
          # стоял под `|| true`), и две недели неработающего Telegram выглядели
          # как работающий. Отметка «докуда дошли» осталась, исход — выше, честно.
          echo "[verify] после telegram-пробы"
          FAIL=""
          NOTE=""
          if [ -z "${GH_TOKEN:-}" ]; then
            FAIL="GH_MIRROR_TOKEN не задан (Forgejo: Settings -> Actions -> Secrets, репо AIDA/UnlimitedLORE)"
          else
            code=$(curl -s -m 20 -o /tmp/user.json -w '%{http_code}' -D /tmp/hdr.txt \
              -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user) || code="000"
            echo "[verify] /user ответил $code"
            if [ "$code" != "200" ]; then
              # Не приговор: fine-grained PAT, выданный на один репозиторий,
              # может не иметь доступа к /user, оставаясь годным для пуша.
              # Судим по РАБОЧЕЙ пробе — доступу к самому репозиторию.
              if git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO:-NooriUta/UnlimitedLORE}.git" HEAD >/dev/null 2>&1; then
                NOTE="/user недоступен (HTTP $code), но репозиторий зеркала читается — для пуша этого достаточно"
              else
                FAIL="токен зеркала не аутентифицируется (HTTP $code) И репозиторий зеркала не читается: $(head -c 200 /tmp/user.json 2>/dev/null)"
              fi
            else
              SCOPES=$(grep -i '^x-oauth-scopes:' /tmp/hdr.txt | cut -d: -f2- | tr -d ' \r')
              if [ -n "$SCOPES" ]; then
                # classic PAT: скоупы читаются из заголовка — проверяем оба.
                case ",$SCOPES," in *,repo,*) : ;; *)
                  FAIL="classic PAT без scope repo (скоупы: $SCOPES) — пуш зеркала не пройдёт" ;;
                esac
                if [ -z "$FAIL" ]; then case ",$SCOPES," in *,workflow,*) NOTE="classic PAT, скоупы [$SCOPES]" ;; *)
                  FAIL="classic PAT БЕЗ scope workflow (скоупы: $SCOPES) — релиз, задевший .github/workflows/*, GitHub отклонит целиком (MIR-01)" ;;
                esac; fi
              else
                # fine-grained PAT: заголовка скоупов НЕТ by design — скоупы не
                # проверить read-only. Функциональная проба: доступ к самому репо.
                if git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO:-NooriUta/UnlimitedLORE}.git" HEAD >/dev/null 2>&1; then
                  NOTE="fine-grained PAT: аутентификация и чтение репо ок. Права Contents/Workflows (Read and write) read-only НЕ проверяются — их докажет первый реальный пуш релиза"
                else
                  FAIL="fine-grained PAT аутентифицируется, но НЕ имеет доступа к ${GH_REPO:-NooriUta/UnlimitedLORE} — проверьте Repository access в настройках токена"
                fi
              fi
            fi
          fi
          if [ -z "$FAIL" ]; then
            VERDICT="✅ GH_MIRROR_TOKEN исправен: $NOTE"
          else
            VERDICT="❌ GH_MIRROR_TOKEN: $FAIL"
          fi
          echo "$VERDICT"
          if [ -n "${TG_TOKEN:-}" ]; then
            jq -n --arg chat "$TG_CHAT" --arg text "Проверка токена зеркала (ручной прогон):
          $VERDICT" '{"chat_id":$chat,"text":$text}' > /tmp/tg.json
            curl -sf --max-time 10 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" -d @/tmp/tg.json || echo "::warning::telegram недоступен"
          fi
          if [ -n "$FAIL" ]; then echo "::error::$FAIL"; exit 1; fi

      - name: Publish
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -u
          # dispatch-прогон приходит с веткой в GITHUB_REF — тег берём из input.
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          FILE="RELEASE-${TAG}.md"

          # Адрес API — тот же, по которому в этом же job'е ходит actions/checkout
          # (http://forgejo:3000). Публичное имя из github.server_url изнутри
          # раннера может не резолвиться: раннер живёт в сети forgejo-net.
          API="http://forgejo:3000/api/v1/repos/${GITHUB_REPOSITORY}"

          # ТЕЛО ОБЯЗАТЕЛЬНО. Пустой релиз хуже отсутствующего: он выглядит
          # опубликованным, и пропажу описания замечают через недели. Тот же
          # принцип, что в lore-cd.yml — проверять факт, а не код возврата.
          if [ ! -f "$FILE" ]; then
            echo "::error::нет $FILE — релиз $TAG не публикуется. Опишите релиз в этом файле и перезапустите: пустое тело выглядит опубликованным и прячет пропажу."
            exit 1
          fi

          # Идемпотентность: тег могли перезапушить, а workflow — перезапустить
          # вручную. Существующий релиз НЕ трогаем: тело могли отредактировать
          # руками, и повторная запись затёрла бы правку.
          code=$(curl -s -o /tmp/existing.json -w '%{http_code}' \
            -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG")
          if [ "$code" = "200" ]; then
            echo "релиз $TAG уже опубликован — ничего не меняю"
            exit 0
          fi

          # Первая строка файла — заголовок релиза, остальное — тело.
          TITLE=$(head -1 "$FILE" | sed 's/^#\+[[:space:]]*//')
          [ -z "$TITLE" ] && TITLE="$TAG"

          # jq собирает JSON сам: тело — многострочный markdown с кавычками и
          # обратными слэшами, ручная сборка строки его бы поломала.
          jq -n --arg tag "$TAG" --arg name "$TITLE" --rawfile body "$FILE" \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}' \
            > /tmp/release.json

          code=$(curl -s -o /tmp/created.json -w '%{http_code}' -X POST \
            -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/release.json "$API/releases")

          if [ "$code" != "201" ]; then
            echo "::error::создание релиза $TAG вернуло HTTP $code"
            head -c 500 /tmp/created.json
            exit 1
          fi
          echo "релиз $TAG опубликован: $TITLE"

      # ── Зеркало GitHub ────────────────────────────────────────────────────
      # Последнее звено цепочки develop → preprod → main (tag) → mirror.
      #
      # Forgejo — источник истины и место CI/CD; GitHub остаётся ЗЕРКАЛОМ
      # РЕЛИЗОВ (Actions там отключены — аккаунт в billing-локе, прогоны не
      # запускаются вовсе). Поэтому льём только релизное: ветку main и сам тег,
      # а не ветки разработки — иначе зеркало копило бы dev-шум, ради которого
      # оно не заводилось.
      #
      # Раньше этого шага не было совсем: теги и main уезжали в GitHub руками,
      # и зеркало регулярно отставало (проверено 2026-07-16 — объекты Release
      # обрывались на v1.0.45 при существующих тегах до v1.0.49).
      #
      # Токен НЕ обязателен: без него шаг честно предупреждает и выходит, а не
      # роняет уже опубликованный релиз. Красный релиз из-за недоступного
      # зеркала — худший обмен, чем отставшее зеркало, о котором сказано вслух.
      - name: Mirror main + tag to GitHub
        id: mirror
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_REPO: ${{ secrets.GH_MIRROR_REPO }}   # напр. NooriUta/UnlimitedLORE
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -u
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"

          # ГЛАВНОЕ В ЭТОМ ШАГЕ: github.com идёт МИМО прокси.
          #
          # Раннер выдаёт джобам HTTP(S)_PROXY (split-tunnel xray на хосте), и
          # через него github.com не тянется вовсе. На v1.8.0 это стоило целого
          # зеркала: git push упал с «gnutls_handshake() failed: The TLS
          # connection was non-properly terminated», релиз в Forgejo вышел, а в
          # GitHub не уехало ничего.
          #
          # Измерено на ci-server 30.08.2026 парой, а не предположено:
          #   через прокси → тот же gnutls_handshake failed
          #   напрямую     → git ls-remote отдаёт HEAD
          # Тот же дефект тем же утром сорвал загрузку дистрибутива Gradle
          # (services.gradle.org редиректит на github.com): напрямую 140 МБ за
          # 79 с, через прокси ноль байт за 2.2 с.
          #
          # Снимаем переменные на весь шаг: и git push, и curl к api.github.com
          # ходят на тот же хост и ломались бы одинаково.
          unset https_proxy HTTPS_PROXY http_proxy HTTP_PROXY
          # Прокси мог быть прописан и в git-конфиге раннера, а не только в
          # окружении — тогда unset не спас бы. Гасим адресно для github.
          git config --global http.https://github.com/.proxy ""

          if [ -z "${GH_TOKEN:-}" ] || [ -z "${GH_REPO:-}" ]; then
            echo "::warning::зеркало GitHub пропущено — не заданы GH_MIRROR_TOKEN/GH_MIRROR_REPO (Forgejo: Settings -> Actions -> Secrets). Тег $TAG останется только в Forgejo."
            exit 0
          fi

          # Полная история нужна для push ветки: checkout по умолчанию мелкий,
          # и GitHub отверг бы неполный набор объектов.
          git fetch --unshallow origin 2>/dev/null || git fetch --prune origin
          git fetch origin main:refs/remotes/origin/main --force
          # dispatch-прогон стартует с ветки: тега в мелком checkout нет — добираем
          # явно, иначе is-ancestor ниже молча пропустил бы зеркалирование.
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force 2>/dev/null || true

          # Тег обязан быть В main: зеркало отражает релизы, а не произвольные
          # точки. Тег мимо main означает, что релиз срезан не оттуда — это
          # ошибка процесса, и молча зеркалить её нельзя.
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "::warning::тег $TAG не содержится в main — зеркалирование пропущено. Сначала влейте preprod в main, потом ставьте тег."
            exit 0
          fi

          # Отказ push'а обязан быть ВИДЕН. Шаг стоит под continue-on-error —
          # это верно (упавшее зеркало не должно ронять уже опубликованный
          # релиз), но без явной аннотации он давал ровно то, что случилось на
          # v1.8.0: git печатал fatal в лог, шаг «завершался», джоб оставался
          # зелёным, и релиз выглядел полностью выехавшим. Молчаливое зеркало
          # хуже отсутствующего: про отсутствующее хотя бы знают.
          if ! git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
                 "refs/remotes/origin/main:refs/heads/main" "refs/tags/$TAG"; then
            echo "::error::зеркало GitHub НЕ обновлено: git push на github.com/${GH_REPO} не прошёл. Тег $TAG и релиз в Forgejo на месте, наружу не уехало ничего. Первый подозреваемый — прокси: github.com через split-tunnel недоступен (проверено 30.08.2026), а этот шаг снимает proxy-переменные — если они вернулись из конфига раннера, снимите их и там."
            exit 1
          fi
          echo "зеркало обновлено: main + $TAG -> github.com/${GH_REPO}"

          # ── Release-объект в GitHub ────────────────────────────────────────
          # git push переносит ТОЛЬКО теги и ветки. Release — отдельная сущность
          # API поверх тега, пушем она не создаётся никогда.
          #
          # Из-за этого зеркало годами держало актуальные теги при пустой
          # странице релизов: код был на месте, а описания — нет. Обнаружилось
          # 2026-07-22, когда владелец открыла /releases и увидела обрыв на
          # v1.0.49 при тегах до v1.0.57. Пятнадцать пропущенных залиты разово,
          # этот шаг закрывает дыру на будущее.
          #
          # Существующий релиз НЕ трогаем по той же причине, что и в Forgejo:
          # тело могли отредактировать руками.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GH_REPO}/releases/tags/$TAG")
          if [ "$code" = "200" ]; then
            echo "релиз $TAG в зеркале уже есть — не трогаю"
            exit 0
          fi

          # Тело берём из того же RELEASE-<tag>.md, что ушёл в Forgejo:
          # два источника разошлись бы при первой же правке одного из них.
          #
          # FILE и TITLE вычисляются ЗАНОВО: каждый шаг `run:` — отдельный
          # процесс, переменные предыдущего сюда не переходят. Понадеявшись на
          # них, шаг получил бы пустое имя и путь — и упал бы не на том месте,
          # где ошибка.
          FILE="RELEASE-${TAG}.md"
          TITLE=$(head -1 "$FILE" | sed 's/^#\+[[:space:]]*//')
          [ -z "$TITLE" ] && TITLE="$TAG"

          jq -n --arg tag "$TAG" --arg name "$TITLE" --rawfile body "$FILE" \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}' \
            > /tmp/gh-release.json

          code=$(curl -s -o /tmp/gh-created.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            --data-binary @/tmp/gh-release.json \
            "https://api.github.com/repos/${GH_REPO}/releases")

          if [ "$code" = "201" ]; then
            echo "релиз $TAG опубликован в зеркале"
          else
            # Релиз в Forgejo уже опубликован, ронять его не нужно — и шаг его
            # не уронит (continue-on-error). Но отказ обязан покрасить прогон:
            # ненулевой код ловит «Вердикт зеркала GitHub» в конце (CIM-12 п.4).
            echo "::error::публикация релиза $TAG в зеркале вернула HTTP $code — тег и main доехали, описание нет"
            head -c 300 /tmp/gh-created.json
            exit 1
          fi

      # ── Оповещение о релизе (TG-01, хвост) ─────────────────────────────────
      # Telegram в этом файле раньше был только про здоровье GH_MIRROR_TOKEN
      # (шаг Verify mirror token выше) — про сам факт «релиз X вышел» файл
      # молчал вовсе, хотя lore-cd.yml оповещает о каждом деплое на стенд.
      # Форма — та же, что у lore-cd.yml (secrets.TELEGRAM_TOKEN/CHAT_ID,
      # тихий no-op без них, 3 попытки, continue-on-error): работающий шаг
      # не переизобретаем.
      #
      # БЕЗ явного `if:` — намеренно, той же формы, что у шага Mirror выше.
      # `success()` (умолчательное условие) остаётся true после Mirror, даже
      # если ОН внутри вернул ненулевой код: `continue-on-error: true`
      # форсирует conclusion=success для целей этой проверки, только outcome
      # шага остаётся failure. Поэтому оповещение срабатывает, когда Publish
      # реально прошёл, независимо от исхода зеркала — а если Publish упал
      # (нет RELEASE-файла, ошибка API), шаг унаследованно не выполнится
      # вовсе: оповещать о несостоявшемся релизе было бы хуже, чем молчать.
      #
      # Нет дублирования с MIR-01/TG-03: прочитан весь файл целиком —
      # оповещения о самом релизе здесь не было ни в одной ветке этого шага.
      - name: Notify release
        id: notify_release
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_REPO:  ${{ secrets.GH_MIRROR_REPO }}
          PUBLIC_REPO: https://git.seidrstudio.pro/AIDA/UnlimitedLORE
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          [ -z "${TG_TOKEN:-}" ] && exit 0
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          FILE="RELEASE-${TAG}.md"
          [ -f "$FILE" ] || exit 0
          TITLE=$(head -1 "$FILE" | sed 's/^#\+[[:space:]]*//')
          [ -z "$TITLE" ] && TITLE="$TAG"
          # ВЕСЬ RELEASE-<tag>.md, без обрезки (владелец 04.11.2026: «хочу, чтобы
          # релиз выдавал весь release notes, без run, со всеми фичами»). Раньше
          # тело резалось на 3600 байт с пометкой «обрезано», и список изменений
          # терялся. Лимит Telegram — 4096 СИМВОЛОВ на сообщение, поэтому длинные
          # заметки уходят несколькими сообщениями (k/n), разрез по абзацам —
          # .github/scripts/tg-split.sh (самопроверка: --selftest). Ссылки на
          # прогон в сообщении нет — только на страницы релиза.
          bash .github/scripts/tg-split.sh --selftest
          # Разметка (05.11.2026, «не проходит твое форматирование в telegram
          # читать больно»): сообщение уходило без parse_mode, и Telegram
          # печатал «##», «**», обратные кавычки как текст. Теперь каждый кусок
          # переводится в Telegram-HTML; отверг HTML (400 can't parse entities) —
          # тот же текст без разметки, чтобы оповещение дошло в любом случае.
          bash .github/scripts/tg-format.sh --selftest
          tail -n +2 "$FILE" > /tmp/tg-body.md
          N=$(bash .github/scripts/tg-split.sh /tmp/tg-body.md /tmp/tg-parts 3700)
          FG_LINK="${PUBLIC_REPO}/releases/tag/${TAG}"
          GH_LINE=""
          GH_URL=""
          [ -n "${GH_REPO:-}" ] && GH_URL="https://github.com/${GH_REPO}/releases/tag/${TAG}"
          [ -n "$GH_URL" ] && GH_LINE=$(printf "\nGitHub: %s" "$GH_URL")
          FAILED=0

          # Основной путь (владелица 05.11.2026: «в телеграм создавать вот такие
          # HTML и писать кратко выложено ссылка и аттачем полноценное
          # описание»): короткая подпись + полное описание HTML-файлом. Кусками
          # текста — только запасной путь, если вложение не ушло.
          bash .github/scripts/release-html.sh --selftest
          DOC="/tmp/LORE-${TAG}.html"
          DOC_SENT=0
          if bash .github/scripts/release-html.sh "$FILE" "$DOC" "$TAG" "$FG_LINK" "$GH_URL"; then
            ESC_TITLE=$(printf '%s' "$TITLE" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
            CAPTION=$(printf '🏷️ <b>LORE %s опубликован</b>\n%s\n\nForgejo: %s%s\n\nПолное описание — в файле.' \
              "$TAG" "$ESC_TITLE" "$FG_LINK" "$GH_LINE")
            for attempt in 1 2 3; do
              code=$(curl -s --max-time 30 -o /tmp/tg-doc.json -w '%{http_code}' -X POST \
                   "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
                   --form-string "chat_id=${TG_CHAT}" --form-string "parse_mode=HTML" \
                   --form-string "caption=${CAPTION}" -F "document=@${DOC};type=text/html")
              if [ "$code" = "200" ]; then
                echo "[tg] release notification sent as caption + ${DOC##*/} (attempt $attempt)"
                DOC_SENT=1; break
              fi
              echo "::warning::[tg] sendDocument attempt $attempt/3 failed (HTTP $code): $(head -c 200 /tmp/tg-doc.json)"
              [ "$code" = "400" ] && break
              [ $attempt -lt 3 ] && sleep $((attempt * 5))
            done
          else
            echo "::warning::[tg] HTML-описание не собралось — отправляю текстом"
          fi
          [ $DOC_SENT = 1 ] && exit 0

          i=0
          for part in /tmp/tg-parts/part-*.txt; do
            i=$((i + 1))
            HEAD=$(printf "🏷️ LORE: релиз %s опубликован\n%s" "$TAG" "$TITLE")
            [ "$N" -gt 1 ] && HEAD=$(printf "%s (%d/%d)" "$HEAD" "$i" "$N")
            [ "$i" -gt 1 ] && HEAD=$(printf "🏷️ %s (%d/%d)" "$TAG" "$i" "$N")
            TAIL=""
            [ "$i" -eq "$N" ] && TAIL=$(printf "\n\nForgejo: %s%s" "$FG_LINK" "$GH_LINE")
            MSG=$(printf "%s\n\n%s%s" "$HEAD" "$(cat "$part")" "$TAIL")
            jq -n --arg chat "$TG_CHAT" --arg text "$(printf '%s' "$MSG" | bash .github/scripts/tg-format.sh html)" \
              '{"chat_id":$chat,"text":$text,"parse_mode":"HTML","disable_web_page_preview":true}' > /tmp/tg-release.json
            jq -n --arg chat "$TG_CHAT" --arg text "$(printf '%s' "$MSG" | bash .github/scripts/tg-format.sh plain)" \
              '{"chat_id":$chat,"text":$text,"disable_web_page_preview":true}' > /tmp/tg-release-plain.json
            sent=0
            for attempt in 1 2 3; do
              code=$(curl -s --max-time 10 -o /tmp/tg-resp.json -w '%{http_code}' -X POST \
                   "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                   -H "Content-Type: application/json" \
                   -d @/tmp/tg-release.json)
              if [ "$code" = "200" ]; then
                echo "[tg] release notification $i/$N sent as HTML (attempt $attempt)"
                sent=1; break
              fi
              if [ "$code" = "400" ]; then
                # Разметку не принял — не ретраим её, шлём без разметки.
                echo "::warning::[tg] $i/$N: Telegram отверг HTML ($(head -c 200 /tmp/tg-resp.json)) — отправляю без разметки"
                if curl -sf --max-time 10 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                     -H "Content-Type: application/json" -d @/tmp/tg-release-plain.json >/dev/null; then
                  echo "[tg] release notification $i/$N sent as plain text"
                  sent=1
                fi
                break
              fi
              echo "::warning::[tg] release-notify $i/$N attempt $attempt/3 failed (HTTP $code)"
              [ $attempt -lt 3 ] && sleep $((attempt * 5))
            done
            [ $sent = 1 ] || FAILED=1
          done
          # Отказ виден: шаг под continue-on-error, ненулевой код ловит
          # «Вердикт оповещения Telegram» в конце прогона.
          [ $FAILED = 0 ] || { echo "::error::[tg] оповещение о релизе $TAG не доставлено"; exit 1; }

      # SE-12: вердикт по токену зеркала — ПОСЛЕ публикации и последним.
      #
      # Так сохранены оба свойства: битый токен виден (прогон красный), но он
      # уже не способен помешать выложить релиз. Прежний порядок давал худшее
      # из двух: публикация не состоялась, а причина лежала в логе, который
      # снаружи не прочитать.
      - name: Вердикт токена зеркала
        if: ${{ always() && steps.verify_mirror_token.outcome == 'failure' }}
        run: |
          echo "::error::проверка токена зеркала НЕ прошла (см. шаг Verify mirror token выше)."
          echo "::error::Публикация при этом шла своим чередом — смотрите её шаг отдельно; зеркало GitHub могло не обновиться."
          exit 1

      # CIM-12 п.4: тот же приём для самого зеркала. На v1.13.0 (28.10) токен
      # протух, git push упал, а прогон по ТЕГУ остался зелёным: шаг Mirror под
      # continue-on-error, а «Вердикт токена» выше срабатывает только на
      # dispatch. Зеркало молча не уехало на неделю. Здесь — последним шагом,
      # уже после публикации и оповещения: релиз выложен, но прогон красный.
      # outcome (а не conclusion) — continue-on-error прячет отказ только в
      # conclusion. Пропуски по замыслу (нет секретов, тег мимо main) выходят
      # кодом 0 с ::warning:: и сюда не попадают.
      - name: Вердикт зеркала GitHub
        if: ${{ always() && steps.mirror.outcome == 'failure' }}
        run: |
          echo "::error::зеркало GitHub НЕ обновилось (см. шаг Mirror main + tag to GitHub). Релиз в Forgejo опубликован; после починки — dispatch lore-release.yml с tag=<тег>, он идемпотентен."
          exit 1

      # 04.11.2026: оповещение о релизе две недели не доходило (api.telegram.org
      # недоступен с ci-server — VPN-выход xray сломан), а прогоны были зелёными:
      # шаг под continue-on-error. Тот же приём, что у зеркала: релиз уже выложен,
      # но прогон красный, и отказ виден снаружи. Нет TELEGRAM_TOKEN — шаг выходит
      # кодом 0 и сюда не попадает.
      - name: Вердикт оповещения Telegram
        if: ${{ always() && steps.notify_release.outcome == 'failure' }}
        run: |
          echo "::error::оповещение о релизе в Telegram НЕ доставлено (см. шаг Notify release). Релиз опубликован; проверьте выход xray для api.telegram.org (~/xray/refresh-vpn.sh на ci-server)."
          exit 1
