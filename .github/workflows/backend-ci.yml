name: Backend CI

# Промоушн-ветки включены НАМЕРЕННО. Правило «мержить только по зелёному CI»
# (CLAUDE.md) без этого превращалось бы в пустой звук на самых ответственных
# переходах: PR develop→preprod и preprod→main не получали бы ни одного чека,
# и «зелёный» было бы просто нечему показать.
on:
  push:
    branches: [ "develop", "preprod" ]
  pull_request:
    branches: [ "develop", "preprod", "main" ]

jobs:
  build:
    # AL-88 (2026-07-30): пробовали выделенный раннер lore-only вместо общего
    # пула ci-server (очередь за Shuttle/Hound/aida-root на чужих прогонах) —
    # но на нём КАЖДЫЙ прогон падает сразу после «Point live-DB tests…» с
    # exitcode 1, хотя `set -x` трассировка шага показывает, что все команды
    # скрипта отработали БЕЗ ошибки (включая запись в $GITHUB_ENV) — сбоит
    # что-то в самом раннере ПОСЛЕ конца скрипта, причина не найдена за три
    # прогона (identical config.yml, identical image sha256:d85b420…, identical
    # resource limits, named-volume vs bind-mount — не помогло ни то, ни
    # другое). Раннеры lore-only/volva_only остаются зарегистрированы на
    # ci-server, но НЕ подключены сюда до отдельного расследования — иначе
    # каждый PR/промоушн этого репозитория красный без единой реальной причины
    # в самом коде.
    runs-on: ubuntu-latest
    # Пароль ArcadeDB для live-DB тестов приходит секретом, как в lore-cd.yml.
    # Раньше он был захардкожен в шаге ниже (dev-стенд, задокументирован в
    # docs/DEPLOYMENT.md). После переезда БД на ci-server это перестало быть
    # верным: пароль там свой. Секрет не задан — шаг ниже упадёт с внятным
    # объяснением, а не непрозрачными 500 из сидера.
    env:
      ARCADEDB_ROOT_PASSWORD: ${{ secrets.ARCADEDB_ROOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # См. подробный комментарий в frontend-ci.yml — там же зафиксировано, что
      # прокси на ci-server НУЖЕН (прямой выход деградирован: минуты вместо
      # секунд, apk add curl отваливается по таймауту) и что проверка сделана
      # TCP-коннектом намеренно: busybox wget через этот прокси получает
      # 400 Bad Request и HTTP-проба ложно объявила бы живой прокси мёртвым.
      # Здесь это критично вдвойне: ниже proxy-переменные ПРОБРАСЫВАЮТСЯ в
      # docker build как build-args — мёртвый прокси уронил бы и сборку образа.
      - name: Resolve a working proxy address (or drop it)
        run: bash .github/scripts/resolve-proxy.sh

      # Зеркало для gradle-шагов раннера. Ретрай ниже остаётся страховкой, но
      # успешный повтор теперь печатает ::notice — если повторы продолжатся уже
      # с зеркалом, значит сборка идёт мимо него, и это будет видно сразу.
      # Публичные репозитории остаются вторыми: Nexus отдаёт 404, когда не смог
      # сходить наверх, и без запасного пути это читалось бы как «нет такого
      # артефакта».
      - name: Use Nexus mirror (gradle)
        run: bash .github/scripts/use-nexus.sh

      # Live-DB тесты нужны настоящему ArcadeDB. GitHub-hosted: Testcontainers.
      # Self-hosted Forgejo act_runner: Testcontainers/Ryuk не работает в DooD,
      # и раньше тесты просто СКИПАЛИСЬ — регрессия схемы на чистой БД на нашем
      # CI не ловилась вообще (слепота найдена 2026-07-17). Теперь вместо скипа —
      # ПОСТОЯННАЯ тест-БД lore_ci_test на хостовом ArcadeDB :2480 (решение
      # владельца): LoreArcadeDbTestResource видит LORE_TEST_DB_URL и идёт в неё,
      # пересоздавая базу на каждый прогон. system_aida_lore не затрагивается.
      # Пароль — локальный dev-стенд (он уже в docs/DEPLOYMENT.md), не секрет прода.
      # Must be a STEP (via $GITHUB_ENV) — the `runner` context is not available
      # in a job-level `env:`.
      # Адрес тест-БД ПОДБИРАЕТСЯ, а не задаётся строкой. Раньше здесь было
      # жёсткое host.docker.internal:2480 — имя Docker Desktop, которое на
      # Linux-раннере ci-server не резолвится. После переезда БД на ci-server
      # (июль 2026) фиксированный адрес перестал быть верным хоть где-то одном:
      # на ноуте это host.docker.internal, на сервере — шлюз docker-моста.
      # Проверяем кандидатов по /api/v1/ready и берём первого живого; не нашли —
      # падаем ГРОМКО, потому что молчаливый скип live-DB тестов уже прятал
      # регрессию схемы (слепота CI, найдена 2026-07-17).
      - name: Point live-DB tests at the standing test DB (self-hosted) / Testcontainers (github-hosted)
        shell: bash
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            echo "github-hosted — тесты пойдут через Testcontainers"; exit 0
          fi
          PW="${ARCADEDB_ROOT_PASSWORD:-playwithdata}"
          # Проверяем ДОСТУП, а не доступность. /api/v1/ready отвечает 204 кому
          # угодно — по нему сервер «живой» даже с неверным паролем, и тесты потом
          # падают вглубь непрозрачными 500 от сидера ([LORE SEED] ... status 500).
          # Поэтому кандидат считается годным, только если под нашей учёткой
          # отдаёт список баз.
          FOUND=""
          for cand in ${LORE_CI_DB_URL:-} http://host.docker.internal:2480 http://172.17.0.1:2480 http://127.0.0.1:2480; do
            if ! curl -sf -m 4 "$cand/api/v1/ready" >/dev/null 2>&1; then
              echo "  $cand — не отвечает"; continue
            fi
            if curl -sf -m 6 -u "root:$PW" "$cand/api/v1/databases" >/dev/null 2>&1; then
              FOUND="$cand"; break
            fi
            echo "  $cand — отвечает, но НЕ пускает под root с текущим паролем"
          done
          if [ -z "$FOUND" ]; then
            echo "::error::ArcadeDB для live-DB тестов недоступен ЛИБО не пускает под root. Пробовали: LORE_CI_DB_URL, host.docker.internal, 172.17.0.1, 127.0.0.1 (все :2480). Если сервер отвечает, но не пускает — задайте секрет ARCADEDB_ROOT_PASSWORD в Forgejo (Settings -> Actions -> Secrets): после переезда БД на ci-server прежний dev-пароль может не подходить. Молча пропускать live-DB тесты нельзя — так уже пряталась регрессия схемы (2026-07-17)."
            exit 1
          fi
          echo "тест-БД: $FOUND"
          echo "LORE_TEST_DB_URL=$FOUND" >> "$GITHUB_ENV"
          # CI-01/CIM-04: имя БД разводится по ИСТОЧНИКУ прогона, а не по типу
          # события. Один SHA всегда запускает push и pull_request ОДНОВРЕМЕННО, и
          # оба пересоздавали одну базу — кто пришёл вторым, получал её в момент
          # drop/create («Database is not available», найдено на 94157290).
          #
          # Разведения по event_name не хватило. Оно убирало гонку push↔PR, но два
          # РАЗНЫХ PR — событие у обоих pull_request — по-прежнему делили
          # lore_ci_pull_request. Это было записано как «редкий случай»; редким он
          # был ровно до того момента, когда в работе оказалось больше одного PR
          # (поймано 2026-08-03 на #356 и #357: три попытки подряд, каждый раз
          # падали РАЗНЫЕ тесты, ни один не связан с содержимым правки).
          #
          # Цена ошибки тут не в потерянном прогоне, а в неверном выводе: отказ
          # выглядит как дефект правки, и по одному статусу «failure» читается
          # именно так. Чтобы увидеть настоящую причину, пришлось поднимать полный
          # лог раннера.
          #
          # Номер PR как имя (а не run_id, который копился бы без сноса): набор
          # ограничен числом PR, а шаг уборки ниже снимает базу после прогона.
          # push ограничен двумя ветками (см. `on:` вверху) — там имён всего два.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DBNAME="lore_ci_pr_${{ github.event.number }}"
          else
            DBNAME="lore_ci_push_$(printf %s "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9' '_')"
          fi
          echo "тест-БД этого прогона: $DBNAME"
          echo "LORE_TEST_DB_NAME=$DBNAME" >> "$GITHUB_ENV"
          echo "LORE_TEST_DB_PASSWORD=$PW" >> "$GITHUB_ENV"

      # GitHub-hosted: fetch the JDK the normal way.
      - name: Set up JDK 21 (github-hosted)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Self-hosted stand: the Forgejo runner image already bakes JDK 21 into its
      # act tool cache, but setup-java looks under a different RUNNER_TOOL_CACHE dir
      # (and the cached version-folder name doesn't match its lookup), so it
      # re-downloads the JDK over the network — which on this Docker Desktop/WSL2
      # host intermittently fails ("socket disconnected before secure TLS") and
      # reliably red-lit backend-ci. Point JAVA_HOME straight at the baked JDK: no
      # download, no flake. Discovered by path so it survives a JDK patch bump.
      - name: Use runner-image JDK 21 (self-hosted)
        if: runner.environment != 'github-hosted'
        run: |
          JAVA_BIN="$(find /opt -type f -path '*/bin/java' 2>/dev/null | grep -iE 'temurin|jdk' | head -1)"
          JH="$(dirname "$(dirname "$JAVA_BIN")")"
          test -x "$JH/bin/java" || { echo "::error::no baked JDK found under /opt"; exit 1; }
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "$JH/bin" >> "$GITHUB_PATH"
          "$JH/bin/java" -version

      # Обе gradle-задачи под ретраем: канал до Maven Central нестабилен, и
      # обрыв загрузки зависимостей выглядит как отказ сборки. Пример отказа —
      # `Read timed out` на 52 артефактах подряд (PR #173, 2026-07-19).
      # Ретрай тут уже был, но только на сборке образа ниже, и промах пришёлся
      # ровно на непокрытый шаг. Настоящее решение — зеркало Nexus.
      - name: Gradle build (Quarkus backend)
        working-directory: backend
        run: bash ../.github/scripts/gradle-retry.sh build --no-daemon

      # `build` already runs the test task; kept explicit so a future test
      # regression is obvious in the log even if `build` is later narrowed.
      - name: Gradle test (Quarkus backend)
        working-directory: backend
        run: bash ../.github/scripts/gradle-retry.sh test --no-daemon

      # Validates the multi-stage Dockerfile compiles the app from source.
      # Gradle INSIDE the image build fetches deps from Maven Central directly:
      # unlike the job container, it does not inherit the runner's proxy envs, and
      # on this Docker Desktop/WSL2 host that direct path intermittently drops the
      # TLS handshake ("Remote host terminated the handshake") — the same flake the
      # JDK-download step above already had to design around. It red-lit a PR whose
      # tests were green (2026-07-17). Two mitigations, in order:
      #   1. pass the runner's proxy through as build-args when one is configured,
      #      so the in-image Gradle takes the same route as everything else;
      #   2. retry the build twice — a dropped handshake is transient, and the
      #      layer cache makes the retry cheap.
      - name: Docker image build (backend)
        run: |
          # CIM-02: наблюдаемость registry-mirror базовых образов до сборки.
          bash .github/scripts/registry-mirror-probe.sh || true
          # host.docker.internal внутри docker build НЕ резолвится сам: на Docker
          # Desktop это имя добавляет сам движок, на Linux-демоне ci-server — нет.
          # Прокси у раннера прописан именно так, поэтому без --add-host сборка
          # получала build-arg с неразрешимым хостом, шла напрямую и умирала по
          # таймауту — три попытки подряд «transient network?», хотя сеть тут ни
          # при чём. Даём билд-контейнеру тот же резолв, что есть у job'а.
          ARGS="--add-host=host.docker.internal:host-gateway"
          for v in HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy; do
            eval "val=\${$v:-}"
            [ -n "$val" ] && ARGS="$ARGS --build-arg $v=$val"
          done
          # Зеркало Nexus — В САМУ СБОРКУ ОБРАЗА, а не только в gradle-шаги job'а.
          # Init-скрипт от use-nexus.sh живёт в GRADLE_USER_HOME раннера, куда
          # `docker build` не заглядывает: до этой строки образ собирался прямо
          # из Maven Central и падал на обрывах TLS, пока ночные ДЕПЛОИ шли через
          # зеркало (lore-cd.yml этот arg передавал с самого начала). Переменные
          # ставит use-nexus.sh и только при живом Nexus — пусто значит «напрямую».
          for v in LORE_MAVEN_MIRROR LORE_PLUGIN_MIRROR; do
            eval "val=\${$v:-}"
            [ -n "$val" ] && ARGS="$ARGS --build-arg $v=$val"
          done
          # MIG-25: ретрай оставлен ТОЛЬКО для транзиентов. Раньше любой отказ
          # помечался «transient network?» и повторялся трижды — детерминированная
          # конфиг-ошибка (SRCFG00040 от пустого ARG, PR #164) съедала три попытки
          # по ~2 минуты, а сводка уводила диагностику в сеть, где ничего не было.
          # Тот же класс: «транзиенты» BuildKit оказались DNS-фейлом (MIG-20).
          # Теперь вывод грепается на маркеры детерминированных отказов — при
          # совпадении падаем С ПЕРВОЙ попытки и поднимаем НАСТОЯЩУЮ строку
          # ошибки в ::error::, а не утверждение о причине.
          DETERMINISTIC='SRCFG[0-9]+|Configuration validation failed|FAILURE: Build failed with an exception|Compilation failed|error: cannot find symbol|CommandSQLParsingException'
          # ...но сначала — ЯВНЫЕ маркеры сети. Gradle печатает «FAILURE: Build
          # failed with an exception» на ЛЮБОЙ отказ, включая обрыв TLS при
          # скачивании зависимостей — из-за чего сетевой сбой попадал в список
          # детерминированных и ретрай не отрабатывал вовсе (2026-08-01, PR #312:
          # упало с ПЕРВОЙ попытки на `Remote host terminated the handshake`,
          # хотя три попытки были предусмотрены именно для этого случая).
          # Проверка идёт раньше и перекрывает общий маркер: не смогли скачать —
          # это сеть, чем бы Gradle это ни назвал.
          TRANSIENT='Could not download|Could not GET|Remote host terminated the handshake|Read timed out|Connection reset|Could not resolve all (artifacts|files)'
          for attempt in 1 2 3; do
            echo "::group::docker build (attempt $attempt)"
            # shellcheck disable=SC2086
            docker build $ARGS -f backend/Dockerfile.local -t lore-backend:ci backend/ 2>&1 | tee /tmp/build.log
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$rc" -eq 0 ] && exit 0
            if grep -qE "$TRANSIENT" /tmp/build.log; then
              echo "::warning::попытка $attempt: отказ сети при скачивании зависимостей ($(grep -m1 -E "$TRANSIENT" /tmp/build.log | head -c 200)) — повторяю"
              sleep 10
              continue
            fi
            if grep -qE "$DETERMINISTIC" /tmp/build.log; then
              echo "::error::сборка упала ДЕТЕРМИНИРОВАННО — повтор не поможет. Причина: $(grep -m1 -E "$DETERMINISTIC" /tmp/build.log | head -c 300)"
              exit 1
            fi
            echo "::warning::попытка $attempt не удалась, маркеров детерминированного отказа в логе нет — похоже на сеть, повторяю"
            sleep 10
          done
          echo "::error::docker image build failed after 3 attempts; последняя ошибка: $(tail -c 300 /tmp/build.log)"
          exit 1

      # CIM-04: снять тест-БД этого прогона. Без уборки имена вида
      # lore_ci_pr_<номер> копились бы на живом ArcadeDB по одному на каждый PR —
      # ровно то возражение, из-за которого в прошлый раз отказались от имён на
      # основе run_id.
      #
      # always(): база должна уходить и после падения тестов. Иначе уборка
      # работала бы только там, где она не нужна.
      #
      # Отказ уборки НЕ валит прогон (|| true, continue-on-error): лишняя база —
      # мусор, а красный CI из-за неубранного мусора скрыл бы настоящий результат
      # сборки. Но и молчать нельзя: при отказе шаг пишет предупреждение, чтобы
      # накопление было видно, а не обнаружилось однажды по месту на диске.
      - name: Drop this run's test DB (self-hosted)
        if: always() && runner.environment != 'github-hosted'
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "${LORE_TEST_DB_URL:-}" ] || [ -z "${LORE_TEST_DB_NAME:-}" ]; then
            echo "тест-БД не заводилась (шаг подбора не дошёл) — убирать нечего"
            exit 0
          fi
          code=$(curl -s -o /tmp/drop.out -w '%{http_code}' -m 15 \
            -u "root:${LORE_TEST_DB_PASSWORD}" \
            -H 'Content-Type: application/json' \
            -d "{\"command\":\"drop database ${LORE_TEST_DB_NAME}\"}" \
            "${LORE_TEST_DB_URL}/api/v1/server" || echo 000)
          if [ "$code" = "200" ]; then
            echo "тест-БД ${LORE_TEST_DB_NAME} снята"
          else
            echo "::warning::не удалось снять тест-БД ${LORE_TEST_DB_NAME} (HTTP $code): $(head -c 300 /tmp/drop.out). База осталась на сервере — если такое повторяется, базы копятся."
          fi

      # SPRINT_QG_REBUILD/QG-12: канал 1 оставляет след в LORE. Причины и весь
      # разбор — в .github/scripts/qg-record-run.sh. Здесь важно одно: шаг стоит
      # под `if: always()`, потому что красная сборка — это РЕЗУЛЬТАТ измерения,
      # а не его отсутствие, и запись о ней нужна ровно так же, как о зелёной.
      # continue-on-error намеренно: недоступный LORE не должен красить сборку,
      # но и молчать не будет — скрипт печатает ::warning:: с кодом ответа.
      - name: 'QG: записать прогон в LORE'
        if: always()
        continue-on-error: true
        shell: bash
        env:
          QG_ROUTINE:            qg-ci-backend
          QG_JOB_STATUS:         ${{ job.status }}
          QG_RUN_URL:            https://git.seidrstudio.pro/AIDA/UnlimitedLORE/actions/runs/${{ github.run_number }}
          QG_COMMIT_SHA:         ${{ github.sha }}
          QG_PR_NUMBER:          ${{ github.event.pull_request.number || 'null' }}
          LORE_URL:              https://lore.odal.seidrstudio.pro
          LORE_QG_CLIENT_ID:     ${{ secrets.LORE_QG_CLIENT_ID }}
          LORE_QG_CLIENT_SECRET: ${{ secrets.LORE_QG_CLIENT_SECRET }}
          LORE_QG_TOKEN_URL:     ${{ secrets.LORE_QG_TOKEN_URL }}
        run: bash .github/scripts/qg-record-run.sh
