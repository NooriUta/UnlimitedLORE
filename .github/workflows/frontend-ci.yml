name: Frontend + MCP CI

# Промоушн-ветки включены НАМЕРЕННО — см. тот же комментарий в backend-ci.yml:
# без них PR develop→preprod и preprod→main шли бы без единого чека, а правило
# «мержить только по зелёному» опиралось бы на пустоту.
on:
  push:
    branches: [ "develop", "preprod" ]
  pull_request:
    branches: [ "develop", "preprod", "main" ]

jobs:
  build:
    # AL-88 (2026-07-30): пробовали выделенный раннер lore-only — см. тот же
    # комментарий в backend-ci.yml про необъяснённый сбой. Откачено к общему пулу.
    # CIM-05 (2026-10-20): причина найдена — метка lore-only была
    # зарегистрирована без образа job-контейнера (у всех рабочих раннеров вида
    # «ubuntu-latest:docker://forgejo-ci-runtime:jdk21»), и job поднимался на
    # образе по умолчанию без JDK и оснастки. Метка исправлена на
    # «lore-only:docker://forgejo-ci-runtime:jdk21». Разбор — задача
    # SPRINT_LORE_CI_MIRROR/CIM-05. Frontend переезжает первым: его джоб идёт
    # без `container:`, то есть проверяет именно сопоставление метки.
    runs-on: lore-only
    steps:
      - uses: actions/checkout@v7
        with:
          # S3-10: ci-scope.sh сравнивает base...HEAD — нужна история, а
          # checkout по умолчанию мелкий (depth 1). Репозиторий ~10 МБ.
          fetch-depth: 0

      # SPRINT_UXR_S3_V2_INFRA/S3-10 (D-2026-UXR-V2-FOLDER-V1-FROZEN): что гонять —
      # по изменённым путям. Правка web-next/ не гоняет v1 и MCP; правка
      # backend/ / mcp-server/ гоняет всё. Тяжёлые шаги ниже стоят под флагами
      # v1 / mcp. Шаги, а не job целиком: job остаётся и зеленеет, так что
      # обязательный чек не повисает «ожидается», а пропуск виден в логе.
      # Дифф не вычислился — гоняется всё (см. ci-scope.sh).
      - name: Scope by changed paths (S3-10)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/ci-scope.sh ci

      # Раннер получает HTTP_PROXY из своей конфигурации, и она переезжает вместе
      # с ним. После переноса раннеров на ci-server прокси остался прописанным
      # (…:10809), но там его нет — setup-node падал за 0 секунд с
      # «tunneling socket could not be established, ECONNREFUSED 172.17.0.1:10809»,
      # и красным был ЛЮБОЙ PR, независимо от содержимого.
      #
      # Не «убрать прокси», а не зависеть от того, жив ли он: проверяем
      # доступность и, если не отвечает, снимаем переменные на остаток job'а.
      # Так один и тот же workflow работает и с прокси, и без него.
      #
      # ПРОКСИ НУЖЕН, а не «желателен» — снимать его из конфигурации раннера
      # нельзя. Прямой выход у ci-server есть, но деградирован: 20 пакетов через
      # прокси — 20 секунд, напрямую — 2 мин 55 с, а `apk add curl` напрямую
      # вообще отваливается по таймауту. Ускоряет при этом не VPN (npm по
      # правилам маршрутизации идёт мимо него, direct), а сам xray —
      # переиспользованием соединений. Тем же прокси ходит Telegram-уведомление
      # из lore-cd.yml.
      #
      # ПРОВЕРКА ИМЕННО TCP-КОННЕКТОМ, И ЭТО НАМЕРЕННО. Не заменять на HTTP-пробу
      # через busybox wget: он получает через этот прокси 400 Bad Request (curl и
      # npm при этом работают), и такая проба ложно объявила бы живой прокси
      # мёртвым — переменные снялись бы, npm ушёл бы напрямую и job умер бы по
      # таймауту, причём с невнятной ошибкой npm вместо внятной причины.
      - name: Resolve a working proxy address (or drop it)
        run: bash .github/scripts/resolve-proxy.sh

      # npm через зеркало в локальной сети. Прямой реестр на этом канале не
      # доживает до конца установки:
      #
      #   npm error code EIDLETIMEOUT
      #   npm error Idle timeout reached for host `registry.npmjs.org:443`
      #
      # `npm ci` берёт адреса из package-lock.json, и смена реестра сама по себе
      # могла бы не подействовать — но npm с 9-й версии подменяет хост у
      # npmjs-ссылок (`replace-registry-host=npmjs`, на раннере npm 11). Значит
      # lock-файл пересоздавать не нужно и он остаётся пригодным вне этой сети.
      #
      # Если Nexus недоступен, скрипт молча ничего не меняет — установка идёт
      # напрямую, как раньше.
      - name: Use Nexus mirror (npm, gradle)
        run: bash .github/scripts/use-nexus.sh

      - name: Set up Node.js (github-hosted)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Self-hosted стенд: образ раннера УЖЕ несёт Node нужной версии, но
      # setup-node этого не видит и качает дистрибутив с GitHub. На этом канале
      # загрузка обрывается:
      #
      #   Acquiring 24.18.0 - x64 from https://github.com/actions/node-versions/...
      #   aborted
      #   Waiting 20 seconds before trying again
      #
      # Пять минут ожидания и красный прогон — при том, что ровно эта версия
      # лежит в образе. Проверено: `node --version` в forgejo-ci-runtime:jdk21
      # отдаёт v24.18.0, то есть ту же, что скачивалась.
      #
      # Зеркальный случай уже был у бэкенда с JDK и лечился так же — брать из
      # образа вместо загрузки. Здесь просто не заметили, потому что фронт падал
      # реже: у setup-node есть собственный повтор, и он иногда спасал.
      #
      # Кэш npm тут не настраивается намеренно: его включал `cache: 'npm'` у
      # setup-node, а без действия настраивать нечем. Потеря невелика — npm
      # ходит в реестр, который после появления зеркала Nexus станет локальным.
      - name: Use runner-image Node (self-hosted)
        if: runner.environment != 'github-hosted'
        run: |
          command -v node >/dev/null || { echo "::error::в образе раннера нет node"; exit 1; }
          echo "node $(node --version), npm $(npm --version) — из образа, без загрузки"

      - name: LORE frontend — install + typecheck + test + build
        if: steps.scope.outputs.v1 == 'true'
        run: |
          bash .github/scripts/npm-retry.sh ci
          npm run check:statuses
          npm run lint
          npm test
          npm run build

      - name: MCP server — install + typecheck + test + build
        if: steps.scope.outputs.mcp == 'true'
        working-directory: mcp-server
        run: |
          bash ../.github/scripts/npm-retry.sh ci
          npm test
          npm run build

      # SPRINT_LORE_DEPS_HOUSEKEEPING/DEP-06: уязвимости зависимостей — ИНФОРМАЦИОННЫЙ
      # гейт. На 04.11.2026 Dependabot держал 76 открытых алертов, а видны они были
      # только тому, кто зайдёт на GitHub-зеркало: здесь, в Forgejo, о них не знал
      # никто. Не блокирует (правило: блокируют только гейты корректности), но
      # critical/high печатаются ::warning:: в сводку прогона.
      # «Не удалось проверить» ≠ «уязвимостей нет»: если audit не ответил (реестр,
      # прокси, таймаут — локально 04.11 он висел минутами), это говорится вслух.
      - name: npm audit (informational)
        if: steps.scope.outputs.v1 == 'true' || steps.scope.outputs.mcp == 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          for dir in . mcp-server; do
            if out=$(cd "$dir" && timeout 150 npm audit --json --omit=dev 2>/dev/null); then rc=0; else rc=$?; fi
            summary=$(printf '%s' "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const v=JSON.parse(s).metadata.vulnerabilities;console.log([v.critical,v.high,v.moderate,v.low].join(' '))}catch{console.log('')}})")
            if [ -z "$summary" ]; then
              echo "::warning::npm audit ($dir) не выполнился (код $rc) — уязвимости НЕ проверены, это не «ноль»"
              continue
            fi
            set -- $summary
            echo "npm audit ($dir, prod-зависимости): critical=$1 high=$2 moderate=$3 low=$4"
            if [ "$1" != 0 ] || [ "$2" != 0 ]; then
              echo "::warning::npm audit ($dir): critical=$1 high=$2 — см. SPRINT_LORE_DEPS_HOUSEKEEPING"
            fi
          done

      # Validates the frontend Dockerfile (npm build + nginx.conf.template) as shipped.
      # Внутри образа идёт `npm ci`, а прямой выход у ci-server деградирован
      # (см. комментарий к шагу отсечения прокси выше) — без прокси эта сборка
      # либо тянется минутами, либо падает по таймауту. Прокси у раннера задан
      # как host.docker.internal, а внутри docker build это имя само НЕ
      # резолвится на Linux-демоне: нужен --add-host, иначе build-arg указывает
      # в никуда. Та же правка, что в backend-ci.yml.
      - name: Docker image build (frontend + nginx)
        if: steps.scope.outputs.v1 == 'true'
        run: |
          # CIM-02: наблюдаемость registry-mirror базовых образов до сборки.
          bash .github/scripts/registry-mirror-probe.sh || true
          ARGS="--add-host=host.docker.internal:host-gateway"
          for v in HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy; do
            eval "val=\${$v:-}"
            [ -n "$val" ] && ARGS="$ARGS --build-arg $v=$val"
          done
          # shellcheck disable=SC2086
          docker build $ARGS -t lore-app:ci .

      # Конфиг nginx стал шаблоном, и это ввело два новых способа сломать стенд
      # МОЛЧА: опечатка в шаблоне видна не на сборке образа, а только когда
      # nginx стартует на стенде; а вшитый чужой адрес не виден вообще никак,
      # пока кто-то не откроет установку и не уедет на посторонний хост.
      # Поэтому конфиг рендерится и проверяется настоящим nginx, в обоих
      # состояниях переменных.
      #
      # `nginx -T` (не -t): он и проверяет синтаксис, и печатает СОБРАННЫЙ
      # конфиг — по нему же и проверяем подстановку. Запускать нужно именно
      # `nginx …`: docker-entrypoint.sh базового образа прогоняет
      # /docker-entrypoint.d (то есть envsubst) только когда команда начинается
      # с nginx; `sh -c` тихо пропустил бы подстановку, и проверка стала бы
      # проверкой шаблона, а не результата.
      - name: nginx config — рендер шаблона и отсутствие вшитых адресов
        if: steps.scope.outputs.v1 == 'true'
        run: |
          # pipefail обязателен: ниже `nginx -T` стоит в конвейере, и без него
          # шаг видел бы только код grep — то есть синтаксическая ошибка в
          # конфиге прошла бы проверку насквозь, а именно её мы и ловим.
          set -eo pipefail
          # Апстримы конфига (`proxy_pass http://lore-backend:9100`) резолвятся
          # при ЗАГРУЗКЕ конфига, а не при запросе, — и вне compose-сети такого
          # имени нет: nginx падает с «host not found in upstream» ещё до того,
          # как дойдёт до проверяемых строк. Проверяем конфиг, а не наличие
          # бэкенда, поэтому имена просто объявляем; заглушка на loopback здесь
          # достаточна — соединяться мы никуда не собираемся.
          STUBS="--add-host lore-backend:127.0.0.1 --add-host host.docker.internal:127.0.0.1"
          echo "── случай 1: переменные НЕ заданы (чужая установка) ──"
          # `nginx -T` печатает файл целиком, вместе с комментариями, а в
          # шаблоне прежний адрес НАЗВАН — в пояснении, почему его там больше
          # нет. Без отсечения комментариев проверка падала бы на собственной
          # документации. Сравниваем только боевые директивы.
          docker run --rm $STUBS lore-app:ci nginx -T | grep -v '^[[:space:]]*#' > /tmp/nginx-default.conf
          if grep -q "seidrstudio\.pro" /tmp/nginx-default.conf; then
            echo "ОШИБКА: в конфиг без переменных попал адрес конкретной установки —"
            echo "посторонняя установка уедет редиректом на чужой хост."
            grep -n "seidrstudio\.pro" /tmp/nginx-default.conf
            exit 1
          fi
          echo "ok: адресов конкретной установки нет, синтаксис принят"

          echo "── случай 2: переменные заданы ──"
          # shellcheck disable=SC2086
          docker run --rm $STUBS \
            -e LORE_PUBLIC_URL=https://lore.example.org \
            -e LORE_OIDC_ORIGIN=https://auth.example.org \
            -e LORE_VOLVA_ORIGIN=https://volva.example.org \
            lore-app:ci nginx -T > /tmp/nginx-configured.conf
          grep -q "return 301 https://lore.example.org" /tmp/nginx-configured.conf || {
            echo "ОШИБКА: LORE_PUBLIC_URL не подставилась в редирект"; exit 1; }
          grep -q "connect-src 'self' https://auth.example.org" /tmp/nginx-configured.conf || {
            echo "ОШИБКА: LORE_OIDC_ORIGIN не подставилась в CSP"; exit 1; }
          # SPRINT_VIZ_EMBED/EMB-L1: origin Völva — в frame-src, иначе встройка блокируется молча.
          grep -q "frame-src 'self' https://auth.example.org https://volva.example.org" /tmp/nginx-configured.conf || {
            echo "ОШИБКА: LORE_VOLVA_ORIGIN не подставилась в frame-src CSP"; exit 1; }
          echo "ok: обе переменные подставились, синтаксис принят"

  # SPRINT_UXR_S3_V2_INFRA/S3-01 (D-2026-UXR-V2-FOLDER-V1-FROZEN): LORE v2 —
  # каталог web-next/ со своим package.json, vite.config и Dockerfile. Отдельный
  # job, а не шаги в `build`: у v2 свои зависимости и свой образ, и красный v2
  # не должен прятаться за красным v1 (и наоборот) — в сводке это два чека.
  # Фильтр по путям (правка web-next → только v2, правка бэкенда → оба веба)
  # и заморозка образа v1 в CD — задача S3-10, здесь job бежит всегда.
  # S3-10 (сделано): job бежит всегда, но его шаги — под флагом v2 из
  # ci-scope.sh: v2 гоняется при правке web-next/, общего шаблона nginx и
  # бэкенда/MCP/контрактов (тесты обоих вебов); при правке только src/ (v1) — нет.
  web-next:
    runs-on: lore-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # S3-10: дифф base...HEAD для ci-scope.sh

      # S3-10: что гонять — по путям (разбор — у такого же шага в `build`).
      - name: Scope by changed paths (S3-10)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/ci-scope.sh ci

      # Те же три шага подготовки, что у `build` (разбор причин — там):
      # живой прокси или его снятие, зеркало Nexus, Node из образа раннера.
      - name: Resolve a working proxy address (or drop it)
        run: bash .github/scripts/resolve-proxy.sh

      - name: Use Nexus mirror (npm)
        run: bash .github/scripts/use-nexus.sh

      - name: Set up Node.js (github-hosted)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Use runner-image Node (self-hosted)
        if: runner.environment != 'github-hosted'
        run: |
          command -v node >/dev/null || { echo "::error::в образе раннера нет node"; exit 1; }
          echo "node $(node --version), npm $(npm --version) — из образа, без загрузки"

      # Seiðr-kit (kit/, D-2026-UXR-KIT-REACT): отдельный пакет со своими
      # тестами (сверка токенов с v1, STYLE-01, тема). Тесты web-next их не
      # запускают — поэтому свой шаг, и до web-next: сломанный kit ломает v2.
      # S4-00e: здесь же единый CSS-слой — снимок голого HTML
      # (kit/demo/seidr-bare.html, toMatchFileSnapshot; CI=true не пишет снимок,
      # а валит расхождение) и «у каждого класса kit есть правило в seidr.css».
      - name: Seiðr-kit (kit) — install + typecheck + test
        working-directory: kit
        run: |
          bash ../.github/scripts/npm-retry.sh ci
          npm run typecheck
          npm test

      - name: LORE v2 (web-next) — install + typecheck + test + build
        if: steps.scope.outputs.v2 == 'true'
        working-directory: web-next
        run: |
          bash ../.github/scripts/npm-retry.sh ci
          npm run typecheck
          npm test
          npm run build

      # SPRINT_UXR_S4_UI_SHELL_LISTS/S4-00d: axe на витрине /kit — отдельным
      # шагом, чтобы a11y-гейт был виден в сводке по имени, а не тонул среди
      # прочих тестов. Витрина собрана из всех элементов Seiðr-kit: потерянное
      # имя/роль/ARIA у любого элемента валит именно этот шаг. Контраст в jsdom
      # не считается — его меряет браузерный прогон (S4-12).
      - name: LORE v2 — axe на /kit (витрина Seiðr-kit)
        working-directory: web-next
        run: npx vitest run src/pages/KitPage.test.tsx

      # Контекст — корень репозитория: образу нужен общий nginx.conf.template
      # (прокси /lore/ тот же, что у v1). Прокси раннера пробрасывается так же,
      # как в сборке образа v1 выше.
      - name: Docker image build (v2, web-next + nginx)
        if: steps.scope.outputs.v2 == 'true'
        run: |
          ARGS="--add-host=host.docker.internal:host-gateway"
          for v in HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy; do
            eval "val=\${$v:-}"
            [ -n "$val" ] && ARGS="$ARGS --build-arg $v=$val"
          done
          # shellcheck disable=SC2086
          docker build $ARGS -f web-next/Dockerfile -t lore-app-next:ci .

      # Образ должен реально отдавать v2 через nginx, а не просто собраться:
      # синтаксис собранного конфига (`nginx -T`, апстримы объявлены заглушками,
      # как в проверке v1) и наличие бандла v2 в корне сайта.
      - name: v2 image — nginx config + bundle
        if: steps.scope.outputs.v2 == 'true'
        run: |
          set -eo pipefail
          STUBS="--add-host lore-backend:127.0.0.1 --add-host host.docker.internal:127.0.0.1"
          # shellcheck disable=SC2086
          docker run --rm $STUBS lore-app-next:ci nginx -T > /dev/null
          docker run --rm --entrypoint sh lore-app-next:ci -c \
            'grep -q "<title>LORE v2</title>" /usr/share/nginx/html/index.html' || {
            echo "ОШИБКА: в образе lore-app-next нет бандла v2"; exit 1; }
          echo "ok: nginx-конфиг принят, бандл v2 на месте"
          # Общий скрипт старта (S3-02) реально лежит в образе v2 и метит лог.
          # Вывод — в переменную, а не `| grep -q`: grep -q закрывает трубу на
          # первом совпадении, docker run ловит EPIPE и при pipefail роняет шаг
          # при живом скрипте.
          # shellcheck disable=SC2086
          start_log=$(docker run --rm $STUBS lore-app-next:ci nginx -t 2>&1) || {
            echo "ОШИБКА: nginx -t в образе v2 упал:"; echo "$start_log"; exit 1; }
          printf '%s\n' "$start_log" | grep -q '^\[LORE v2\]' || {
            echo "ОШИБКА: скрипт старта 30-lore-public-url.sh не отработал в образе v2. Вывод старта:"
            echo "$start_log"; exit 1; }
          echo "ok: общий скрипт старта отработал с меткой [LORE v2]"

      # S3-02: сервис lore-app-next в compose. Синтаксис и слияние проверяет сам
      # docker compose (текстовый тест в web-next/src/front-shared.test.ts
      # YAML не разбирает). Без оверлея Traefik — его сеть есть только на
      # ci-server.
      - name: compose — сервис lore-app-next описан и разбирается
        if: steps.scope.outputs.v2 == 'true'
        run: |
          set -eo pipefail
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml config --services | grep -qx lore-app-next || {
            echo "ОШИБКА: в docker-compose.yml нет сервиса lore-app-next"; exit 1; }
          docker compose -f docker-compose.yml config lore-app-next | grep -q 'dockerfile: web-next/Dockerfile' || {
            echo "ОШИБКА: lore-app-next собирается не из web-next/Dockerfile"; exit 1; }
          echo "ok: compose видит lore-app-next из web-next/Dockerfile"

