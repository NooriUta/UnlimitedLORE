name: Seiðr-kit → реестр пакетов

# SPRINT_UXR_S14_KIT5/K5-PACKAGE-DELIVERY · kit пакетом с версией для чужих репозиториев.
# Сборка (dist: JS + типы), тесты kit, проверка «глазами потребителя» (npm pack → чистая папка →
# установка → импорт, без тестовых зависимостей) и публикация в npm-реестр Forgejo организации AIDA.
#
# ТОЛЬКО ручной запуск. dry_run — всё, кроме записи. publish — нужен секрет KIT_NPM_TOKEN (токен
# Forgejo с правом write:package); без него шаг падает громко с BLOCKED, а не пропускается молча.
# Логика — node-скриптами в kit/scripts (многострочный bash в run: ломал разбор у Forgejo).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry_run — собрать, проверить, пробная публикация; publish — записать в реестр'
        required: true
        default: 'dry_run'
        type: choice
        options: ['dry_run', 'publish']

concurrency:
  group: kit-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: lore-only
    steps:
      - uses: actions/checkout@v7

      - name: Resolve a working proxy address (or drop it)
        run: bash .github/scripts/resolve-proxy.sh

      - name: Use Nexus mirror (npm)
        run: bash .github/scripts/use-nexus.sh

      - name: Node из образа раннера
        run: node --version

      - name: kit — установка и тесты
        working-directory: kit
        run: bash ../.github/scripts/npm-retry.sh ci && npm test

      - name: kit — сборка и проверка глазами потребителя
        working-directory: kit
        run: npm run consumer-check

      - name: kit — пробная публикация
        if: inputs.mode == 'dry_run'
        working-directory: kit
        run: node scripts/publish.mjs --dry

      - name: kit — публикация в реестр
        if: inputs.mode == 'publish'
        working-directory: kit
        env:
          KIT_NPM_TOKEN: ${{ secrets.KIT_NPM_TOKEN }}
        run: node scripts/publish.mjs
